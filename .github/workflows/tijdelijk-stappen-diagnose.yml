# TIJDELIJK: bekijkt de testpagina met het blok Stappen in een echte browser,
# omdat de site vanuit Claude's omgeving niet bereikbaar is. Wordt verwijderd
# zodra de oorzaak gevonden is. Draait enkel op deze branch.
name: Tijdelijk stappen-diagnose
on:
  push:
    branches: [claude/peaceful-hypatia-pjqov4]
    paths: ['.github/diag/**', '.github/workflows/tijdelijk-stappen-diagnose.yml']
jobs:
  kijk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright-core@1.47.2
      - run: node .github/diag/stappen.mjs https://syndicoach.be/test-messaging-homepage/
