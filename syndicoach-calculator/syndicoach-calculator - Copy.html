<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontdek je Syndicoach-formule</title>
<style>
/* Alle CSS is genest onder #sc-calc. Je thema kan niets breken, en omgekeerd. */
#sc-calc{
  --sc-blue:#0f5c8c; --sc-blue-dark:#0b4468; --sc-blue-soft:#e8f2f8;
  --sc-mint:#8ce8cb; --sc-mint-dark:#4ec7a2;
  --sc-ink:#12384f; --sc-muted:#6b8697; --sc-line:#e3ebf0; --sc-shade:#f6f9fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--sc-ink); line-height:1.5; max-width:680px; margin:0 auto; padding:8px;
  -webkit-font-smoothing:antialiased;
}
#sc-calc *,#sc-calc *::before,#sc-calc *::after{box-sizing:border-box}
#sc-calc h1,#sc-calc h2,#sc-calc p,#sc-calc ul,#sc-calc li{margin:0;padding:0;list-style:none}
#sc-calc .sc-svg{display:block}
#sc-calc .sc-card{background:#fff;border:1px solid var(--sc-line);border-radius:18px;padding:24px 24px 20px;box-shadow:0 10px 28px -20px rgba(15,92,140,.4)}

/* stepper */
#sc-calc .sc-steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:24px}
#sc-calc .sc-dot{width:9px;height:9px;border-radius:50%;background:#dde6ec;transition:.25s}
#sc-calc .sc-dot.is-done{background:var(--sc-blue)}
#sc-calc .sc-dot.is-active{width:26px;border-radius:99px;background:var(--sc-blue)}

/* vraag */
#sc-calc .sc-q{display:flex;align-items:flex-start;gap:9px;font-size:1.18rem;font-weight:700;color:var(--sc-ink);letter-spacing:-.01em;position:relative;z-index:1}
#sc-calc .sc-q .sc-ico{color:var(--sc-blue);flex:0 0 auto;position:relative;top:3px}
#sc-calc .sc-help{color:var(--sc-muted);font-size:.87rem;margin-top:4px;position:relative;z-index:1}

/* keuzekaarten */
#sc-calc .sc-opts{display:grid;gap:8px;margin-top:16px}
#sc-calc .sc-opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  border:1.5px solid var(--sc-line);background:#fff;border-radius:12px;padding:13px 15px;cursor:pointer;transition:.14s;font:inherit;color:inherit}
#sc-calc .sc-opt:hover{border-color:#b9d3e2;background:#fbfdfe}
#sc-calc .sc-opt.is-sel{border-color:var(--sc-blue);background:var(--sc-blue-soft)}
#sc-calc .sc-opt-ico{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#eef4f8;display:grid;place-items:center;color:var(--sc-blue)}
#sc-calc .sc-opt.is-sel .sc-opt-ico{background:#fff}
#sc-calc .sc-opt-txt{flex:1 1 auto;min-width:0}
#sc-calc .sc-opt-t{display:block;font-weight:650;font-size:.95rem}
#sc-calc .sc-opt-d{display:block;font-size:.83rem;color:var(--sc-muted);margin-top:1px}
#sc-calc .sc-check{align-self:center;width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.5px solid #cfdde6;display:grid;place-items:center;color:transparent}
#sc-calc .sc-opt.sc-multi .sc-check{border-radius:6px}
#sc-calc .sc-opt.is-sel .sc-check{background:var(--sc-blue);border-color:var(--sc-blue);color:#fff}

/* keuzetegels, met ruimte voor een afbeelding (svg) per tegel. Standaard 2
   naast elkaar (sc-tiles); sc-tiles-3 zet er 3 op een rij voor vragen met
   drie opties. */
#sc-calc .sc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#sc-calc .sc-tiles.sc-tiles-3{grid-template-columns:repeat(3,1fr)}
#sc-calc .sc-tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  border:1.5px solid var(--sc-line);background:#fff;border-radius:16px;padding:20px 12px 16px;cursor:pointer;transition:.14s;font:inherit;color:inherit}
#sc-calc .sc-tile:hover{border-color:#b9d3e2;background:#fbfdfe}
#sc-calc .sc-tile.is-sel{border-color:var(--sc-blue);background:var(--sc-blue-soft)}
#sc-calc .sc-tile-img{width:108px;height:108px;flex:0 0 auto;display:grid;place-items:center}
#sc-calc .sc-tiles-3 .sc-tile{padding:16px 8px 12px}
#sc-calc .sc-tiles-3 .sc-tile-img{width:82px;height:82px}
#sc-calc .sc-tile-img svg{width:100%;height:100%;display:block}
#sc-calc .sc-tile-t{font-weight:650;font-size:.92rem;line-height:1.25}
#sc-calc .sc-tile-d{font-size:.79rem;color:var(--sc-muted);line-height:1.35}
#sc-calc .sc-tile-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid #cfdde6;background:#fff;display:grid;place-items:center;color:transparent}
#sc-calc .sc-tile.is-sel .sc-tile-check{background:var(--sc-blue);border-color:var(--sc-blue);color:#fff}
@media (max-width:640px){#sc-calc .sc-tiles.sc-tiles-3{grid-template-columns:1fr 1fr}}
@media (max-width:480px){#sc-calc .sc-tiles{grid-template-columns:1fr}}

/* slider */
#sc-calc .sc-slider{padding:26px 2px 2px;text-align:center}
#sc-calc .sc-kv{font-size:2.7rem;font-weight:800;color:var(--sc-blue);line-height:1;letter-spacing:-.03em}
#sc-calc .sc-kv-u{font-size:1rem;color:var(--sc-muted);margin-left:7px}
#sc-calc input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#e3ebf0;margin:24px 0 6px;outline:none}
#sc-calc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--sc-blue);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#sc-calc input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--sc-blue);cursor:pointer}
#sc-calc .sc-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--sc-muted)}

/* gebouw-illustratie die met de kavel-slider meegroeit/krimpt */
#sc-calc .sc-bldg{display:flex;justify-content:center;margin-top:26px;margin-bottom:14px;position:relative;z-index:0}
#sc-calc .sc-bldg-img{width:230px;height:230px;display:grid;place-items:end center;transform-origin:bottom center}
#sc-calc .sc-bldg-recap{margin-top:18px;margin-bottom:6px}
#sc-calc .sc-bldg-img.sc-bldg-sm{width:130px;height:130px}
#sc-calc .sc-tile-ico-fb{width:64px;height:64px;border-radius:50%;background:#eef4f8;display:grid;place-items:center;color:var(--sc-blue)}
/* De wrap liep vroeger met een negatieve marge 24px aan elke kant buiten de tekstkolom, om extra
   breedte te winnen. Dat betekende ook dat de ballonnetjes tot tegen (en op smallere kolommen over)
   de rand van de kaart kwamen. Hij blijft nu netjes binnen de kolom; de ruimte wordt in de plaats
   gewonnen door kleinere ballonnetjes en een compactere slinger. */
/* --- Podium ---------------------------------------------------------------
   Een absolute laag over de kaart, precies zo breed als de tekstkolom. De stappen zetten in hun eigen
   body enkel lege "slots" met de juiste hoogte; het podium meet die slots op en schuift het gebouw en
   de ballonnetjes ernaartoe. Zo bepaalt de gewone documentflow nog altijd de hoogte van de kaart,
   terwijl de bewegende elementen erboven blijven leven. */
#sc-calc .sc-card{position:relative}
#sc-calc .sc-stage{position:absolute;left:24px;right:24px;top:0;bottom:0;pointer-events:none;z-index:2;
  opacity:1;transition:opacity .45s ease;
  --sc-ease-settle:cubic-bezier(.22,.72,.24,1); --sc-ease-pop:cubic-bezier(.2,1.42,.34,1);
  /* verplaatsen: eerst een kleine terugtrek (anticipatie), dan glijden, dan zacht doorschieten */
  --sc-ease-move:cubic-bezier(.42,-0.10,.58,1.08);
  /* Vertrekken en aankomen horen niet dezelfde curve te volgen. Wie wegvliegt, komt traag los en
     versnelt (ease in) -- die beweging hoeft nergens te landen. Wie ergens moet gaan staan, vertrekt
     kordaat en remt af (ease out), met een haartje doorschot op het einde. Dezelfde symmetrische
     curve voor allebei is precies wat een reeks bewegingen monotoon maakt. */
  --sc-ease-vertrek:cubic-bezier(.58,.02,.92,.36);
  --sc-ease-aankomst:cubic-bezier(.14,.78,.24,1.03)}
#sc-calc .sc-stage.is-hidden{opacity:0}
/* bij de allereerste opbouw mag er niets bewegen: het gebouw hoort meteen te staan waar het hoort,
   niet vanuit de hoek naar binnen te zweven */
#sc-calc .sc-stage.is-instant .sc-orbit-tile,#sc-calc .sc-stage.is-instant .sc-stage-bldg{transition:none!important}
/* de stap-body wisselt in één keer; een korte fade maakt van die wissel een overgang i.p.v. een knip */
#sc-calc .sc-fade-in{animation:sc-body-in .3s ease var(--sc-body-delay,0s) both}
@keyframes sc-body-in{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
/* De vraag en haar hulpzin wisselen bij élke stap, altijd op dezelfde plek en in het grootste
   lettertype van de kaart. Schuiven ze mee omhoog met de rest, dan trekt net dát de aandacht, terwijl
   het de rustpunten van de bladspiegel zouden moeten zijn. Deze tegenbeweging (-8px waar de body +8px
   doet) heft de verschuiving precies op: de titel blijft stilstaan en wisselt enkel, trager dan de
   rest, van de ene tekst naar de andere. */
#sc-calc .sc-fade-in .sc-q,#sc-calc .sc-fade-in .sc-help{
  animation:sc-q-in .52s ease var(--sc-body-delay,0s) both}
@keyframes sc-q-in{from{opacity:0;transform:translate3d(0,-8px,0)}to{opacity:1;transform:none}}
#sc-calc .sc-slot{width:100%;pointer-events:none}
/* de achtergelaten kopie van een blok dat aan de onderrand hing: ligt over de kaart, onder het podium,
   en raakt niets aan */
#sc-calc .sc-spook{position:absolute;pointer-events:none;z-index:1}
/* Het gebouw hangt aan de ONDERkant van het podium, niet aan de bovenkant: top:100% zet zijn nulpunt
   op de onderrand, en --y is de (negatieve) afstand daarboven. Wisselt de kaart van hoogte, dan schuift
   die onderrand mee en blijft het gebouw er op dezelfde afstand van staan -- het staat op de grond
   i.p.v. aan het plafond te hangen. De ballonnetjes en de tekst blijven wél aan de bovenkant hangen,
   want die horen bij de tekstflow, die vanaf boven wordt opgebouwd. */
#sc-calc .sc-stage-bldg{position:absolute;left:0;top:100%;width:300px;height:300px;
  display:grid;place-items:end center;
  transform:translate3d(var(--x,0px),var(--y,0px),0) translate(-50%,-100%) scale(var(--k,1));
  transform-origin:50% 100%;
  transition:transform .82s var(--sc-ease-move),opacity .5s ease}
#sc-calc .sc-stage-bldg-in{width:100%;height:100%;display:grid;place-items:end center;
  transform-origin:bottom center}
#sc-calc .sc-stage-bldg svg{width:100%;height:100%;display:block}
#sc-calc .sc-stage-lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;
  opacity:1;transition:opacity .35s ease}
#sc-calc .sc-stage-lines.is-off{opacity:0}
@media (max-width:640px){
  #sc-calc .sc-stage{display:none}
  #sc-calc .sc-slot{display:none}
}
#sc-calc .sc-onlymob{display:none}
@media (max-width:640px){#sc-calc .sc-onlymob{display:block}}


/* --- Ballonnetjes ---------------------------------------------------------
   De tegel zelf is enkel een ankerpunt zonder eigen vorm: de blob erbinnen draagt de vorm en
   groeit/kantelt, de tekst blijft ongeschaald en dus scherp. Alles beweegt uitsluitend met
   transform en opacity -- nooit width/height/max-height. Dat laatste was de oorzaak van het
   "verspringen" bij hover: elke breedtewijziging herbrak de tekst en deed de regels verschuiven. */
/* De plaats van een ballonnetje zit volledig in de transform (--x/--y), niet in left/top. Verhuizen
   naar een andere stap is daardoor gewoon een transform-transitie: het glijdt, het springt niet. --k
   is de schaal (1 in het diagram, kleiner in de herinneringsstrook bovenaan). */
#sc-calc .sc-orbit-tile{position:absolute;left:0;top:0;width:112px;
  display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit;text-align:center;
  --k:1;
  transform:translate3d(var(--x,0px),var(--y,0px),0)
            translate3d(var(--push-x,0px),var(--push-y,0px),0)
            translate3d(0,var(--in-y,0px),0)
            translate(-50%,-50%) scale(var(--k));
  /* Duur en vertraging worden per beweging vanuit JS gezet (transitionDuration/-Delay). Ze mogen
     NIET uit een custom property komen: verandert die tegelijk met de waarde die moet bewegen, dan
     slaat de browser de transitie over en springt het ballonnetje. Verplaatsing en fade krijgen
     dezelfde vertraging, zodat een ballonnetje als één beweging vertrekt. */
  transition:transform .78s var(--sc-ease-move),opacity .5s ease;
  z-index:2;pointer-events:auto;-webkit-tap-highlight-color:transparent}
/* onderweg naar het podium: nog niet zichtbaar */
/* nog niet binnen: onzichtbaar, kleiner en een tikje lager, zodat het straks naar boven toe
   op zijn plaats komt i.p.v. zomaar te verschijnen */
#sc-calc .sc-orbit-tile.is-in{opacity:0;--k:.55;--in-y:16px}
/* niet aangeduid, dus vanaf de herinneringsstrook onzichtbaar (blijft in de DOM zodat terugkeren
   naar stap 2 gewoon weer een transitie is) */
#sc-calc .sc-orbit-tile.is-off{opacity:0;pointer-events:none;--k:.5}
/* herinneringsstrook: klein, tekst weg; bij hover groeit het ballonnetje naar leesbaar formaat */
/* in de strook groeit een ballonnetje naar onder open, de vrije ruimte boven het gebouw in:
   het schaalt om zijn bovenrand i.p.v. om zijn midden, zodat het de herinneringsregel erboven niet
   overdekt */
#sc-calc .sc-orbit-tile.is-mini{--k:var(--kmini,.62);transform-origin:50% 0}
#sc-calc .sc-orbit-tile.is-mini .sc-orbit-txt{opacity:0;transition:opacity .3s ease}
#sc-calc .sc-orbit-tile.is-mini:hover,#sc-calc .sc-orbit-tile.is-mini:focus-visible{--k:1;z-index:8}
#sc-calc .sc-orbit-tile.is-mini:hover .sc-orbit-txt,
#sc-calc .sc-orbit-tile.is-mini:focus-visible .sc-orbit-txt{opacity:1;transition:opacity .4s ease .1s}
/* in de strook komt de groei van --k; de blob mag dan niet ook nog eens apart opschalen */
#sc-calc .sc-orbit-tile.is-mini:hover .sc-orbit-blobin,
#sc-calc .sc-orbit-tile.is-mini:focus-visible .sc-orbit-blobin{transform:rotate(var(--tilt,0deg)) scale(1)}
#sc-calc .sc-orbit-tile.is-mini:hover .sc-orbit-txt,
#sc-calc .sc-orbit-tile.is-mini:focus-visible .sc-orbit-txt{transform:translateX(-50%) translateY(0)}
/* Aparte laag voor de boog. De verplaatsing zelf zit op de tegel (een transitie); een tweede
   transform op hetzelfde element zou die transitie overrulen -- vandaar deze tussenlaag, die enkel
   de uitwijking loodrecht op de baan draagt. */
#sc-calc .sc-peb-arc{display:flex;flex-direction:column;align-items:center;width:100%}
#sc-calc .sc-orbit-tile:focus-visible{outline:none}
#sc-calc .sc-orbit-tile:focus-visible .sc-orbit-blobin{box-shadow:0 0 0 3px var(--sc-blue-soft),0 10px 22px rgba(15,92,140,.18)}

/* de blob: eigen grillige border-radius + eigen kanteling per item (inline gezet vanuit
   BEHOEFTEN_OPTS), zodat geen twee ballonnetjes dezelfde vorm hebben */
/* Twee lagen: de buitenste laag zweeft (CSS-animatie), de binnenste draagt de vorm en groeit bij
   hover. Dat moet gescheiden blijven: een lopende keyframe-animatie op transform overschrijft elke
   gewone transform-regel, dus zolang het zweven op hetzelfde element zat, gebeurde er bij hover
   zichtbaar niets. */
#sc-calc .sc-orbit-blob{position:relative;width:112px;height:112px;flex:0 0 auto;
  animation:sc-orbit-float var(--float-dur,9s) ease-in-out var(--float-delay,0s) infinite}
#sc-calc .sc-orbit-tile:hover .sc-orbit-blob,#sc-calc .sc-orbit-tile:focus-visible .sc-orbit-blob{
  animation-play-state:paused}
#sc-calc .sc-orbit-blobin{position:absolute;inset:0;display:grid;place-items:center;
  background:#fff;border:1.5px solid var(--sc-line);border-radius:var(--blob,50%);
  box-shadow:0 3px 12px rgba(15,92,140,.08);
  transform:rotate(var(--tilt,0deg)) scale(1);
  /* de groeirichting hangt af van waar het ballonnetje staat: aan de rand groeit het naar binnen,
     zodat het nooit tegen (of over) de rand van de kaart aan groeit */
  transform-origin:var(--org-x,50%) var(--org-y,50%);
  transition:transform .78s var(--sc-ease-settle),box-shadow .5s ease,border-color .45s ease,background .45s ease}
/* Zolang je erop blijft staan, groeit een ballonnetje door. De curve doet het meeste werk in de eerste
   fractie -- dat blijft de directe reactie op je muis -- en kruipt daarna nog traag verder. Haal je de
   muis er meteen weer af, dan is het bij die eerste sprong gebleven en komt het gewoon terug. */
#sc-calc .sc-orbit-tile:hover .sc-orbit-blobin,#sc-calc .sc-orbit-tile:focus-visible .sc-orbit-blobin{
  transform:rotate(var(--tilt,0deg)) scale(1.58);
  box-shadow:0 20px 38px rgba(15,92,140,.22);border-color:#c4dbe8;
  transition:transform 1.5s cubic-bezier(.12,.8,.2,1),box-shadow .5s ease,border-color .45s ease}
/* In de strook bovenaan is er minder plaats, dus daar blijft het bij de oude, kortere sprong */
#sc-calc .sc-orbit-tile.is-mini:hover .sc-orbit-blobin,#sc-calc .sc-orbit-tile.is-mini:focus-visible .sc-orbit-blobin{
  transform:rotate(var(--tilt,0deg)) scale(1.42);
  transition:transform .62s var(--sc-ease-pop),box-shadow .5s ease,border-color .45s ease}
#sc-calc .sc-orbit-tile.is-sel .sc-orbit-blobin{border-color:var(--sc-blue);background:var(--sc-blue-soft)}#sc-calc .sc-orbit-tile.is-sel .sc-tile-check{background:var(--sc-blue);border-color:var(--sc-blue);color:#fff}
/* de illustratie draait de kanteling van de blob terug uit: de tekening staat dus altijd recht,
   enkel de omtrek is scheef. De svg zelf wordt nooit aangepast. */
#sc-calc .sc-orbit-img{width:88px;height:88px;display:grid;place-items:center;
  transform:rotate(calc(-1 * var(--tilt,0deg)))}
#sc-calc .sc-orbit-img svg{width:100%;height:100%;display:block}
#sc-calc .sc-orbit-ico{width:66px;height:66px;border-radius:50%;background:#eef4f8;display:grid;place-items:center;
  color:var(--sc-blue);transform:rotate(calc(-1 * var(--tilt,0deg)))}

/* tekstblok hangt onder de blob en schuift mee naar onder wanneer de blob groeit (louter transform) */
#sc-calc .sc-orbit-txt{position:absolute;left:50%;top:100px;width:136px;
  /* in rust staat het tekstblok stil; --txt-y geldt enkel in de hover-regel verderop (stond die var
     ook hier, dan zakte de chip in rust al mee naar onder) */
  transform:translateX(-50%) translateY(0);
  transition:transform .62s var(--sc-ease-pop);pointer-events:none}
#sc-calc .sc-orbit-chip{display:block;width:136px;background:#fff;border:1.5px solid var(--sc-line);
  border-radius:11px;padding:5px 8px;box-shadow:0 3px 8px rgba(15,92,140,.1);
  transition:box-shadow .45s ease,border-color .45s ease}
#sc-calc .sc-orbit-tile:hover .sc-orbit-chip{box-shadow:0 8px 18px rgba(15,92,140,.16);border-color:#c4dbe8}
#sc-calc .sc-orbit-tile.is-sel .sc-orbit-chip{border-color:var(--sc-blue)}
#sc-calc .sc-orbit-chip-t{display:block;font-weight:600;font-size:.74rem;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
/* subtekst: een apart zwevend paneeltje. Vast van formaat, dus het herbreekt nooit; het verschijnt
   met opacity + een klein verticaal schuifje. --sub-x wordt per ballonnetje gezet zodat het paneel
   binnen de kaart blijft, ook bij de buitenste ballonnetjes. */
#sc-calc .sc-orbit-sub{position:absolute;top:100%;left:50%;width:224px;margin-top:8px;
  transform:translateX(-50%) translate3d(var(--sub-x,0px),5px,0) scale(.97);transform-origin:50% 0;
  background:#fff;border:1.5px solid var(--sc-line);border-radius:12px;padding:8px 12px;
  box-shadow:0 12px 26px rgba(15,92,140,.16);
  font-weight:500;font-size:.7rem;line-height:1.45;color:var(--sc-muted);text-align:center;
  opacity:0;visibility:hidden;
  transition:opacity .3s ease,transform .5s var(--sc-ease-pop),visibility 0s linear .5s}
#sc-calc .sc-orbit-tile:hover .sc-orbit-sub,#sc-calc .sc-orbit-tile:focus-visible .sc-orbit-sub{
  opacity:1;visibility:visible;
  transform:translateX(-50%) translate3d(var(--sub-x,0px),0,0) scale(1);
  transition:opacity .34s ease .04s,transform .58s var(--sc-ease-pop),visibility 0s}
#sc-calc .sc-orbit-tile:hover,#sc-calc .sc-orbit-tile:focus-visible{z-index:7}
#sc-calc .sc-orbit-tile:hover .sc-orbit-txt,#sc-calc .sc-orbit-tile:focus-visible .sc-orbit-txt{
  transform:translateX(-50%) translateY(var(--txt-y,22px))}
/* het vinkje zit in de schalende laag, dus het blijft bij hover aan de rand van de blob kleven
   i.p.v. ergens in het midden te blijven hangen */
#sc-calc .sc-orbit-tile .sc-tile-check{top:9px;right:7px;width:19px;height:19px;z-index:2;
  transition:background .3s ease,border-color .3s ease}
/* zolang er ergens gehoverd wordt duwen de buren weg met een lichte overshoot; laat je de muis los,
   dan valt alles terug met de rustigere settle-curve, zodat het uitdempt i.p.v. terugklapt */
#sc-calc .is-hovering .sc-orbit-tile{transition-timing-function:cubic-bezier(.16,1.22,.36,1)}
@keyframes sc-orbit-float{

}
/* --- herinneringsstrook en antwoordrij ------------------------------------- */
#sc-calc .sc-recall{font-size:.76rem;color:var(--sc-muted);text-align:center;margin:2px 0 0;
  letter-spacing:.01em}
#sc-calc .sc-recall-mob{font-size:.8rem;color:var(--sc-muted);margin:2px 0 12px}
/* de antwoorden staan als ballonnetjes op een rij; de rij is zelf het positioneringskader, zodat
   dezelfde plaatsings- en duwlogica als op het podium hergebruikt kan worden */
/* --- het gebouw boven de vraag (stap 3 en 4) --------------------------------
   Staat los van de vak-samenvatting: eerst de vraag (net als op elke andere stap), dan het gebouw,
   dan de antwoorden. Kleiner en gecentreerd, want het is hier illustratie, geen hoofdrol. */
#sc-calc .sc-recap-bldg{width:min(100%,210px);height:180px;margin:20px auto 18px}
@media (max-width:640px){#sc-calc .sc-recap-bldg{display:none}}

/* --- samenvatting van eerdere antwoorden, onderaan de stap ------------------
   Enkel vakken die al een antwoord dragen worden getekend -- geen lege plekhouders meer -- en het
   geheel staat smaller dan de kaart en gecentreerd, met ruim wat lucht er rond, zodat de ballonnetjes
   niet tegen de rand van hun vak botsen. */
#sc-calc .sc-recap{width:min(100%,440px);margin:28px auto 4px}
#sc-calc .sc-recap-l{text-align:center;font-size:.68rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:#9db3c0;margin-bottom:12px}
#sc-calc .sc-recap-row{display:flex;justify-content:center;gap:22px}
#sc-calc .sc-recap-row > .sc-topbox{flex:1 1 0;max-width:210px}
#sc-calc .sc-topbox{position:relative;min-width:0;

  transition:opacity .42s ease,border-color .42s ease}
#sc-calc .sc-topbox-l{position:absolute;left:0;right:0;top:14px;padding:0 16px;text-align:center;
  font-size:.62rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#9db3c0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){#sc-calc .sc-recap{display:none}}
/* de subtitel staat in de chip en is altijd zichtbaar; de langere toelichting komt er bij hover onder */
#sc-calc .sc-orbit-chip-d{display:block;font-weight:500;font-size:.66rem;line-height:1.3;
  color:var(--sc-muted);margin-top:2px;overflow-wrap:break-word}
@media (max-width:640px){
  #sc-calc .sc-recall{display:none}

/* "Wij hebben andere uitdagingen" is geen gelijkwaardige tegel maar een uitweg: rechts uitgelijnd
   (op dezelfde lijn als de Volgende-knop eronder), klein, mager, zonder icoon. */
#sc-calc .sc-diagram-geen{margin-top:4px;display:flex;justify-content:flex-end}
#sc-calc .sc-geen-btn{display:inline-flex;align-items:center;gap:9px;
  background:none;border:0;padding:6px 2px;cursor:pointer;font:inherit;
  font-size:.86rem;font-weight:400;color:var(--sc-muted);

  display:grid;place-items:center;color:transparent;flex:0 0 auto;

#sc-calc .sc-geen-btn.is-sel{color:var(--sc-blue)}

  #sc-calc .sc-peb-arc{display:contents}

     kleine illustratie */
  #sc-calc .sc-orbit-blobin{position:static;width:100%;height:100%;

#sc-calc .sc-bldg-img svg{width:100%;height:100%;display:block}
/* Het gebouw dat een niveau wint of verliest, doet dat met anticipatie en uitdempen: eerst een korte
   tegenbeweging, dan de sprong, dan een paar kleiner wordende naveringen. De schaal is bewust
   niet-uniform (squash-and-stretch) en het draaipunt ligt op de grond, zodat het gebouw op zijn
   fundering blijft staan i.p.v. te "zwellen".
   LET OP: deze drie regels staan na .sc-land en winnen dus altijd van de landings-animatie -- die
   deelde vroeger dezelfde specificiteit en at de pop op zodra ze ooit was aangezet. */
#sc-calc .sc-stage-bldg-in.sc-land{animation:sc-bldg-land .5s ease-out}
@keyframes sc-bldg-land{0%{transform:scale(1,1)}45%{transform:scale(1.015,.982)}100%{transform:scale(1,1)}}
#sc-calc .sc-bldg-img.sc-pop,#sc-calc .sc-stage-bldg-in.sc-pop{animation:sc-bldg-pop .5s cubic-bezier(.31,1.7,.6,1)}
#sc-calc .sc-bldg-img.sc-grow,#sc-calc .sc-stage-bldg-in.sc-grow{animation:sc-bldg-grow .66s cubic-bezier(.3,.86,.32,1)}
#sc-calc .sc-bldg-img.sc-shrink,#sc-calc .sc-stage-bldg-in.sc-shrink{animation:sc-bldg-shrink .6s cubic-bezier(.3,.86,.32,1)}
/* De sprong van niveau 4 naar 5 gaat niet de hoogte in maar de breedte: er komt een vleugel naast.
   Daarom draait die beweging rond de linkeronderhoek van de tekening i.p.v. het midden -- anders zou
   het gebouw ook naar links uitzetten en dat leest als opblazen, niet als aanbouwen. De 23% is
   opgemeten: de tekening begint op x=471 van een viewBox van 2048 breed, en die viewBox loopt door
   preserveAspectRatio="xMidYMax meet" precies over de volle breedte van het kader. */
#sc-calc .sc-bldg-img.sc-grow-x,#sc-calc .sc-stage-bldg-in.sc-grow-x{
  transform-origin:var(--sc-bldg-ox,23%) 100%;animation:sc-bldg-grow-x .66s cubic-bezier(.3,.86,.32,1)}
#sc-calc .sc-bldg-img.sc-shrink-x,#sc-calc .sc-stage-bldg-in.sc-shrink-x{
  transform-origin:var(--sc-bldg-ox,23%) 100%;animation:sc-bldg-shrink-x .6s cubic-bezier(.3,.86,.32,1)}
#sc-calc .sc-bldg-img.sc-comm,#sc-calc .sc-stage-bldg-in.sc-comm{
  transform-origin:var(--sc-bldg-ox,23%) 100%;animation:sc-bldg-comm .58s cubic-bezier(.3,.86,.32,1)}
@keyframes sc-bldg-pop{
  0%{transform:scale(.88)}
  40%{transform:scale(1.1)}
  70%{transform:scale(.97)}
  100%{transform:scale(1)}
}
/* groeien: door de knieën, dan omhoog schieten, dan uitdempen. De uitslagen zijn bewust klein: het
   moet aanvoelen alsof het gebouw er even doorheen veert, niet alsof het van rubber is. */
@keyframes sc-bldg-grow{
  0%{transform:scale(1,1)}
  13%{transform:scale(1.03,.955)}
  40%{transform:scale(.967,1.053)}
  62%{transform:scale(1.017,.98)}
  80%{transform:scale(.994,1.008)}
  92%{transform:scale(1.002,.997)}
  100%{transform:scale(1,1)}
}
/* krimpen: eerst even rekken, dan inzakken, dan uitdempen */
@keyframes sc-bldg-shrink{
  0%{transform:scale(1,1)}
  13%{transform:scale(.977,1.037)}
  42%{transform:scale(1.036,.95)}
  64%{transform:scale(.987,1.018)}
  82%{transform:scale(1.005,.994)}
  100%{transform:scale(1,1)}
}
/* breder worden: eerst samentrekken naar links, dan naar rechts uitschieten */
@keyframes sc-bldg-grow-x{
  0%{transform:scale(1,1)}
  13%{transform:scale(.963,1.019)}
  40%{transform:scale(1.046,.975)}
  62%{transform:scale(.986,1.011)}
  80%{transform:scale(1.006,.995)}
  92%{transform:scale(.998,1.002)}
  100%{transform:scale(1,1)}
}
/* smaller worden: eerst even naar rechts uitrekken, dan terugtrekken */
@keyframes sc-bldg-shrink-x{
  0%{transform:scale(1,1)}
  13%{transform:scale(1.031,.983)}
  42%{transform:scale(.959,1.029)}
  64%{transform:scale(1.012,.992)}
  82%{transform:scale(.996,1.003)}
  100%{transform:scale(1,1)}
}
/* commerciële kavels aan/uit: linksonderaan ploppen een winkeldeur en een luifel in de tekening. Het
   gebouw zet zich eerst schrap (kort optrekken), vangt dan de landing op met een korte indeuking naar
   die hoek toe, en dempt uit. Kleinere uitslag dan bij een niveauwissel: er verandert een detail, niet
   het hele gebouw. */
@keyframes sc-bldg-comm{
  0%{transform:scale(1,1)}
  12%{transform:scale(.986,1.016)}
  36%{transform:scale(1.03,.964)}
  58%{transform:scale(.99,1.013)}
  78%{transform:scale(1.005,.995)}
  100%{transform:scale(1,1)}
}

         ze schuift enkel mee met de hoogte van de body erboven en wisselt haar opschriften. -->
    <div class="sc-nav" id="sc-nav" hidden></div>

</div>

function complexNiveau(){

/* ---- welke formule past? --------------------------------------------------
   Vroeger was dit een trap van losse als-dan-regels, waarbij één antwoord de rest overrulede. Dat is
   moeilijk te verdiepen: elke nieuwe nuance vraagt een nieuwe regel, en je ziet niet meer waarom
   iemand ergens uitkomt. Nu telt alles mee in één score, opgebouwd uit vier bronnen:

     omvang        het aantal kavels, in trappen
     uitdagingen   de aangeduide ballonnetjes, elk met hun eigen gewicht (w)
     gebouw        commerciële ruimtes vragen aparte afspraken
     antwoorden    hoe het beheer vandaag loopt, en hoe men het liefst zou werken

   Twee drempels maken er een formule van. Alle getallen staan in FORMULE_WEGING, zodat je aan de
   verhoudingen kan draaien zonder de logica aan te raken; formuleScore() geeft de volledige opbouw
   terug, en die gaat mee in de payload. Zo kan je op echte inzendingen zien hoe de verdeling loopt
   en de drempels bijstellen met cijfers in de hand i.p.v. op gevoel.

   Let op de bovengrens op de uitdagingen: zonder die grens zou wie alles aanvinkt (samen 12 punten)
   automatisch bovenaan uitkomen, ongeacht de omvang van het gebouw. */
var FORMULE_WEGING = {
  /* de hoogste trap waar het aantal kavels boven zit, telt */
  kavels: [ {vanaf:0, p:0}, {vanaf:12, p:1}, {vanaf:24, p:2}, {vanaf:40, p:4}, {vanaf:60, p:5} ],
  uitdagingMax: 6,                                              /* plafond op de som van de w's */
  commercieel: 1,
  beheerNu:  { geen:3, zelf:1, professional:0 },
  beheerWens:{ zelf_ondersteund:0, professioneel:5 },
  /* vanaf coach hoort er begeleiding bij, vanaf captain nemen we het beheer over */
  drempel: { coach:5, captain:11 }
};
function formuleScore(){
  var d = { kavels:0, uitdagingen:0, commercieel:0, beheerNu:0, beheerWens:0 };
  FORMULE_WEGING.kavels.forEach(function(t){ if(S.kavels >= t.vanaf) d.kavels = t.p; });
  d.uitdagingen = Math.min(FORMULE_WEGING.uitdagingMax, complexNiveau().score);
  d.commercieel = S.commercieel ? FORMULE_WEGING.commercieel : 0;
  d.beheerNu    = FORMULE_WEGING.beheerNu[S.beheerNu] || 0;
  d.beheerWens  = FORMULE_WEGING.beheerWens[S.beheerWens] || 0;
  d.totaal = d.kavels + d.uitdagingen + d.commercieel + d.beheerNu + d.beheerWens;
  d.formule = d.totaal >= FORMULE_WEGING.drempel.captain ? 'captain'
            : d.totaal >= FORMULE_WEGING.drempel.coach   ? 'coach' : 'assistant';
  return d;
}
function kiesFormule(){ return formuleScore().formule; }

function licentieTier(f){
  if(f === 'captain') return 'captain';
  if(f === 'coach') return 'smart';
  return complexNiveau().niveau === 'laag' ? 'basic' : 'smart';
}

/* Ronden op 50 of 100 zodat het cijfer eruitziet als wat het is: een richtprijs. */
function rond(n){ return n >= 2000 ? Math.round(n/100)*100 : Math.round(n/50)*50; }

function bereken(){
  var k = Math.max(CFG.MIN_KAVELS, S.kavels), f = S.formule;
  var c = complexNiveau(), cf = CFG.COMPLEX_FACTOR[c.niveau];
  var tier = licentieTier(f), btw = CFG.TOON_INCL_BTW ? 1 + CFG.BTW : 1;
  var r = { kavels:k, formule:f, complex:c, licentie_tier:tier, uren:{} };

  /* tool: licentie per kavel + vaste koppelingen, altijd apart getoond */
  var kop = (f === 'coach' || (f === 'assistant' && tier !== 'basic'))
            ? CFG.KOPPELING_PM_VME.bank + CFG.KOPPELING_PM_VME.peppol : 0;
  r.tool_pm_excl = CFG.LICENTIE[tier].pm_kavel * k + kop;
  r.tool_pm = r.tool_pm_excl * btw;

  if(f === 'captain'){
    var t = CFG.TARIEF.captain, u = CFG.UREN.captain;
    r.uren.beheer_pm = u.beheer_pm(k) * cf.recurrent;
    r.uren.av        = u.av(k)        * cf.recurrent;
    r.uren.opstart   = u.opstart(k)   * cf.opstart;
    r.beheer_pj_excl  = (r.uren.beheer_pm * 12 + r.uren.av) * t;
    r.opstart_excl    = r.uren.opstart * t;
  } else if(f === 'coach'){
    var t2 = CFG.TARIEF.coach, u2 = CFG.UREN.coach;
    r.uren.coaching_pj = u2.coaching_pj(k) * cf.recurrent;
    r.uren.opstart     = u2.opstart(k)     * cf.opstart;
    r.beheer_pj_excl  = r.uren.coaching_pj * t2;
    r.opstart_excl    = r.uren.opstart * t2;
  } else {
    r.uren.opstart   = CFG.UREN.assistant.opstart(k);
    r.beheer_pj_excl = 0;
    r.opstart_excl   = r.uren.opstart * CFG.TARIEF.coach;
    r.opstart_optioneel = true;
  }

  r.beheer_pj = r.beheer_pj_excl * btw;
  r.opstart   = r.opstart_excl * btw;
  r.jaar1     = r.beheer_pj + r.opstart + r.tool_pm * 12;
  r.jaar2     = r.beheer_pj + r.tool_pm * 12;
  if(r.opstart_optioneel) r.jaar1 = r.jaar2;   /* opstarthulp is een keuze */
  r.pkpm      = r.jaar2 / k / 12;
  return r;
}

/* nav() tekent niets meer: het noteert enkel wat de blijvende balk onderaan moet tonen. De stappen
   roepen het aan waar ze vroeger de markup invoegden, zodat elke stap nog altijd zelf zegt wat er
   onderaan hoort te staan. */
var NAV_CFG = null;
function nav(backLabel, nextLabel, enabled, solid){
  NAV_CFG = { back:backLabel || 'Vorige', next:nextLabel || 'Volgende', enabled:!!enabled, solid:!!solid };
  return '';
}
/* Een opschrift dat verandert, wipt weg en komt van onderen terug -- dezelfde beweging als de rest
   van de kaart, alleen kleiner. De tekst wisselt op het moment dat ze onzichtbaar is. */
function navLabel(el, tekst){
  if(!el || el.textContent === tekst) return;
  if(!el.textContent){ el.textContent = tekst; return; }   /* eerste opbouw: gewoon zetten */
  el.classList.remove('is-swap');
  void el.offsetWidth;
  el.classList.add('is-swap');
  clearTimeout(el._scSwapT);
  el._scSwapT = setTimeout(function(){ el.textContent = tekst; }, 130);
}
function navRender(){
  var host = $('sc-nav');
  if(!host) return;
  if(!NAV_CFG){ host.hidden = true; host.innerHTML = ''; return; }   /* stappen met een eigen balk in hun body */
  if(!host.firstChild){
    host.innerHTML =
      '<button type="button" class="sc-back" id="sc-back">'+ico('arrowl',16)+
        '<span class="sc-nav-lbl"></span></button>'+
      '<button type="button" class="sc-next" id="sc-next">'+
        '<span class="sc-nav-lbl"></span>'+ico('arrowr',17)+'</button>';
  }
  host.hidden = false;
  var back = host.querySelector('.sc-back'), next = host.querySelector('.sc-next');
  var weg = S.step === 0;
  back.classList.toggle('is-weg', weg);        /* schuift weg, blijft in de rij staan */
  back.tabIndex = weg ? -1 : 0;
  back.setAttribute('aria-hidden', weg ? 'true' : 'false');
  navLabel(back.querySelector('.sc-nav-lbl'), NAV_CFG.back);
  next.classList.toggle('sc-solid', NAV_CFG.solid);
  next.disabled = !NAV_CFG.enabled;
  navLabel(next.querySelector('.sc-nav-lbl'), NAV_CFG.next);
}
function dots(){
  if(S.step >= STAP_BOLLETJES){ $('sc-steps').innerHTML = ''; return; }
  var h = '';
  for(var i=0;i<STAP_BOLLETJES;i++) h += '<span class="sc-dot'+(i===S.step?' is-active':(i<S.step?' is-done':''))+'"></span>';
  $('sc-steps').innerHTML = h;
}

/* `groep` bepaalt bij welke vraag een ballonnetje hoort ('nood' voor het diagram, 'nu' of 'wens'
   voor de antwoorden). Nodig omdat ze sinds de vakken bovenaan allemaal tegelijk op het podium leven:
   zonder groep zou een klik op een herinnerd ballonnetje het antwoord van de huidige vraag veranderen,
   en zou syncSel de selectie van de andere groepen wissen. */
function orbitTile(o, sel, extra, groep){
  var img = (ITEM_ILL[o.v] || ILL[o.v]) ? (ITEM_ILL[o.v] || ILL[o.v])
                                        : '<span class="sc-orbit-ico">'+ico(o.ico,28)+'</span>';
  var style = '--blob:'+o.blob+';--tilt:'+o.tilt+'deg;--float-dur:'+o.fdur+'s;--float-delay:-'+o.fdel+'s';
  return '<button type="button" class="sc-orbit-tile'+(sel?' is-sel':'')+(extra?' '+extra:'')+
    '" data-v="'+esc(o.v)+'"'+(groep?' data-g="'+esc(groep)+'"':'')+
    ' aria-pressed="'+(sel?'true':'false')+'" style="'+esc(style)+'">'+
    '<span class="sc-peb-arc">'+
      '<span class="sc-orbit-blob"><span class="sc-orbit-blobin">'+
          '<span class="sc-tile-check">'+ico('check',11)+'</span>'+
          '<span class="sc-orbit-img">'+img+'</span></span></span>'+
      '<span class="sc-orbit-txt">'+
        '<span class="sc-orbit-chip"><span class="sc-orbit-chip-t">'+esc(o.t)+'</span>'+
          (o.d?'<span class="sc-orbit-chip-d">'+esc(o.d)+'</span>':'')+'</span>'+
        (o.sub?'<span class="sc-orbit-sub">'+esc(o.sub)+'</span>':'')+
      '</span>'+
    '</span></button>';
}
function geenBtn(o, sel){

    '" data-v="'+esc(o.v)+'" data-g="nood" aria-pressed="'+(sel?'true':'false')+'">'+
    '<span class="sc-geen-box">'+ico('check',10)+'</span>'+esc(o.t)+'</button>';

function stepAssessment(){

  var h = q('list','Wat speelt er in jullie gebouw?','Vink aan wat er speelt. Dat bepaalt hoeveel opvolging jullie gebouw vraagt.');

  if(hasPins){
    /* Op het podium staan het gebouw en de zeven ballonnetjes; het slot houdt hier enkel de hoogte
       vrij. Op smalle schermen staat het podium uit en valt de stap terug op een gestapelde lijst. */

      '<div class="sc-slot" data-slot="orbit" style="height:566px"></div>'+

        BEHOEFTEN_OPTS.filter(function(o){ return !o.exclusive; })
          .map(function(o){ return orbitTile(o, S.complex.indexOf(o.v)>-1, '', 'nood'); }).join('')+
      '</div>'+
      '<div class="sc-diagram-geen">'+geenBtn(geen, S.complex.indexOf('geen')>-1)+'</div>'+
    '</div>';
  } else {

      '<div class="sc-tiles sc-tiles-behoeften" id="sc-opts">';
    BEHOEFTEN_OPTS.forEach(function(o){ h += tileBehoefte(o, S.complex.indexOf(o.v)>-1); });

/* De stappen na het diagram delen dezelfde opbouw: bovenaan een strook met links de vakken en rechts
   het gebouw, daaronder de vraag en de antwoorden als ballonnetjes op een rij. De vakken, het gebouw
   en de antwoordrij zijn hier enkel lege kaders/slots: de ballonnetjes zelf staan op het podium, zodat
   ze van de rij naar hun vak kunnen vliegen i.p.v. te verdwijnen en elders opnieuw te verschijnen.
   ANTW_GROEPEN legt vast welke vraag bij welk vak hoort. */
var ANTW_GROEPEN = [
  { g:'nu',    stap:2, box:1, opts:BEHEER_NU_OPTS,
    lees:function(){ return S.beheerNu; } },
  { g:'wens',  stap:3, box:2, opts:BEHEER_WENS_OPTS,
    lees:function(){ return S.beheerWens; } }
];
function antwGroep(stap){
  return ANTW_GROEPEN.filter(function(gr){ return gr.stap === stap; })[0];
}
function gekozenNood(){
  return BEHOEFTEN_OPTS.filter(function(o){ return S.complex.indexOf(o.v) > -1 && !o.exclusive; });
}
/* Hoogte van rij 1: één rij ballonnetjes volstaat tot vier uitdagingen, daarboven twee. Zonder
   uitdagingen blijft er enkel een regel tekst over en mag het vak laag zijn. */
function topStrookHoogte(n){ return n <= 4 ? 136 : 196; }
var TOP_RIJ2_H = 104;        /* rij 2 draagt één ballonnetje per vak */
/* Het opschrift van een antwoordvak: het `vak`-veld van het gekozen antwoord. Zolang de vraag nog niet
   gepasseerd is, blijft het vak leeg -- en dus zonder opschrift. */
function vakOpschrift(gr){
  if(S.step <= gr.stap) return '';
  var keuze = gr.lees();
  if(!keuze) return '';
  var o = gr.opts.filter(function(x){ return x.v === keuze; })[0];
  return (o && o.vak) || (o && o.t) || '';
}
function recapVak(i, label, n){
  return '<div class="sc-topbox" data-box="'+i+'" style="height:'+topStrookHoogte(n)+'px">'+
    '<span class="sc-topbox-l">'+esc(label)+'</span>'+
    '</div>';
}
/* Een los slot voor het gebouw, vlak bij de vraag -- dezelfde volgorde als elke andere stap: eerst de
   vraag, dan de illustratie, dan de antwoorden. Staat niet langer samen met de vak-samenvatting. */
function topBldg(){
  return '<div class="sc-slot sc-recap-bldg" data-slot="bldg"></div>';
}
/* Onderaan een lichte samenvatting van wat je eerder aanduidde. Enkel vakken die al een antwoord
   dragen worden getekend -- geen lege plekhouders meer die enkel ruimte innemen -- dus op deze
   allereerste vraagstap kan de samenvatting best leeg blijven (voor stap 3: enkel de uitdagingen als
   die er zijn; het antwoord op de vraag die net gesteld wordt hoort hier nog niet thuis). */
function recapStrook(){
  var gek = gekozenNood(), boxen = '', open = 0;
  if(gek.length){ boxen += recapVak(0, 'Wat er speelt in jullie gebouw', gek.length); open++; }
  ANTW_GROEPEN.forEach(function(gr){
    if(gr.box == null || !(S.step > gr.stap)) return;
    var keuze = gr.lees();
    if(!keuze) return;
    /* Het opschrift van een vak is het gegeven antwoord zelf, als zin: 'Vandaag geen syndicus'. */
    boxen += recapVak(gr.box, vakOpschrift(gr), 1);
    open++;
  });
  if(!open) return '';
  return '<div class="sc-recap"><div class="sc-recap-l">Wat je eerder aangaf</div>'+
    '<div class="sc-recap-row">'+boxen+'</div></div>';
}
function stepMetPodium(icon, vraag, help, opts, gekozen, nextLabel, solid){
  var gek = gekozenNood();
  var namen = gek.map(function(o){ return o.t.toLowerCase(); });
  var herinnering = gek.length ? 'Wat er speelt in jullie gebouw: '+namen.join(' · ') : '';
  var gr = antwGroep(S.step);
  return q(icon, vraag, help)+
    topBldg()+
    '<div class="sc-onlymob sc-bldg"><div class="sc-bldg-img sc-bldg-sm sc-mob-bldg">'+
      stripPins(bouwIll(S.bldgLevel, S.commercieel))+'</div></div>'+
    '<div class="sc-slot" data-slot="ans" style="height:230px"></div>'+
    '<div class="sc-onlymob">'+
      opts.map(function(o){ return orbitTile(o, gekozen === o.v, '', gr ? gr.g : ''); }).join('')+
    '</div>'+
    (herinnering ? '<div class="sc-onlymob sc-recall-mob">'+esc(herinnering)+'</div>' : '')+
    recapStrook()+
    nav(null, nextLabel || 'Volgende', !!gekozen, solid);
}
