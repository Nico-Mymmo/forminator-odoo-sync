/* ==========================================================================
   7. RENDER
   ========================================================================== */
/* De volgorde van de stappen staat op één plek, en de nummers krijgen een naam. Ze zaten vroeger als
   losse getallen door de hele code (S.step === 6, go(8), i<6 ...); bij het schrappen van een vraag
   moest je ze dan allemaal terugvinden. Wie er nu een stap uithaalt of bijzet, past deze twee regels
   aan en de rest volgt. */
var VIEWS = [stepKavels, stepAssessment, stepBeheerNu, stepBeheerWens, stepResultaat, stepAlt, stepExtra, stepKlaar];
var STAP = { KAVELS:0, DIAGRAM:1, BEHEER:2, WENS:3, RESULTAAT:4, ALT:5, EXTRA:6, KLAAR:7 };
var STAP_BOLLETJES = STAP.RESULTAAT + 1;   /* tot en met het resultaat staan er bolletjes bovenaan */

function render(){
  var prevMode = STAGE.mode;
  var body = $('sc-body');
  var oudeH = (body && prevMode) ? body.offsetHeight : 0;
  var spook = oudeH ? bodemSpook(body) : null;   /* kopie van wat aan de onderrand hing, vóór de wissel */
  dots();
  NAV_CFG = null;
  $('sc-body').innerHTML = VIEWS[S.step]();
  navRender();            /* de stap heeft via nav() gezegd wat er onderaan hoort te staan */
  bind();
  stageApply(prevMode);   /* na het invoegen van de body: de slots zijn nu meetbaar */
  kaderHoogte(oudeH, spook);   /* en pas daarna het kader: stageApply heeft de slots al op maat gezet */
  syncStage();            /* de ballonnetjes op het podium overleven de render en dragen hun eigen stand */
}
/* ---- kader en gebouw bewegen als één ------------------------------------
   De kaart is zo hoog als haar inhoud, en die wisselt in één keer -- dus sprong ze vroeger meteen naar
   de nieuwe maat. Nu loopt de hoogte mee, met exact dezelfde duur en curve als de verplaatsing van het
   gebouw. Dat is geen schoonheidsfoutje maar de kern: het gebouw hangt aan de onderrand (top:100%), dus
   zolang hoogte en gebouw in de pas lopen, blijft alles wat aan de bovenkant hangt precies staan waar
   het hoort, en groeit of krimpt het gebouw samen met het kader.
   Tijdens de beweging staat overflow op hidden: anders zou de inhoud tijdens het groeien even buiten
   de afgeronde rand van de kaart hangen. */
/* ---- wat aan de onderrand hangt -------------------------------------------
   Alles met data-bodem hoort op een vaste afstand van de ONDERkant van de kaart te blijven, net als het
   gebouw. In de documentflow hangt zo'n blok aan de bovenkant, dus tijdens een hoogtewissel geven we
   het een tegenverschuiving: precies het verschil tussen de huidige en de eindhoogte, met dezelfde
   curve en duur als het kader. Zo blijft het aan de onderrand kleven terwijl die rand beweegt.
   Voor het blok dat vertrekt (het is uit de body verdwenen op het moment dat die opnieuw is opgebouwd)
   laten we een spook achter: een kopie die absoluut over de kaart ligt, met de rand mee naar beneden
   zakt en ondertussen wegvaagt. */
function bodemSpook(body){
  var card = $('sc-card'), el = body && body.querySelector('[data-bodem]');
  if(!card || !el) return null;
  var cr = card.getBoundingClientRect(), r = el.getBoundingClientRect();
  if(!r.height) return null;
  var g = document.createElement('div');
  g.className = 'sc-spook';
  g.style.left = (r.left - cr.left)+'px';
  g.style.top = (r.top - cr.top)+'px';
  g.style.width = r.width+'px';
  var kopie = el.cloneNode(true);
  /* een kopie mag geen id's meenemen: dan zou $('sc-range') het spook aanspreken i.p.v. de echte */
  var metId = kopie.querySelectorAll('[id]');
  for(var i=0;i<metId.length;i++) metId[i].removeAttribute('id');
  if(kopie.id) kopie.removeAttribute('id');
  g.appendChild(kopie);
  card.appendChild(g);
  return g;
}
function spookWeg(g){ if(g && g.parentNode) g.parentNode.removeChild(g); }
function kaderHoogte(oudeH, spook){
  var body = $('sc-body');
  if(!body || !oudeH){ spookWeg(spook); return; }
  var nieuweH = body.offsetHeight;
  if(!nieuweH || Math.abs(nieuweH - oudeH) < 5){ spookWeg(spook); return; }
  var dur = STAGE.kaderDur || scT(.5), ease = STAGE.kaderEase || SC_EASE_MOVE;
  var wacht = STAGE.kaderWacht || 0;
  var verschil = oudeH - nieuweH;          /* positief als de kaart krimpt */
  var spookFade = dur*1.9;                 /* vaagt trager weg dan hij zakt */
  var bodem = body.querySelectorAll('[data-bodem]');
  clearTimeout(body._scKaderT);
  body.style.transition = 'none';
  body.style.overflow = 'hidden';
  body.style.height = oudeH + 'px';
  for(var i=0;i<bodem.length;i++){
    bodem[i].style.transition = 'none';
    bodem[i].style.transform = 'translate3d(0,'+verschil+'px,0)';
  }
  void body.offsetHeight;                    /* deze stand als beginpunt vastleggen */
  requestAnimationFrame(function(){
    body.style.transition = 'height ' + dur + 's ' + ease + ' ' + wacht + 's';
    body.style.height = nieuweH + 'px';
    for(var j=0;j<bodem.length;j++){
      bodem[j].style.transition = 'transform ' + dur + 's ' + ease + ' ' + wacht + 's';
      bodem[j].style.transform = 'translate3d(0,0,0)';
    }
    if(spook){
      /* het wegvagen duurt langer dan de verschuiving: hij zakt mee met de rand en verdwijnt pas
         onderweg, i.p.v. meteen op te lossen */
      spook.style.transition = 'transform ' + dur + 's ' + ease + ' ' + wacht + 's,opacity ' +
                               spookFade.toFixed(2) + 's ease ' + wacht + 's';
      spook.style.transform = 'translate3d(0,'+(-verschil)+'px,0)';
      spook.style.opacity = '0';
    }
  });
  if(spook) setTimeout(function(){ spookWeg(spook); }, (wacht + spookFade)*1000 + 80);
  /* daarna weer aan de gewone documentflow overlaten: een vaste hoogte zou een tekst die later nog
     hertekent (of een venster dat versmalt) afknippen */
  body._scKaderT = setTimeout(function(){
    body.style.transition = ''; body.style.height = ''; body.style.overflow = '';
    for(var k=0;k<bodem.length;k++){ bodem[k].style.transition = ''; bodem[k].style.transform = ''; }
  }, (wacht + dur)*1000 + 80);
}
/* De podium-ballonnetjes worden nooit opnieuw opgebouwd, dus hun aangevinkt-zijn moet na elke render
   opnieuw uit de toestand afgeleid worden -- anders houdt een ballonnetje een vinkje over van een
   antwoord dat intussen veranderd is. */
function syncStage(){
  var st = $('sc-stage');
  if(!st) return;
  Array.prototype.forEach.call(st.querySelectorAll('.sc-orbit-tile[data-g]'), function(el){
    var g = el.getAttribute('data-g'), v = el.getAttribute('data-v'), sel;
    if(g === 'nood') sel = S.complex.indexOf(v) > -1;
    else {
      var gr = ANTW_GROEPEN.filter(function(x){ return x.g === g; })[0];
      sel = !!gr && gr.lees() === v;
    }
    el.classList.toggle('is-sel', !!sel);
    el.setAttribute('aria-pressed', sel ? 'true' : 'false');
  });
}
function go(n){
  S.step = n; render();
  try{ var el = $('sc-calc'); if(el && el.getBoundingClientRect().top < 0) el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
}

/* Ankerpunten van de slinger, in de volgorde waarin het oog ze afleest: linkerflank, dan de vijf
   bovenaan van links naar rechts, dan de rechterflank. `kx` is de horizontale plaats als fractie van
   de bruikbare halve breedte (schaalt dus mee met de kolombreedte), `y` staat in px vanaf de bovenrand
   van het diagram (de hoogte is vast, 460px).
   De y-waarden verspringen bewust op en neer: dat lichte zigzag laat de zeven ballonnetjes de breedte
   vullen zonder dat de buitenste twee tot tegen de rand geduwd moeten worden om botsing te vermijden.
   De flanken staan iets naar binnen (|kx| < 1) zodat de slinger aan de uiteinden naar binnen krult
   i.p.v. plat af te lopen. */
var ORBIT_ANCHORS = [
  { kx:-0.81, y:388 },
  { kx:-0.87, y:232 },
  { kx:-0.72, y: 76 },
  { kx: 0.00, y:116 },
  { kx: 0.72, y: 80 },
  { kx: 0.87, y:234 },
  { kx: 0.81, y:390 }
];
var ORBIT_INSET = 34;      /* lucht tussen ballonnetje en de rand van de tekstkolom */
var ORBIT_PUSH_MAX = 30;   /* hoeveel het naaste ballonnetje wegduwt bij hover */
var ORBIT_PUSH_REACH = 480;
var ORBIT_LINE_GAP = 26;   /* minimale gewenste afstand tussen twee verbindingslijntjes */
var ORBIT_GROW_EXTRA = 47;  /* hoeveel px een blob bij hover in totaal groeit (112px * (1.42 - 1)) */


/* ==========================================================================
   PODIUM
   Het gebouw en de zeven ballonnetjes leven in #sc-stage en worden nooit opnieuw opgebouwd. Elke stap
   zet in zijn eigen body enkel lege "slots" met de juiste hoogte; het podium meet die op en schuift
   zijn elementen ernaartoe met een transform-transitie. Daardoor glijdt het gebouw van stap 1 naar
   stap 2 en verhuizen de aangeduide ballonnetjes naar een strook bovenaan i.p.v. te verdwijnen.
   ========================================================================== */
var STAGE = { built:false, mode:null, tiles:[], antw:null, run:0 };

function stripPins(svg){ return svg.replace(/id="pin-/g, 'data-pin="'); }

function stageBuild(){
  if(STAGE.built) return;
  var st = $('sc-stage');
  if(!st) return;
  st.innerHTML =
    '<svg class="sc-stage-lines is-off" id="sc-stage-lines"></svg>'+
    '<div class="sc-stage-bldg" id="sc-stage-bldg"><div class="sc-stage-bldg-in" id="sc-bldg-img"></div></div>'+
    BEHOEFTEN_OPTS.filter(function(o){ return !o.exclusive; })
      .map(function(o){ return orbitTile(o, false, 'is-in', 'nood'); }).join('')+
    /* de antwoorden van stap 3 t/m 5 wonen óók op het podium: alleen zo kan het gekozen ballonnetje
       bij "Volgende" naar zijn vak bovenaan vliegen i.p.v. te verdwijnen en daar opnieuw op te duiken */
    ANTW_GROEPEN.map(function(gr){
      return gr.opts.map(function(o){ return orbitTile(o, false, 'is-in', gr.g); }).join('');
    }).join('');
  STAGE.tiles = Array.prototype.slice.call(st.querySelectorAll('.sc-orbit-tile[data-g="nood"]'));
  STAGE.antw = {};
  ANTW_GROEPEN.forEach(function(gr){
    STAGE.antw[gr.g] = Array.prototype.slice.call(st.querySelectorAll('.sc-orbit-tile[data-g="'+gr.g+'"]'));
  });
  STAGE.built = true;
  stageBldg();
}
function stageBldg(){
  var el = $('sc-bldg-img');
  if(!el) return;
  el.innerHTML = bouwIll(S.bldgLevel, S.commercieel);
  STAGE.lvl = S.bldgLevel; STAGE.comm = S.commercieel;
}
/* Alle eenmalige gebouw-animaties lopen via dezelfde weg. Belangrijk: eerst élke andere animatieklasse
   weg. Bleef er eentje hangen (dat gebeurde met sc-land na een stapovergang), dan won die van de
   nieuwe klasse en zag je de sprong niet meer. Na afloop ruimen we zelf op. */
var SC_BLDG_ANIM = ['sc-pop','sc-land','sc-grow','sc-shrink','sc-grow-x','sc-shrink-x','sc-comm'];
/* Waar de linkeronderhoek van de tekening ligt, als deel van de kaderbreedte. Het gebouw staat niet
   tegen de rand van zijn viewBox, en die marge verschilt per niveau. We meten ze liefst live op (zie
   bldgInkt hieronder, die dat toch al doet voor de hoogte); staat het podium verborgen -- op smalle
   schermen is dat zo -- dan valt hij terug op deze opgemeten tabel. Nieuwe tekeningen? Meet de
   linkerrand van het gebouw en deel door de breedte van de viewBox. */
var BOUW_LINKS = { 1:.311, 2:.282, 3:.230, 4:.230, 5:.230 };
function bldgOrigin(el){
  if(!el) return;
  var f = BOUW_LINKS[S.bldgLevel];
  var m = bldgInkt();
  if(m && m.l > 0.02 && m.l < 0.5) f = m.l;    /* een meting die nergens op slaat negeren we */
  if(f) el.style.setProperty('--sc-bldg-ox', (f*100).toFixed(1)+'%');
}
function bldgAnim(el, cls){
  if(!el) return;
  bldgOrigin(el);
  SC_BLDG_ANIM.forEach(function(c){ el.classList.remove(c); });
  void el.offsetWidth;              /* forceer reflow zodat de animatie herstart */
  el.classList.add(cls);
  if(el._scAnimEnd) el.removeEventListener('animationend', el._scAnimEnd);
  el._scAnimEnd = function(ev){
    if(ev.target !== el) return;
    el.classList.remove(cls);
    el.removeEventListener('animationend', el._scAnimEnd);
    el._scAnimEnd = null;
  };
  el.addEventListener('animationend', el._scAnimEnd);
}
function stageBldgPop(){ bldgAnim($('sc-bldg-img'), 'sc-pop'); }

/* Groeien/krimpen van het gebouw op de kavel-slider. De tekening zelf wisselt niet op tel nul maar op
   het dieptepunt van de anticipatie: op dat moment zit het gebouw in elkaar gedrukt en valt de wissel
   nauwelijks op -- de sprong erna leest als één beweging i.p.v. als een plaatje dat verspringt.
   Sleept iemand snel over meerdere niveaus, dan schuift de wissel gewoon mee op. */
var SC_BLDG_SWAP_T = null;
/* Tot en met niveau 4 wordt het gebouw hoger; op niveau 5 komt er een vleugel naast en groeit het in
   de breedte. De beweging volgt die as, anders klopt de anticipatie niet met wat je ziet gebeuren.
   Verandert er later iets aan de tekeningen, dan is dit het enige dat je moet bijstellen. */
var BOUW_BREEDTEGROEI = 5;   /* eerste niveau dat naast zich groeit i.p.v. omhoog */
function bldgAs(van, naar){ return Math.max(van, naar) >= BOUW_BREEDTEGROEI ? '-x' : ''; }
function bldgFlush(){
  if(!SC_BLDG_SWAP_T) return;
  clearTimeout(SC_BLDG_SWAP_T); SC_BLDG_SWAP_T = null;
  stageBldg(); mobBldg(false);
}
/* De tekening wisselt niet op tel nul maar op het dieptepunt van de anticipatie: op dat moment zit het
   gebouw samengedrukt en valt de wissel nauwelijks op -- wat erna komt leest als één beweging i.p.v.
   als een plaatje dat verspringt. Klikt of sleept iemand snel door, dan schuift de wissel mee op. */
function bldgSwapNa(ms){
  clearTimeout(SC_BLDG_SWAP_T);
  SC_BLDG_SWAP_T = setTimeout(function(){
    SC_BLDG_SWAP_T = null;
    stageBldg();      /* het gebouw op het podium */
    mobBldg(false);   /* en de kopie voor smalle schermen */
  }, ms);
}
function bldgNiveauWissel(van, naar){
  var cls = (naar < van ? 'sc-shrink' : 'sc-grow') + bldgAs(van, naar);
  bldgAnim($('sc-bldg-img'), cls);
  bldgAnim(document.querySelector('#sc-body .sc-mob-bldg'), cls);
  bldgSwapNa(88);
}
function bldgCommWissel(){
  bldgAnim($('sc-bldg-img'), 'sc-comm');
  bldgAnim(document.querySelector('#sc-body .sc-mob-bldg'), 'sc-comm');
  bldgSwapNa(72);   /* net na het schrap zetten, zodat de landing de plop opvangt */
}

/* ---- waar staat de tekening werkelijk in haar kader? -----------------------
   Een gebouw-svg heeft lucht boven zich, en hoe kleiner het gebouw hoe meer: bij niveau 1 is meer dan
   de helft van het kader leeg. Nemen we dat kader als maat, dan zakt het gebouw diep in de kaart en
   gaapt er een gat boven. We meten daarom eenmalig per niveau waar de inkt begint en eindigt, als
   fractie van de hoogte van het svg-element. Die fractie is schaal-onafhankelijk, dus ze klopt ook
   terwijl het gebouw nog aan het glijden of veren is. Mislukt de meting, dan valt alles terug op het
   volle kader en staat alles gewoon zoals vroeger. */
var BLDG_BOX = 300;          /* het kader waarin de svg getekend wordt, vóór schaling met --k */
var BLDG_INKT = {};
function bldgInkt(){
  var key = S.bldgLevel+'|'+(S.commercieel?1:0);
  if(BLDG_INKT[key]) return BLDG_INKT[key];
  var vol = { t:0, b:1, h:1, l:0, r:1 };
  var wrap = $('sc-bldg-img'), svg = wrap && wrap.querySelector('svg');
  if(!svg) return vol;
  var r = svg.getBoundingClientRect();
  if(!r.height || !r.width) return vol;
  var top = Infinity, bot = -Infinity, lft = Infinity, rgt = -Infinity;
  var nodes = svg.querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon,image,text');
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i], cs;
    try{ cs = getComputedStyle(n); }catch(e){ continue; }
    if(cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
    var vult  = cs.fill   && cs.fill   !== 'none' && parseFloat(cs.fillOpacity)   !== 0;
    var lijnt = cs.stroke && cs.stroke !== 'none' && parseFloat(cs.strokeOpacity) !== 0;
    if(!vult && !lijnt) continue;                 /* onzichtbare hulpvormen tellen niet mee */
    var b = n.getBoundingClientRect();
    if(!b.width && !b.height) continue;
    if(b.height > r.height*0.985 && b.width > r.width*0.985) continue;   /* een achtergrondvlak */
    if(b.top < top) top = b.top;
    if(b.bottom > bot) bot = b.bottom;
    if(b.left < lft) lft = b.left;
    if(b.right > rgt) rgt = b.right;
  }
  if(!isFinite(top) || !isFinite(bot) || bot - top < r.height*0.1) return vol;
  var m = { t:(top - r.top)/r.height, b:(bot - r.top)/r.height };
  m.h = m.b - m.t;
  m.l = isFinite(lft) ? (lft - r.left)/r.width : 0;
  m.r = isFinite(rgt) ? (rgt - r.left)/r.width : 1;
  BLDG_INKT[key] = m;
  return m;
}
/* de maatvoering van het gebouw in de stappen met de strook bovenaan. De schaal ligt vast (zo blijft
   een gebouw van 40 kavels zichtbaar groter dan een van 4); de hoogte van het slot volgt uit de
   werkelijke hoogte van de tekening, plus lucht boven en onder. */
var RECAP_BLDG_PAD = 16;     /* lucht tussen de tekening en de rand van haar kolom */

/* de gemeten omvang van een ballonnetje t.o.v. zijn ankerpunt. Bewust met offsetWidth/offsetHeight
   (layoutmaten) i.p.v. getBoundingClientRect: die laatste zit onder de transform, en tijdens een
   overgang tussen stappen staat die halverwege een schaal. */
function pebExtent(el){
  var blob = el.querySelector('.sc-orbit-blob'), txt = el.querySelector('.sc-orbit-txt'),
      chip = el.querySelector('.sc-orbit-chip');
  var bw = (blob && blob.offsetWidth) || 112;
  var cw = (chip && chip.offsetWidth) || 136, ch = (chip && chip.offsetHeight) || 40;
  var half = Math.max(bw/2 + 5, cw/2);   /* +5: de kanteling steekt een paar px buiten de blob */
  return { l:-half, r:half, t:-(bw/2 + 5), b:((txt && txt.offsetTop) || 100) + ch - bw/2 };
}

/* ==========================================================================
   Bewegingsprincipes (ontleend aan klassieke animatie)
   - Anticipatie en uitdempen zitten in de easing-curve: ze trekt eerst een tikje terug voor ze
     vertrekt, en schiet op het einde licht door voor ze tot rust komt.
   - Bogen: niets in de natuur beweegt in een rechte lijn. Een CSS-transitie interpoleert wél recht,
     dus leggen we er een extra, optelbare (composite:'add') animatie overheen die het ballonnetje
     onderweg loodrecht op zijn baan laat uitwijken. Het pad wordt zo een boog.
   - Overlappende actie: de tekst onder een ballonnetje vertrekt een fractie later en komt dus een
     fractie later aan -- ze sleept na.
   Werkt de Web Animations API met optelbare animaties niet, dan valt alles terug op de gewone
   transitie: dan beweegt het recht, en dat is geen probleem. */
/* ---- tempo ---------------------------------------------------------------
   Eén knop voor het hele ritme van een stapovergang. Alles wat hieronder een duur of een vertraging is,
   loopt langs t() of ts() en schaalt dus mee. Lager = vinniger, hoger = trager; 1 is het oude tempo.
   Verhoudingen blijven gelijk, dus de choreografie (wie eerst vertrekt, wie nasleept) blijft staan. */
var SC_TEMPO = 0.46;
function scT(sec){ return +(sec*SC_TEMPO).toFixed(3); }
function scTs(sec){ return scT(sec)+'s'; }
/* Dezelfde curves als in de stylesheet. Ze staan hier nog eens omdat een inline transition-timing-function
   die uit een custom property komt niet in elke browser even betrouwbaar doorrekent. Pas je er één aan,
   pas dan ook haar tegenhanger bij --sc-ease-* aan. */
var SC_EASE_MOVE     = 'cubic-bezier(.42,-0.10,.58,1.08)';
var SC_EASE_VERTREK  = 'cubic-bezier(.58,.02,.92,.36)';
var SC_EASE_AANKOMST = 'cubic-bezier(.14,.78,.24,1.03)';
var SC_EASE_POP      = 'cubic-bezier(.2,1.42,.34,1)';
/* De curve voor het kader dat groter of kleiner wordt. Ze trekt eerst 2,5% de andere kant op en schiet
   op het einde een half procent door -- bij een hoogteverschil van 200px is dat een terugtrek van vijf
   pixels. Meer moet het niet zijn: het kader is de achtergrond, niet de act. Alles wat aan die hoogte
   hangt (het gebouw aan de onderrand, de balk eronder, de inhoud die meeschuift) krijgt exact dezelfde
   curve, anders zwemmen ze los van elkaar. */
var SC_EASE_KADER    = 'cubic-bezier(.55,-0.22,.4,1.1)';
function pebArc(el, dx, dy, durMs, delayMs){
  var layer = el.querySelector('.sc-peb-arc');
  if(!layer || !layer.animate) return;
  var dist = Math.sqrt(dx*dx + dy*dy);
  if(dist < 60) return;                       /* korte sprongetjes hoeven geen boog */
  var amp = Math.min(30, 8 + dist*0.07);
  /* loodrecht op de baan uitwijken, en altijd naar boven toe: dat leest als een worp, niet als een dip */
  var nx = -dy/dist, ny = dx/dist;
  if(ny > 0){ nx = -nx; ny = -ny; }
  try{
    layer.animate([
      { transform:'translate3d(0,0,0)' },
      { transform:'translate3d('+(nx*amp).toFixed(1)+'px,'+(ny*amp).toFixed(1)+'px,0)', offset:.5 },
      { transform:'translate3d(0,0,0)' }
    ], { duration:durMs, delay:delayMs||0, easing:'ease-in-out' });
  }catch(e){}
}
/* het gebouw veert bij het landen even in: squash-and-stretch, maar heel ingehouden. Ook dit gebeurt
   op een aparte laag, om dezelfde reden als hierboven. */
function bldgSettle(el, durMs, delayMs){
  if(!el) return;
  setTimeout(function(){ bldgAnim(el, 'sc-land'); }, (delayMs || 0) + durMs*0.55);
}

/* Hover-gedrag van een groep ballonnetjes: het gehoverde groeit en komt bovenaan, de buren wijken uit
   met een kracht die met de afstand afneemt en een vertraging die met de afstand oploopt (een
   rimpeling i.p.v. zeven tegels die synchroon opschuiven). De buren mogen elkaar overlappen. */
function pebWireHover(scope, list, onEnter, onLeave){
  list.forEach(function(me){
    var el = me.el;
    if(el._scEnter) el.removeEventListener('mouseenter', el._scEnter);
    if(el._scLeave) el.removeEventListener('mouseleave', el._scLeave);
    el._scEnter = function(){
      scope.classList.add('is-hovering');
      list.forEach(function(o){
        if(o.el === el) return;
        var dx = o.x - me.x, dy = o.y - me.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
        var f = Math.max(0, 1 - d/ORBIT_PUSH_REACH);
        var mag = ORBIT_PUSH_MAX * Math.pow(f, 1.35);
        var pd = (d/2600).toFixed(3)+'s';
        o.el.style.setProperty('--push-x', ((dx/d)*mag).toFixed(1)+'px');
        o.el.style.setProperty('--push-y', ((dy/d)*mag).toFixed(1)+'px');
        o.el.style.transitionDuration = '.78s,.5s';
        o.el.style.transitionTimingFunction = '';   /* een vertrek- of aankomstcurve hoort hier niet */
        o.el.style.transitionDelay = pd + ',' + pd;
      });
      if(onEnter) onEnter();
    };
    el._scLeave = function(){
      scope.classList.remove('is-hovering');
      list.forEach(function(o){
        o.el.style.setProperty('--push-x','0px');
        o.el.style.setProperty('--push-y','0px');
        o.el.style.transitionDelay = '0s,0s';
      });
      if(onLeave) onLeave();
    };
    el.addEventListener('mouseenter', el._scEnter);
    el.addEventListener('mouseleave', el._scLeave);
  });
}

/* Een korte sprong hoort niet even lang te duren als een lange. Geven we alles dezelfde duur, dan
   kruipt wat dichtbij ligt en jaagt wat ver moet -- en leest de hele groep als één blok dat verschuift.
   De duur groeit dus mee met de afstand, maar sublineair (wortel): een worp over dubbele afstand duurt
   geen dubbele tijd. */
function pebDuur(el, x, y, basis){
  var b = parseFloat(basis || '.8');
  if(!el._scHome) return b.toFixed(2)+'s';
  var dx = x - el._scHome.x, dy = y - el._scHome.y;
  var d = Math.sqrt(dx*dx + dy*dy);
  var f = 0.6 + 0.55*Math.sqrt(Math.min(d, 520)/520);
  return Math.max(scT(.34), Math.min(b*1.12, b*f)).toFixed(2)+'s';
}
/* De cadans van een groep loopt niet gelijkmatig: bij een vaste tussenstap tikt de reeks als een
   metronoom. De eerste vertrekken ruimer na elkaar, de laatste sluiten dichter aan -- de groep haalt
   zichzelf in en komt samen aan. */
function pebCadans(i, n, stap){
  if(!stap || n < 2) return 0;
  var t = i/(n-1);
  return stap*(n-1)*(1 - Math.pow(1-t, 1.85));
}
/* een ballonnetje op zijn plaats zetten. `home` wordt bijgehouden omdat de duwberekening met die vaste
   punten rekent en niet met gemeten posities: anders zou het zweven zichzelf voeden en gaan trillen. */
function pebPlace(el, x, y, move, delay, arc, fade, ease){
  if(arc && el._scHome){
    var durMs = parseFloat(move || '.78') * 1000;
    pebArc(el, x - el._scHome.x, y - el._scHome.y, durMs, (delay||0)*1000);
  }
  el._scHome = { x:x, y:y };
  var d = (delay || 0).toFixed(3)+'s';
  el.style.transitionDuration = (move || scTs(.78)) + ',' + (fade || scTs(.5));
  el.style.transitionDelay = d + ',' + d;
  /* geen curve meegegeven? dan geldt weer die uit de stylesheet */
  el.style.transitionTimingFunction = ease ? (ease + ',ease') : '';
  el.style.setProperty('--x', Math.round(x)+'px');
  el.style.setProperty('--y', Math.round(y)+'px');
  el.style.setProperty('--push-x','0px');
  el.style.setProperty('--push-y','0px');
}
/* De allereerste plaatsing van een ballonnetje mag niet bewegen: zonder deze stap zou het van (0,0),
   de linkerbovenhoek van het podium, komen aanvliegen. We zetten de waarde dan eerst zonder overgang
   en laten pas daarna de gewone plaatsing (met haar duur en vertraging) los. */
function pebZet(el, x, y, move, delay, arc, fade, ease){
  if(!el._scHome){
    el.style.transitionDuration = '0s,0s';
    el.style.transitionDelay = '0s,0s';
    el._scHome = { x:x, y:y };
    el.style.setProperty('--x', Math.round(x)+'px');
    el.style.setProperty('--y', Math.round(y)+'px');
    void el.offsetWidth;
  }
  pebPlace(el, x, y, move, delay, arc, fade, ease);
}
/* is-in weghalen is wat een ballonnetje zichtbaar maakt. Dat moet in een volgend frame gebeuren: in
   hetzelfde frame als de plaatsing zou de browser beide veranderingen samen doorrekenen en zou het
   opengroeien niet te zien zijn. */
function pebToon(el){
  if(!el.classList.contains('is-in')) return;
  requestAnimationFrame(function(){ el.classList.remove('is-in'); });
}
/* De eerste opbouw mag niet bewegen: waarden zetten met de transities uit, één reflow forceren zodat
   de browser die stand als beginpunt neemt, en daarna pas weer aanzetten. */
function stageInstant(fn){
  var st = $('sc-stage');
  if(!st){ fn(); return; }
  st.classList.add('is-instant');
  fn();
  void st.offsetWidth;
  st.classList.remove('is-instant');
}
/* groeirichting + hoe ver het tekstblok meezakt, afhankelijk van waar het ballonnetje staat: aan de
   rand groeit het naar binnen, zodat het nooit tegen de rand van de kaart aan groeit. */
function pebGrowDir(el, x, y, w, h, ext){
  var fx = Math.max(0, Math.min(1, (x - (-ext.l)) / Math.max(1, w - ext.r + ext.l)));
  var fy = Math.max(0, Math.min(1, (y - (-ext.t)) / Math.max(1, h - ext.b + ext.t)));
  var ox = 50 + 34*(2*fx - 1), oy = 50 + 20*(2*fy - 1);
  el.style.setProperty('--org-x', ox.toFixed(1)+'%');
  el.style.setProperty('--org-y', oy.toFixed(1)+'%');
  el.style.setProperty('--txt-y', Math.round(ORBIT_GROW_EXTRA * (1 - oy/100))+'px');
  var sub = el.querySelector('.sc-orbit-sub');
  if(sub){
    var sw = sub.offsetWidth || 224, half = sw/2, pad = 6, shift = 0;
    if(x - half < pad) shift = pad - (x - half);
    else if(x + half > w - pad) shift = (w - pad) - (x + half);
    el.style.setProperty('--sub-x', Math.round(shift)+'px');
  }
}

/* welke vakken hebben in deze stap iets te tonen? Vak 0 altijd, vak 1 en 2 zodra hun vraag beantwoord
   én gepasseerd is. Moet exact overeenkomen met wat topStrook() als markup zet. */
/* Hoogte van de antwoordrij. Ze moet niet alleen de ballonnetjes dragen maar ook wat er bij hover
   onder uitklapt: de chip zakt mee naar onder en daaronder verschijnt het toelichtingspaneel. Reken je
   die ruimte niet mee, dan schuift dat paneel over de knoppenbalk en dekt het "Volgende" af. */
function antwSlotHoogte(gr){
  var tiles = (STAGE.antw && STAGE.antw[gr.g]) || [];
  if(!tiles.length) return 230;
  var top = 0, onder = 0, sub = 0;
  tiles.forEach(function(el){
    var ext = pebExtent(el);
    if(-ext.t > top) top = -ext.t;
    if(ext.b > onder) onder = ext.b;
    var s = el.querySelector('.sc-orbit-sub');
    if(s && s.offsetHeight > sub) sub = s.offsetHeight;
  });
  return Math.round(top + 8 + onder + ORBIT_GROW_EXTRA + (sub ? sub + 10 : 0) + 8);
}

/* ---- de strook bovenaan: drie vakken --------------------------------------
   De vakken zelf staan in de stap-body (ze moeten hoogte innemen en een kader tonen); de
   ballonnetjes wonen op het podium en worden hierheen geschoven. */
var VAK_PAD_X = 20, VAK_PAD_TOP = 36, VAK_PAD_BOT = 18, VAK_K_MAX = 0.60;
function vakRect(sr, i){
  var e = document.querySelector('#sc-body .sc-topbox[data-box="'+i+'"]');
  if(!e) return null;
  var r = e.getBoundingClientRect();
  if(r.width < 24) return null;                 /* een dichtgeklapt vak is geen bestemming */
  return { x:r.left - sr.left, y:r.top - sr.top, w:r.width, h:r.height };
}
/* een groepje ballonnetjes netjes over een vak verdelen: één rij tot vier stuks, daarboven twee. De
   schaal volgt uit de ruimte die elk zo krijgt, zodat het vak zo goed mogelijk gevuld raakt. */
function vakPlaats(rect, tiles, sw, sh, plan, start){
  var n = tiles.length, lijst = [];
  if(!n) return lijst;
  var rijen = n <= 4 ? 1 : 2;
  var perRij = Math.ceil(n/rijen);
  var cw = (rect.w - 2*VAK_PAD_X)/perRij;
  var ch = (rect.h - VAK_PAD_TOP - VAK_PAD_BOT)/rijen;
  var k = Math.max(.24, Math.min(VAK_K_MAX, (cw - 8)/112, (ch - 4)/112));
  tiles.forEach(function(el, i){
    var rij = Math.floor(i/perRij), kol = i % perRij;
    var inRij = Math.min(perRij, n - rij*perRij);
    var x = rect.x + rect.w/2 + (kol - (inRij-1)/2)*cw;
    var cy = rect.y + VAK_PAD_TOP + ch*(rij + 0.5);
    var y = cy + 56*(1 - k);        /* is-mini schaalt om de bovenrand: dit zet de blob op cy */
    el.style.setProperty('--kmini', k.toFixed(3));
    el.classList.add('is-mini');
    el.classList.remove('is-off');
    pebZet(el, x, y, pebDuur(el, x, y, plan.tileDur), start + pebCadans(i, n, plan.tileStagger||0),
           plan.arc, null, SC_EASE_AANKOMST);
    pebGrowDir(el, x, y, sw, sh, pebExtent(el));
    /* de groei zit hier in --k op de tegel zelf, dus het tekstblok hoeft niet apart mee te zakken */
    el.style.setProperty('--txt-y','0px');
    if(el.classList.contains('is-in')) pebToon(el);
    lijst.push({ el:el, x:x, y:y });
  });
  return lijst;
}
/* wat niet aangeduid is reist mee naar het vak en lost onderweg op -- het verdwijnt niet ter plaatse.
   Deze groep gaat nergens staan, dus ze remt ook niet af: traag los en dan wegversnellen. */
function vakLos(tiles, rect, sw, sh, plan){
  var n = tiles.length;
  tiles.forEach(function(el, i){
    var x = rect ? rect.x + rect.w/2 : sw/2, y = rect ? rect.y + rect.h/2 : 60;
    el.classList.add('is-mini');
    pebZet(el, x, y, pebDuur(el, x, y, plan.tileDur),
           plan.offStart + pebCadans(i, n, plan.tileStagger||0),
           plan.arc, scTs(.72), SC_EASE_VERTREK);
    el.classList.add('is-off');
  });
}
/* de antwoorden van de huidige vraag, op een rij onder de vraag */
function antwRij(st, sr, sw, sh, gr, plan){
  var tiles = (STAGE.antw && STAGE.antw[gr.g]) || [], lijst = [];
  var slot = document.querySelector('#sc-body [data-slot="ans"]');
  if(!tiles.length || !slot) return lijst;
  var r = slot.getBoundingClientRect();
  var rx = r.left - sr.left, ry = r.top - sr.top, rw = r.width;
  var ext = pebExtent(tiles[0]);
  var breed = ext.r - ext.l, gap = 34, pad = Math.max(-ext.l + 8, 70);
  var stepX = breed + gap;
  if(tiles.length > 1 && stepX*(tiles.length-1) > rw - 2*pad) stepX = (rw - 2*pad)/(tiles.length-1);
  var x0 = tiles.length > 1 ? rx + rw/2 - stepX*(tiles.length-1)/2 : rx + rw/2;
  var y = ry - ext.t + 8;
  var start = (plan.ansDelay || 0);
  tiles.forEach(function(el, i){
    var x = x0 + i*stepX;
    el.classList.remove('is-mini','is-off');
    el.style.setProperty('--kmini','1');
    pebZet(el, x, y, scTs(.62), start + pebCadans(i, tiles.length, scT(.075)), plan.arc, null,
           SC_EASE_POP);
    pebGrowDir(el, x, y, sw, sh, ext);
    pebToon(el);
    lijst.push({ el:el, x:x, y:y });
  });
  return lijst;
}
/* een groep die nog niet aan de beurt is: onzichtbaar klaarzetten op de plek waar ze straks
   verschijnt, zodat ze daar ter plekke opengroeit i.p.v. uit een hoek aan te komen vliegen */
function antwParkeer(tiles, sr, sw, sh){
  var slot = document.querySelector('#sc-body [data-slot="ans"]');
  var x = sw/2, y = sh - 60;
  if(slot){ var r = slot.getBoundingClientRect(); x = r.left - sr.left + r.width/2; y = r.top - sr.top + 70; }
  tiles.forEach(function(el){
    el.classList.remove('is-mini','is-off');
    el.classList.add('is-in');
    pebZet(el, x, y, scTs(.4), 0, false);
  });
}
/* Een ballonnetje dat van de antwoordrij naar een vak verhuist, sleept zijn oude hover-listeners mee.
   Die kennen nog de oude buren en zouden die blijven wegduwen. Vandaar: eerst alles losmaken, daarna
   enkel de rij opnieuw bedraden. In de vakken staan ze te dicht op elkaar om te duwen -- daar volstaat
   het dat het gehoverde ballonnetje groeit en bovenop komt. */
function pebLosHover(el){
  if(el._scEnter) el.removeEventListener('mouseenter', el._scEnter);
  if(el._scLeave) el.removeEventListener('mouseleave', el._scLeave);
  el._scEnter = null; el._scLeave = null;
  el.style.setProperty('--push-x','0px');
  el.style.setProperty('--push-y','0px');
}
/* alles van de strook in één keer: vak 0 met de uitdagingen, vak 1 en 2 met de gegeven antwoorden,
   en de antwoorden van de vraag die nú op het scherm staat. */
function stageVakken(st, sr, sw, sh, plan){
  var rij = [];
  var alles = STAGE.tiles.slice();
  ANTW_GROEPEN.forEach(function(gr){ alles = alles.concat((STAGE.antw && STAGE.antw[gr.g]) || []); });
  alles.forEach(pebLosHover);
  st.classList.remove('is-hovering');

  var v0 = vakRect(sr, 0);
  var gekozen = STAGE.tiles.filter(function(el){ return S.complex.indexOf(el.getAttribute('data-v')) > -1; });
  var rest = STAGE.tiles.filter(function(el){ return gekozen.indexOf(el) < 0; });
  if(v0 && gekozen.length) vakPlaats(v0, gekozen, sw, sh, plan, plan.tileStart);
  rest.sort(function(a,b){ return (a._scHome ? a._scHome.x : 0) - (b._scHome ? b._scHome.x : 0); });
  vakLos(rest, v0, sw, sh, plan);

  ANTW_GROEPEN.forEach(function(gr){
    var tiles = (STAGE.antw && STAGE.antw[gr.g]) || [];
    if(!tiles.length) return;
    if(gr.stap === S.step){ rij = rij.concat(antwRij(st, sr, sw, sh, gr, plan)); return; }
    var keuze = gr.lees();
    var vak = (gr.box != null && S.step > gr.stap && keuze) ? vakRect(sr, gr.box) : null;
    if(!vak){ antwParkeer(tiles, sr, sw, sh); return; }
    var gek = tiles.filter(function(el){ return el.getAttribute('data-v') === keuze; });
    var weg = tiles.filter(function(el){ return gek.indexOf(el) < 0; });
    vakPlaats(vak, gek, sw, sh, plan, plan.tileStart);
    vakLos(weg, vak, sw, sh, plan);
  });
  pebWireHover(st, rij);
}

function stageApply(prevMode){
  var st = $('sc-stage');
  if(!st) return;
  stageBuild();
  /* stapt iemand door terwijl de wissel van de tekening nog in de wacht staat, dan halen we die naar
     voren: anders zou hij midden in de stapovergang alsnog afgaan */
  bldgFlush();
  /* het gebouw op het podium moet het huidige niveau/variant tonen: de slider kan het onderweg
     veranderd hebben, en bij het openen van een stap kan de stand verschillen van wat er staat */
  if(STAGE.lvl !== S.bldgLevel || STAGE.comm !== S.commercieel) stageBldg();
  var mode = S.step === STAP.KAVELS ? 'kavel' : S.step === STAP.DIAGRAM ? 'orbit'
           : (S.step >= STAP.BEHEER && S.step <= STAP.WENS) ? 'recap' : 'none';
  var lines = $('sc-stage-lines');
  STAGE.run++;
  STAGE.mode = mode;
  st.classList.toggle('is-hidden', mode === 'none');
  if(lines) lines.classList.toggle('is-off', mode !== 'orbit');
  if(mode === 'none' || window.innerWidth <= 640) return;

  /* ---- het tempo van deze overgang ----------------------------------------
     Elke wissel is een reeks zetten na elkaar, niet één beweging tegelijk. Van stap 2 naar 3 is de
     hoofdbeweging "alles gaat naar boven": de ballonnetjes krimpen en trekken naar de strook, het
     gebouw schuift daar achteraan, en pas in de ruimte die zo vrijkomt verschijnen de vraag en de
     antwoorden. Terug van 3 naar 2 loopt dezelfde reeks in omgekeerde volgorde: eerst zakt het
     gebouw, dan komen de ballonnetjes terug naar hun plaats, en pas als die staan tekenen de
     lijntjes zich weer. */
  var first = !prevMode;
  var naarBoven  = prevMode === 'orbit'  && mode === 'recap';
  var terugOpen  = prevMode === 'recap'  && mode === 'orbit';
  var plan = { bldgDelay:scT(0), bldgDur:scTs(.82), tileStart:scT(0), tileStagger:scT(.055), tileDur:scTs(.8),
               offStart:scT(0), bodyDelay:scT(0), ansDelay:scT(.06), lineDelay:scT(900), arc:!first };
  if(first)          plan = { bldgDelay:0, bldgDur:'0s', tileStart:0, tileStagger:0, tileDur:'0s',
                              offStart:0, bodyDelay:0, ansDelay:0, lineDelay:0, arc:false };
  else if(naarBoven) plan.bldgDelay = scT(.2), plan.tileStart = scT(0), plan.offStart = scT(.03), plan.bodyDelay = scT(.28), plan.ansDelay = scT(.46),
                     plan.bldgEase = SC_EASE_AANKOMST;
  else if(terugOpen) plan.bldgDelay = scT(0), plan.tileStart = scT(.14), plan.offStart = scT(.3), plan.bodyDelay = scT(.1),
                     plan.lineDelay = scT(1020), plan.tileEase = SC_EASE_AANKOMST;
  /* stap 1 <-> 2 is de grote hoogtewissel. Kader, gebouw en de balk eronder delen daar dezelfde curve,
     met de lichte terugtrek vooraf -- ze zijn één beweging, geen drie die toevallig samenvallen. */
  else if(prevMode === 'kavel' && mode === 'orbit') plan.tileStart = scT(.18), plan.tileStagger = scT(.075),
                     plan.bldgEase = SC_EASE_KADER;
  else if(prevMode === 'orbit' && mode === 'kavel') plan.bodyDelay = scT(.16), plan.bldgEase = SC_EASE_KADER;
  else if(mode === 'recap' && prevMode === 'recap') plan.tileStagger = 0, plan.tileDur = scTs(.5), plan.bodyDelay = 0, plan.ansDelay = scT(.05),
                     plan.bldgEase = SC_EASE_KADER;

  STAGE.plan = plan;
  var body = $('sc-body');
  if(body && !first){
    body.classList.remove('sc-fade-in');
    void body.offsetWidth;
    body.style.setProperty('--sc-body-delay', plan.bodyDelay + 's');
    body.classList.add('sc-fade-in');
  }

  /* ---- eerst de slots op maat, dan pas meten ------------------------------
     De hoogte van het gebouw-slot volgt uit de werkelijke hoogte van de tekening, en die van de
     antwoordrij uit de ruimte die een ballonnetje bij hover nodig heeft. Zouden we die pas na de
     meting zetten, dan mikten alle bewegingen op de oude stand. */
  var inkt = bldgInkt();
  var grNu = antwGroep(S.step);
  if(mode === 'recap'){
    var aSlot = document.querySelector('#sc-body [data-slot="ans"]');
    if(aSlot && grNu) aSlot.style.height = antwSlotHoogte(grNu)+'px';
  }

  var sr = st.getBoundingClientRect(), sw = sr.width, sh = sr.height;
  function slot(name){
    var e = document.querySelector('#sc-body [data-slot="'+name+'"]');
    if(!e) return null;
    var r = e.getBoundingClientRect();
    return { top:r.top - sr.top, bottom:r.bottom - sr.top, h:r.height,
             left:r.left - sr.left, w:r.width };
  }
  var bldg = $('sc-stage-bldg');
  var os0 = slot('orbit'), bs = slot('bldg');
  /* Het gebouw staat in elke stap ergens anders en in een ander formaat. We zetten enkel de doelwaarden;
     de transform-transitie op het element doet het glijden. In de stappen met de strook mikken we op
     de bovenrand van de tekening zelf (inkt.t), niet op de bovenrand van het lege kader: anders zou de
     lucht boven een klein gebouw als een gat in de bladspiegel blijven staan. */
  var bTarget = null;
  if(mode === 'orbit' && os0)   bTarget = { x:sw/2, y:os0.top + os0.h - 56, k:1 };
  else if(mode === 'recap' && bs){
    /* Het gebouw staat nu in de rechterkolom van de strook. We schalen het zodat de tékening (niet het
       lege kader eromheen) in dat vak past, en zetten ze er dan midden in -- horizontaal én verticaal.
       De marges van de tekening in haar viewBox verschillen per niveau, dus dat rekenen we uit de
       gemeten inkt i.p.v. met vaste getallen. */
    var teken = { h:Math.max(.05, inkt.h), w:Math.max(.05, inkt.r - inkt.l) };
    var kRec = Math.min((bs.w - RECAP_BLDG_PAD*2)/(teken.w*BLDG_BOX),
                        (bs.h - RECAP_BLDG_PAD*2)/(teken.h*BLDG_BOX));
    kRec = Math.max(.3, Math.min(.85, kRec));
    var midX = bs.left + bs.w/2, midY = bs.top + bs.h/2;
    bTarget = {
      k: kRec,
      /* --x is het midden van het 300px-kader; de tekening zit daar niet per se gecentreerd in */
      x: midX - ((inkt.l + inkt.r)/2 - .5)*BLDG_BOX*kRec,
      /* --y is de onderrand van dat kader; zo komt het midden van de tekening op het midden van het vak */
      y: midY + (2 - inkt.t - inkt.b)/2*BLDG_BOX*kRec
    };
  }
  else if(bs){
    var kKavel = Math.max(.4, Math.min(1, (bs.h - 6)/BLDG_BOX));
    /* de grondlijn van de tekening op de onderrand van het slot, niet de onderrand van het kader */
    bTarget = { x:sw/2, y: bs.bottom - 2 + (1 - inkt.b)*BLDG_BOX*kKavel, k:kKavel };
  }

  function zetten(){
    if(bTarget && bldg){
      bldg.style.setProperty('--x', Math.round(bTarget.x)+'px');
      /* omgerekend naar afstand tot de onderrand (zie top:100% in de stylesheet) */
      bldg.style.setProperty('--y', Math.round(bTarget.y - sh)+'px');
      bldg.style.setProperty('--k', bTarget.k.toFixed(3));
      bldg.style.transitionDuration = plan.bldgDur;
      bldg.style.transitionDelay = plan.bldgDelay + 's';
      /* Het gebouw volgt de ballonnetjes achterna en moet ergens gaan staan: het remt dus af i.p.v.
         symmetrisch te glijden. Op de terugweg vertrekt het als eerste en mag de anticipatie van de
         gewone verplaatsingscurve wel. */
      bldg.style.transitionTimingFunction = plan.bldgEase ? (plan.bldgEase + ',ease') : '';
      /* het kader neemt deze timing letterlijk over -- duur, vertraging én curve -- zodat hoogte en
         gebouw in de pas blijven lopen */
      STAGE.kaderDur = parseFloat(plan.bldgDur);
      STAGE.kaderWacht = plan.bldgDelay || 0;
      STAGE.kaderEase = plan.bldgEase || SC_EASE_MOVE;
      if(!first && (naarBoven || terugOpen)) bldgSettle($('sc-bldg-img'), parseFloat(plan.bldgDur)*1000, plan.bldgDelay*1000);
    }
    if(mode === 'kavel'){
      /* De terugweg gaat naar binnen én naar beneden: de onderste ballonnetjes vertrekken eerst en de
         beweging werkt zich naar boven op. Ze gaan nergens staan maar verdwijnen in het gebouw: geen
         afremmen, wel wegversnellen. De duur volgt de afstand -- zetten we die gelijk, dan komen ze
         allemaal op hetzelfde moment in het midden aan en moet het verste ballonnetje het hardst
         vliegen. Het wegvagen duurt langer dan de vlucht, zodat ze zichtbaar in het gebouw krimpen
         i.p.v. onderweg al op te lossen. */
      var doelX = sw/2, doelY = (bs ? bs.bottom - 120 : sh/2);
      var orde = STAGE.tiles.map(function(el){
        return { el:el, y:(el._scHome ? el._scHome.y : 0) };
      }).sort(function(a, b){ return b.y - a.y; });
      var nUit = orde.length;
      orde.forEach(function(o, rang){
        var el = o.el;
        el.classList.add('is-in');
        el.classList.remove('is-mini','is-off');
        var dur = pebDuur(el, doelX, doelY, scTs(.62));
        pebZet(el, doelX, doelY, dur, plan.tileStart + rang*scT(.06), plan.arc,
               (parseFloat(dur)*1.7).toFixed(2)+'s',
               prevMode === 'orbit' ? SC_EASE_VERTREK : null);
      });
      ANTW_GROEPEN.forEach(function(gr){ antwParkeer((STAGE.antw && STAGE.antw[gr.g]) || [], sr, sw, sh); });
      return;
    }
    if(mode === 'recap'){
      stageVakken(st, sr, sw, sh, plan);
      return;
    }
    var os = slot('orbit');
    if(!os) return;
    STAGE.tiles.forEach(function(el){ el.classList.remove('is-mini','is-off'); });
    ANTW_GROEPEN.forEach(function(gr){ antwParkeer((STAGE.antw && STAGE.antw[gr.g]) || [], sr, sw, sh); });
    orbitLayout(st, sw, sh, os, prevMode !== 'orbit', bTarget, plan);
  }
  if(first) stageInstant(zetten); else zetten();
}

/* ==========================================================================
   Het diagram van stap 2: zeven ballonnetjes in een hoefijzer rond het gebouw, elk met een gestippeld
   lijntje naar zijn eigen pin in de tekening.
   ========================================================================== */
function orbitLayout(st, sw, sh, os, entering, bTarget, plan){
  plan = plan || { tileStart:0, tileStagger:scT(.055), tileDur:scTs(.8), lineDelay:scT(900), arc:false };
  var runId = STAGE.run;
  var linesSvg = $('sc-stage-lines');
  linesSvg.setAttribute('width', sw);
  linesSvg.setAttribute('height', sh);
  var bldgEl = $('sc-stage-bldg');
  var sr = st.getBoundingClientRect();
  var cx = bTarget ? bTarget.x : sw/2;
  /* De pinnen worden niet rechtstreeks opgemeten: op dit moment glijdt het gebouw nog naar zijn nieuwe
     plaats, dus een meting zou de halve animatie opleveren. We meten de stand van elke pin t.o.v. het
     ongeschaalde kader (delen door de schaal die het gebouw nu heeft) en rekenen daarmee de plaats uit
     die de pin in de eindstand zal hebben. */
  var br = bldgEl.getBoundingClientRect();
  var kNow = (br.width/300) || 1;
  var bcx = br.left + br.width/2 - sr.left, bcy = br.bottom - sr.top;
  var bTx = bTarget ? bTarget.x : bcx, bTy = bTarget ? bTarget.y : bcy, bTk = bTarget ? bTarget.k : kNow;

  var pins = BEHOEFTEN_PIN_IDS.map(function(id, idx){
    var pinEl = bldgEl.querySelector('#pin-'+id);
    var tileEl = st.querySelector('.sc-orbit-tile[data-v="'+id+'"]');
    if(!pinEl || !tileEl) return null;
    var pr = pinEl.getBoundingClientRect();
    var ox = (pr.left + pr.width/2 - sr.left - bcx)/kNow, oy = (pr.top + pr.height/2 - sr.top - bcy)/kNow;
    var px = bTx + ox*bTk, py = bTy + oy*bTk;
    /* vaste, lichtjes wisselende uitbuiging per lijntje voor een organisch "freehand" effect --
       stabiel per pin (niet elke render opnieuw willekeurig) zodat het niet knippert bij hertekenen */
    var bend = (idx % 2 === 0 ? 1 : -1) * (9 + (idx*7) % 11);
    return { tileEl:tileEl, blobEl:tileEl.querySelector('.sc-orbit-blobin'), px:px, py:py, bend:bend };
  }).filter(Boolean);
  var n = pins.length;
  if(!n) return;

  var ext = pebExtent(pins[0].tileEl);
  var halfW = (ext.r - ext.l)/2 + 3, halfH = (ext.b - ext.t)/2 + 3;

  var usable = Math.max(60, sw/2 - Math.max(-ext.l, ext.r) - ORBIT_INSET);
  var targets = ORBIT_ANCHORS.slice(0, n).map(function(a){
    return { x: cx + a.kx*usable, y: os.top + a.y };
  });

  /* Veiligheidsnet. Bij deze ankers hoort dit niets meer te doen, maar legt een thema andere
     lettergroottes op (hogere chips), dan mag er nooit overlap of uitsteek ontstaan. De toets is
     rechthoekig, niet cirkelvormig: twee vierkant-achtige ballonnetjes raken elkaar op de diagonaal
     nog terwijl hun hart-tot-hart-afstand ruim genoeg lijkt. */
  var minX = -ext.l + 2, maxX = sw - ext.r - 2;
  var minY = os.top - ext.t + 2, maxY = os.top + os.h - ext.b - 2;
  for(var pass=0; pass<60; pass++){
    var moved = false;
    for(var gi=0; gi<n; gi++){
      for(var gj=gi+1; gj<n; gj++){
        var a = targets[gi], b = targets[gj];
        var ddx = b.x-a.x, ddy = b.y-a.y;
        var ox = 2*halfW - Math.abs(ddx), oy = 2*halfH - Math.abs(ddy);
        if(ox > 0 && oy > 0){
          /* duw langs de as die het snelst uit elkaar leidt; langs de diagonaal duwen zou de rijen
             van de bedoelde compositie door elkaar halen */
          if(ox <= oy){ var sx = (ddx < 0 ? -1 : 1) * (ox/2 + 1); a.x -= sx; b.x += sx; }
          else { var sy = (ddy < 0 ? -1 : 1) * (oy/2 + 1); a.y -= sy; b.y += sy; }
          moved = true;
        }
      }
    }
    for(var gk=0; gk<n; gk++){
      var t = targets[gk], px0 = t.x, py0 = t.y;
      t.x = Math.max(minX, Math.min(maxX, t.x));
      t.y = Math.max(minY, Math.min(maxY, t.y));
      if(t.x !== px0 || t.y !== py0) moved = true;
    }
    if(!moved) break;
  }

  function permute(arr){
    if(arr.length <= 1) return [arr];
    var out = [];
    arr.forEach(function(item, i){
      var rest = arr.slice(0,i).concat(arr.slice(i+1));
      permute(rest).forEach(function(p){ out.push([item].concat(p)); });
    });
    return out;
  }
  function segCross(a1,a2,b1,b2){
    function ccw(a,b,c){ return (c.y-a.y)*(b.x-a.x) > (b.y-a.y)*(c.x-a.x); }
    return ccw(a1,b1,b2) !== ccw(a2,b1,b2) && ccw(a1,a2,b1) !== ccw(a1,a2,b2);
  }
  function pointSegDist(p, a, b){
    var vx = b.x-a.x, vy = b.y-a.y, wx = p.x-a.x, wy = p.y-a.y;
    var len2 = vx*vx + vy*vy;
    var tt = len2 ? Math.max(0, Math.min(1, (wx*vx + wy*vy)/len2)) : 0;
    var dx = wx - tt*vx, dy = wy - tt*vy;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function segDist(a1,a2,b1,b2){
    if(segCross(a1,a2,b1,b2)) return 0;
    return Math.min(pointSegDist(a1,b1,b2), pointSegDist(a2,b1,b2),
                    pointSegDist(b1,a1,a2), pointSegDist(b2,a1,a2));
  }
  /* Uitputtende zoektocht naar de koppeling pin->ankerpunt. Bij zeven punten zijn alle 5040 volgordes
     in een oogwenk te proberen, en meetkundig bestaat er voor twee puntenreeksen altijd wel een
     kruisingsvrije koppeling. Niet kruisen is echter niet genoeg: twee lijnen die op een paar px van
     elkaar lopen kruisen alsnog zodra de ballonnetjes zweven of bij hover verschuiven. Daarom weegt de
     score ook de onderlinge afstand, en pas als alles ruim genoeg ligt beslist de "logische waaier":
     pins gerangschikt op hun hoek t.o.v. het zwaartepunt van alle pins, vanaf linksonder met de klok
     mee over de bovenkant naar rechtsonder -- dezelfde route die de slinger zelf aflegt. */
  var pinCxx = pins.reduce(function(s,p){ return s+p.px; }, 0)/n;
  var pinCyy = pins.reduce(function(s,p){ return s+p.py; }, 0)/n;
  function fanAngle(p){
    var a = Math.atan2(p.py-pinCyy, p.px-pinCxx) * 180/Math.PI;
    return (a - 90 + 360) % 360;
  }
  var pxOrder = pins.map(function(p,i){ return i; }).sort(function(a,b){ return fanAngle(pins[a])-fanAngle(pins[b]); });
  var rankOfPin = new Array(n);
  pxOrder.forEach(function(pinIdx, rank){ rankOfPin[pinIdx] = rank; });

  var perms = permute(targets.map(function(_,i){ return i; }));
  var bestPerm = perms[0], bestCross = Infinity, bestScore = Infinity;
  for(var pi=0; pi<perms.length; pi++){
    var perm = perms[pi], cross = 0;
    for(var i=0; i<n; i++){
      for(var j=i+1; j<n; j++){
        if(segCross({x:pins[i].px,y:pins[i].py}, targets[perm[i]], {x:pins[j].px,y:pins[j].py}, targets[perm[j]])) cross++;
      }
    }
    if(cross > bestCross) continue;
    var pen = 0;
    for(var qa=0; qa<n; qa++){
      for(var qb=qa+1; qb<n; qb++){
        var gap = segDist({x:pins[qa].px,y:pins[qa].py}, targets[perm[qa]],
                          {x:pins[qb].px,y:pins[qb].py}, targets[perm[qb]]);
        if(gap < ORBIT_LINE_GAP){ var e = ORBIT_LINE_GAP - gap; pen += e*e; }
      }
    }
    var cost = 0;
    for(var k=0; k<n; k++){ var dd = rankOfPin[k]-perm[k]; cost += dd*dd; }
    var score = pen*4 + cost;
    if(cross < bestCross || score < bestScore){ bestCross = cross; bestScore = score; bestPerm = perm; }
  }

  var list = [];
  /* van links naar rechts vertrekken, als pionnen die na elkaar verzet worden */
  var xOrder = pins.map(function(p,i){ return i; }).sort(function(a,b){ return targets[bestPerm[a]].x - targets[bestPerm[b]].x; });
  var rankOfTile = new Array(n);
  xOrder.forEach(function(idx, rank){ rankOfTile[idx] = rank; });
  pins.forEach(function(p, i){
    var t = targets[bestPerm[i]];
    p.home = t;
    var rank = rankOfTile[i];
    /* Komen ze terug van de herinneringsstrook, dan gaan ze ergens staan en remmen ze dus af, in
       dezelfde ongelijke cadans als op de heenweg. Vanuit stap 1 waaieren ze open en houden ze de
       gewone verplaatsingscurve met haar kleine terugtrek. */
    var vertraag = plan.tileEase
      ? pebCadans(rank, n, plan.tileStagger || 0)
      : rank*(plan.tileStagger || 0);
    var dur = plan.tileEase
      ? pebDuur(p.tileEl, t.x, t.y, plan.tileDur || '.78s')
      : (plan.tileDur || (entering ? scTs(.7) : scTs(.78)));
    pebPlace(p.tileEl, t.x, t.y, dur, (plan.tileStart || 0) + vertraag, plan.arc, null, plan.tileEase);
    pebGrowDir(p.tileEl, t.x, t.y, sw, sh, ext);
    list.push({ el:p.tileEl, x:t.x, y:t.y });
  });

  /* Bij het binnenkomen staan ze eerst onzichtbaar, ietsje kleiner en een tikje lager klaar; ze komen
     daarna één voor één naar boven op hun plaats. De vertraging per ballonnetje zit al in --push-delay
     (zie pebPlace), zodat verplaatsen en opkomen exact hetzelfde tempo volgen. */
  if(entering){
    pins.forEach(function(p){ p.tileEl.classList.add('is-in'); });
    void st.offsetWidth;
    requestAnimationFrame(function(){
      if(runId !== STAGE.run) return;
      pins.forEach(function(p){ p.tileEl.classList.remove('is-in'); });
    });
  } else {
    pins.forEach(function(p){ p.tileEl.classList.remove('is-in'); });
  }

  var lineHtml = '';
  pins.forEach(function(p, i){
    lineHtml += '<path data-i="'+i+'" d="" fill="none" stroke="#a9c7dc" stroke-width="1.4" stroke-dasharray="0.5 5" stroke-linecap="round"/>'+
                '<circle cx="'+p.px+'" cy="'+p.py+'" r="2.3" fill="#a9c7dc" opacity="0"/>';
  });
  linesSvg.innerHTML = lineHtml;
  var lineEls = linesSvg.querySelectorAll('path');
  var dotEls = linesSvg.querySelectorAll('circle');

  /* Naregeling op de kromming: de kruisingsvrije koppeling is gerekend op rechte verbindingen, maar er
     worden gebogen lijntjes getekend, en twee bijna-parallelle lijnen kunnen door hun uitbuiging tóch
     kruisen. Zolang twee krommen elkaar snijden of te dicht bij elkaar komen, halveren we hun
     uitbuiging; bij uitbuiging 0 valt een kromme samen met haar rechte verbinding, en die kruisen per
     constructie niet -- dus dit eindigt altijd. */
  function restEnd(p){
    var t = p.home, r = p.blobEl ? p.blobEl.getBoundingClientRect() : null;
    var half = r ? r.width/2 : 56;
    var dx = t.x-p.px, dy = t.y-p.py, dist = Math.sqrt(dx*dx+dy*dy) || 1;
    var pull = Math.min(half + 7, dist*0.62);
    return { x: t.x - (dx/dist)*pull, y: t.y - (dy/dist)*pull, dx:dx, dy:dy, dist:dist };
  }
  function curvePts(p, bend){
    var e = restEnd(p);
    var mx = (p.px+e.x)/2, my = (p.py+e.y)/2;
    var nx = -e.dy/e.dist, ny = e.dx/e.dist;
    var cxp = mx + nx*bend, cyp = my + ny*bend;
    var out = [];
    for(var k=0;k<=28;k++){
      var u = k/28, iu = 1-u;
      out.push({ x: iu*iu*p.px + 2*iu*u*cxp + u*u*e.x, y: iu*iu*p.py + 2*iu*u*cyp + u*u*e.y });
    }
    return out;
  }
  function tooClose(A,B){
    for(var a=0;a<A.length-1;a++) for(var b=0;b<B.length-1;b++)
      if(segCross(A[a],A[a+1],B[b],B[b+1])) return true;
    for(var i2=0;i2<A.length;i2++) for(var j2=0;j2<B.length;j2++){
      var dx2 = A[i2].x-B[j2].x, dy2 = A[i2].y-B[j2].y;
      if(dx2*dx2 + dy2*dy2 < 196) return true; /* < 14px van elkaar */
    }
    return false;
  }
  for(var relax=0; relax<6; relax++){
    var curves = pins.map(function(p){ return curvePts(p, p.bend); });
    var clash = false;
    for(var ci=0; ci<n; ci++){
      for(var cj=ci+1; cj<n; cj++){
        if(tooClose(curves[ci], curves[cj])){ pins[ci].bend *= 0.5; pins[cj].bend *= 0.5; clash = true; }
      }
    }
    if(!clash) break;
  }

  /* De lijntjes hangen letterlijk aan de ballonnetjes: elk frame wordt het echte, actuele middelpunt
     van de blob opgemeten en het lijntje bijgewerkt, zodat het meebeweegt met het zweven, het groeien
     bij hover en de duw van de buren. `reveal` laat een lijntje bij het binnenkomen van de stap groeien
     vanaf het ballonnetje naar het gebouw: we splitsen de bezier op parameter u (de Casteljau) en
     tekenen enkel het stuk dat al "geschreven" is. */
  var reveal = { t0: (entering ? now() + (plan.lineDelay || 900) : 0), dur: 460, stagger: 70 };
  var revOrder = pins.map(function(p,i){ return i; }).sort(function(a,b){ return pins[a].home.x - pins[b].home.x; });
  var revRank = new Array(n);
  revOrder.forEach(function(idx, rank){ revRank[idx] = rank; });

  function updateLine(i){
    var p = pins[i], path = lineEls[i], dot = dotEls[i];
    if(!path) return;
    var r = 1;
    if(reveal.t0){
      r = (now() - reveal.t0 - revRank[i]*reveal.stagger) / reveal.dur;
      r = Math.max(0, Math.min(1, r));
    }
    if(r <= 0){ path.setAttribute('d',''); if(dot) dot.setAttribute('opacity','0'); return; }
    var tr = (p.blobEl || p.tileEl).getBoundingClientRect();
    var bx = tr.left + tr.width/2 - sr.left, by = tr.top + tr.height/2 - sr.top;
    var dx = bx-p.px, dy = by-p.py, dist = Math.sqrt(dx*dx+dy*dy) || 1;
    var pullback = Math.min(tr.width/2 + 7, dist*0.62);
    var ex = bx - (dx/dist)*pullback, ey = by - (dy/dist)*pullback;
    var mx = (p.px+ex)/2, my = (p.py+ey)/2;
    var nx = -dy/dist, ny = dx/dist;
    var ccx = mx + nx*p.bend, ccy = my + ny*p.bend;
    if(r >= 1){
      path.setAttribute('d', 'M'+p.px+' '+p.py+' Q '+ccx+' '+ccy+' '+ex+' '+ey);
    } else {
      /* enkel het laatste stuk (vanaf het ballonnetje) is al getekend */
      var u = 1 - r, iu = 1 - u;
      var sx = iu*iu*p.px + 2*iu*u*ccx + u*u*ex, sy = iu*iu*p.py + 2*iu*u*ccy + u*u*ey;
      var c2x = ccx + u*(ex-ccx), c2y = ccy + u*(ey-ccy);
      path.setAttribute('d', 'M'+sx+' '+sy+' Q '+c2x+' '+c2y+' '+ex+' '+ey);
    }
    if(dot) dot.setAttribute('opacity', r >= 0.995 ? '1' : '0');
  }
  pins.forEach(function(p,i){ updateLine(i); });

  /* De lus draait zolang dit diagram in beeld staat: de ballonnetjes blijven traag zweven, dus de
     lijntjes moeten blijven volgen. Hij stopt zichzelf zodra de stap wisselt of er een nieuwe lay-out
     gebeurt. Bij "reduce motion" staat het zweven uit en volstaat tekenen tijdens hover. */
  var reduce = false;
  try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var rafId = null, stopTimer = null;
  function tick(){
    if(runId !== STAGE.run || !st.parentNode){ rafId = null; return; }
    pins.forEach(function(p,i){ updateLine(i); });
    rafId = requestAnimationFrame(tick);
  }
  function startTicking(){ if(stopTimer){ clearTimeout(stopTimer); stopTimer = null; } if(!rafId) tick(); }
  function stopTickingSoon(){
    if(!reduce) return;
    if(stopTimer) clearTimeout(stopTimer);
    stopTimer = setTimeout(function(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }, 700);
  }
  startTicking();
  pebWireHover(st, list, startTicking, stopTickingSoon);
}
function now(){ return (window.performance && performance.now) ? performance.now() : +new Date(); }

var _scResizeBound = false;
function stageResizeBind(){
  if(_scResizeBound) return;
  _scResizeBound = true;
  scGutter();
  window.addEventListener('resize', function(){
    if(!STAGE.built) return;
    stageApply(STAGE.mode);      /* zelfde modus: herplaatsen zonder de intro-choreografie */
  });
}
/* ---- de sprong van de paginascrollbar wegnemen ----------------------------
   Elke stap is een andere hoogte. Wordt de pagina daardoor korter dan het venster, dan verdwijnt de
   scrollbar, wordt het venster een pixel of vijftien breder, en schaalt de kaart mee -- precies
   terwijl er een animatie loopt. Dat is het schokje. scrollbar-gutter:stable houdt die strook altijd
   vrij, ook als er niets te scrollen valt, zodat de breedte nooit verspringt. Kan de browser dat niet,
   dan vragen we in de plaats een altijd zichtbare scrollbar: ook dan blijft de breedte gelijk.
   Dit is het enige dat de calculator buiten #sc-calc aanraakt. Zet SC_GUTTER op false om het te laten. */
var SC_GUTTER = true;
function scGutter(){
  if(!SC_GUTTER) return;
  var d = document.documentElement;
  if(!d) return;
  if(window.CSS && CSS.supports && CSS.supports('scrollbar-gutter','stable')) d.style.scrollbarGutter = 'stable';
  else if(!d.style.overflowY) d.style.overflowY = 'scroll';
}
/* Selectie zichtbaar maken op alle kopieën tegelijk: de ballonnetjes op het podium, de gestapelde
   lijst voor smalle schermen en de antwoordrij staan in verschillende containers. `groep` is nodig
   sinds alle ballonnetjes samen op het podium leven: zonder die grens zou het aanduiden van een
   antwoord de herinnerde uitdagingen bovenaan ontvinken (en omgekeerd). */
function syncSel(vals, enableNext, groep){
  var card = $('sc-card');
  if(!card) return;
  Array.prototype.forEach.call(card.querySelectorAll('[data-v]'), function(el){
    if(!el.classList.contains('sc-orbit-tile') && !el.classList.contains('sc-opt') &&
       !el.classList.contains('sc-tile') && !el.classList.contains('sc-geen-btn')) return;
    var g = el.getAttribute('data-g');
    if(groep && g && g !== groep) return;
    var sel = vals.indexOf(el.getAttribute('data-v')) > -1;
    el.classList.toggle('is-sel', sel);
    el.setAttribute('aria-pressed', sel ? 'true' : 'false');
  });
  var nextBtn = $('sc-next');
  if(nextBtn) nextBtn.disabled = !enableNext;
}
function mobBldg(pop){
  var el = document.querySelector('#sc-body .sc-mob-bldg');
  if(!el) return;
  el.innerHTML = stripPins(bouwIll(S.bldgLevel, S.commercieel));
  if(pop) bldgAnim(el, 'sc-pop');
}
function bind(){
  stageResizeBind();
  var range = $('sc-range');
  if(range) range.addEventListener('input', function(){
    S.kavels = parseInt(range.value,10);
    $('sc-kv').textContent = S.kavels;
    $('sc-kv-u').textContent = S.kavels >= 60 ? 'kavels of meer' : 'kavels';
    var nieuwNiveau = bouwNiveau(S.kavels);
    if(nieuwNiveau !== S.bldgLevel){
      var vorigNiveau = S.bldgLevel;
      S.bldgLevel = nieuwNiveau;
      bldgNiveauWissel(vorigNiveau, nieuwNiveau);
    }
  });

  var commercieel = $('sc-commercieel');
  if(commercieel) commercieel.addEventListener('click', function(){
    S.commercieel = !S.commercieel;
    commercieel.classList.toggle('is-on', S.commercieel);
    commercieel.setAttribute('aria-pressed', S.commercieel ? 'true' : 'false');
    bldgCommWissel();
  });

  /* De klikafhandeling hangt aan de kaart, niet aan de stap-body: de ballonnetjes van het diagram
     staan immers op het podium, buiten die body. Eenmalig, dus geen dubbele listeners bij re-render. */
  var card = $('sc-card');
  if(card && !card._scClick){
    card._scClick = true;
    card.addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('.sc-opt, .sc-tile, .sc-orbit-tile, .sc-geen-btn') : null;
      if(!b) return;
      var v = b.getAttribute('data-v');
      if(v == null) return;
      /* een ballonnetje uit een ander vak (een herinnerde uitdaging, een eerder antwoord) is hier
         enkel nog een herinnering: aanwijzen mag, aanklikken doet niets */
      var g = b.getAttribute('data-g');
      var hoort = antwGroep(S.step);
      if(g && g !== (S.step === STAP.DIAGRAM ? 'nood' : (hoort ? hoort.g : g))) return;
      if(S.step === STAP.DIAGRAM){
        var opt = BEHOEFTEN_OPTS.filter(function(o){ return o.v === v; })[0];
        if(!opt) return;
        if(opt.exclusive){
          S.complex = (S.complex.length === 1 && S.complex[0] === v) ? [] : [v];
        } else {
          S.complex = S.complex.filter(function(x){
            return !BEHOEFTEN_OPTS.filter(function(o){ return o.v === x; })[0].exclusive; });
          var i = S.complex.indexOf(v);
          if(i > -1) S.complex.splice(i,1); else S.complex.push(v);
        }
        syncSel(S.complex, S.complex.length > 0, 'nood');
        return;   /* geen re-render: dat zou het element onder de muis vernietigen en de hover-animatie afbreken */
      }
      if(S.step === STAP.BEHEER){ S.beheerNu   = v; syncSel([v], true, 'nu');   return; }
      if(S.step === STAP.WENS)  { S.beheerWens = v; syncSel([v], true, 'wens'); return; }
      if(S.step === STAP.ALT)   { S.formule  = v; S.override = true; render(); }
    });
  }

  var back = $('sc-back');
  if(back && !back._scBound){
    back._scBound = true;   /* de blijvende balk overleeft elke render: niet elke keer opnieuw koppelen */
    back.addEventListener('click', function(){ go(S.step === STAP.ALT ? STAP.RESULTAAT : Math.max(0, S.step-1)); });
  }
  var alt = $('sc-alt');
  if(alt) alt.addEventListener('click', function(){ go(STAP.ALT); });
  var skip = $('sc-skip');
  if(skip) skip.addEventListener('click', function(){ go(STAP.KLAAR); });

  var next = $('sc-next');
  if(next && !next._scBound){
    next._scBound = true;
    next.addEventListener('click', function(){
      if(S.step === STAP.RESULTAAT) return submitLead(next, 'offerte');
      if(S.step === STAP.EXTRA)     return submitExtra(next);
      if(S.step === STAP.ALT)       return go(STAP.RESULTAAT);
      go(S.step + 1);
    });
  }
  /* de tweede CTA op de resultaatstap: voorlopig hetzelfde formulier, enkel met een ander intent-
     vlaggetje (calc_gewenst_actie) -- klaar om later aan een echte scheduler te koppelen. */
  var gesprek = $('sc-gesprek');
  if(gesprek && !gesprek._scBound){
    gesprek._scBound = true;
    gesprek.addEventListener('click', function(){ submitLead(gesprek, 'gesprek'); });
  }
  var contactRadios = document.querySelectorAll('#sc-body input[name="sc-contact"]');
  contactRadios.forEach(function(r){ r.addEventListener('change', function(){ S.contact = r.value; }); });
}

/* ==========================================================================
   8. PAYLOAD EN VERZENDEN
   ========================================================================== */
function payload(fase){
  var p = S.prijs || {}, c = complexNiveau(), uu = p.uren || {}, sc = formuleScore();
  function lbl(arr, v){ var m = arr.filter(function(o){ return o.v === v; })[0]; return m ? m.t : ''; }
  return {
    form_id: CFG.FORMINATOR_FORM_ID,
    form_title: 'Syndicoach formule-finder',
    calc_fase: fase,
    calc_versie: CFG.VERSION,
    calc_source_url: (location && location.href) || '',
    calc_duur_sec: String(Math.round((Date.now() - S.t0)/1000)),

    calc_email: S.email, calc_naam: S.naam, calc_telefoon: S.tel,
    calc_consent: S.consent ? 'ja' : 'nee',
    calc_contactvoorkeur: S.contact || '',
    calc_gewenst_actie: S.ctaActie || '',

    calc_kavels: String(S.kavels),
    calc_commercieel: S.commercieel ? 'ja' : 'nee',
    calc_beheer_nu: S.beheerNu || '',
    calc_beheer_nu_label: lbl(BEHEER_NU_OPTS, S.beheerNu),
    calc_beheer_wens: S.beheerWens || '',
    calc_beheer_wens_label: lbl(BEHEER_WENS_OPTS, S.beheerWens),
    calc_complexiteit_items: S.complex.join(', '),
    calc_complexiteit_score: String(c.score),
    calc_complexiteit_niveau: c.niveau,

    calc_formule: S.formule || '',
    calc_formule_label: S.formule ? FORMULES[S.formule].naam : '',
    calc_formule_advies: kiesFormule(),
    calc_formule_gewijzigd: S.override ? 'ja' : 'nee',
    /* de opbouw van de score gaat mee: op echte inzendingen zie je zo hoe de verdeling loopt en of
       de drempels in FORMULE_WEGING nog kloppen */
    calc_score_totaal: String(sc.totaal),
    calc_score_kavels: String(sc.kavels),
    calc_score_uitdagingen: String(sc.uitdagingen),
    calc_score_commercieel: String(sc.commercieel),
    calc_score_beheer_nu: String(sc.beheerNu),
    calc_score_beheer_wens: String(sc.beheerWens),

    calc_licentie_tier: p.licentie_tier || '',
    calc_tool_pm: p.tool_pm ? num(p.tool_pm) : '',
    calc_uren_opstart: uu.opstart ? num(uu.opstart) : '',
    calc_uren_beheer_pm: uu.beheer_pm ? num(uu.beheer_pm) : '',
    calc_uren_av: uu.av ? num(uu.av) : '',
    calc_uren_coaching_pj: uu.coaching_pj ? num(uu.coaching_pj) : '',
    calc_beheer_pj_excl: p.beheer_pj_excl ? String(Math.round(p.beheer_pj_excl)) : '',
    calc_opstart_excl: p.opstart_excl ? String(Math.round(p.opstart_excl)) : '',
    calc_jaar1: p.jaar1 ? String(Math.round(p.jaar1)) : '',
    calc_jaar2: p.jaar2 ? String(Math.round(p.jaar2)) : '',
    calc_prijs_kavel_pm: p.pkpm ? num(p.pkpm) : '',

    calc_vme_naam: S.extra.vme || '', calc_adres: S.extra.adres || '',
    calc_postcode: S.extra.postcode || '', calc_bouwjaar: S.extra.bouwjaar || '',
    calc_rol: S.extra.rol || '', calc_huidige_syndicus: S.extra.syndicus || '',
    calc_overstap_termijn: S.extra.start || '', calc_opmerking: S.extra.vraag || ''
  };
}

/* Buffer: mislukt verzenden, dan bewaren en opnieuw proberen bij de volgende
   paginaweergave. Zo verlies je geen leads aan een netwerkhik. */
var BUF = 'sc_calc_queue_v1';
function queue(d){ try{ var qq = JSON.parse(localStorage.getItem(BUF)||'[]');
  qq.push({t:Date.now(), d:d}); localStorage.setItem(BUF, JSON.stringify(qq.slice(-10))); }catch(e){} }
function flushQueue(){
  var qq; try{ qq = JSON.parse(localStorage.getItem(BUF)||'[]'); }catch(e){ return; }
  if(!qq.length) return;
  localStorage.removeItem(BUF);
  qq.forEach(function(it){ postWorker(it.d).catch(function(){ queue(it.d); }); });
}

function postWorker(d){
  if(!CFG.WORKER_URL || CFG.WORKER_URL.indexOf('JOUW-WORKER-HOST') > -1){
    console.warn('[sc-calc] WORKER_URL niet ingevuld. Payload:', d);
    return Promise.resolve({skipped:true});
  }
  var url = CFG.WORKER_URL + (CFG.WORKER_TOKEN
    ? (CFG.WORKER_URL.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(CFG.WORKER_TOKEN) : '');
  return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true,
    body: JSON.stringify({ form_id:d.form_id, form_title:d.form_title, form_fields:d })
  }).then(function(r){ if(!r.ok) throw new Error('worker '+r.status); return r.json().catch(function(){ return {}; }); });
}

function postForminator(d){
  var form = document.querySelector('form[data-sc-forminator]') ||
             document.querySelector('#forminator-module-'+CFG.FORMINATOR_FORM_ID+' form') ||
             document.querySelector('.forminator-custom-form');
  if(!form){ console.warn('[sc-calc] geen Forminator-formulier gevonden'); return Promise.resolve({skipped:true}); }
  Object.keys(d).forEach(function(k){
    var el = form.querySelector('[data-sc="'+k+'"]') || form.querySelector('[name="'+k+'"]');
    if(el){ el.value = d[k];
      try{ el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
    } else { console.info('[sc-calc] Forminator-veld ontbreekt:', k); }
  });
  var btn = form.querySelector('button[type=submit], .forminator-button-submit');
  if(btn) btn.click(); else if(form.requestSubmit) form.requestSubmit(); else form.submit();
  return Promise.resolve({submitted:true});
}

function send(d){
  var jobs = [];
  if(CFG.SUBMIT_MODE === 'worker' || CFG.SUBMIT_MODE === 'both') jobs.push(postWorker(d));
  if(CFG.SUBMIT_MODE === 'forminator' || CFG.SUBMIT_MODE === 'both') jobs.push(postForminator(d));
  if(!jobs.length) return Promise.resolve();
  return Promise.allSettled(jobs).then(function(res){
    if(!res.some(function(r){ return r.status === 'fulfilled'; })){ queue(d); throw new Error('mislukt'); }
    return true;
  });
}

function busy(btn, on, label){
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="sc-spin" aria-hidden="true"></span> Versturen' : label;
}

function submitLead(btn, actie){
  S.naam    = ($('sc-naam')||{}).value || '';
  S.email   = (($('sc-email')||{}).value || '').trim();
  S.tel     = ($('sc-tel')||{}).value || '';
  S.extra.postcode = ($('sc-postcode')||{}).value || S.extra.postcode || '';
  var gekozenContact = document.querySelector('input[name="sc-contact"]:checked');
  S.contact = gekozenContact ? gekozenContact.value : S.contact;
  S.consent = !!($('sc-consent')||{}).checked;
  S.ctaActie = actie || 'offerte';
  var err = $('sc-err');
  if(!validEmail(S.email)){ err.textContent = 'Vul een geldig e-mailadres in -- ook als je liever gebeld wordt, hebben we dit nodig om je dossier terug te vinden.'; err.classList.add('is-on'); if($('sc-email')) $('sc-email').focus(); return; }
  if(!S.consent){ err.textContent = 'We hebben je akkoord nodig om contact met je op te nemen.'; err.classList.add('is-on'); return; }
  err.classList.remove('is-on');
  var terug = btn.innerHTML;   /* werkt voor beide CTA-knoppen, elk met hun eigen label/icoon */
  busy(btn, true);
  send(payload('lead')).then(function(){ go(7); }).catch(function(){
    busy(btn, false, terug);
    err.textContent = 'Versturen lukte niet meteen. We bewaren je aanvraag en proberen opnieuw, of mail ons op info@syndicoach.be.';
    err.classList.add('is-on');
  });
}

function submitExtra(btn){
  S.extra = { vme:($('e-vme')||{}).value||'', adres:($('e-adres')||{}).value||'',
    postcode:($('e-post')||{}).value||'', bouwjaar:($('e-bouw')||{}).value||'',
    rol:($('e-rol')||{}).value||'', syndicus:($('e-syndicus')||{}).value||'',
    start:($('e-start')||{}).value||'', vraag:($('e-vraag')||{}).value||'' };
  busy(btn, true);
  send(payload('aanvulling')).then(function(){ go(8); klaarRedirect(); }).catch(function(){ go(8); });
}
function klaarRedirect(){ if(CFG.REDIRECT_URL) setTimeout(function(){ location.href = CFG.REDIRECT_URL; }, 2500); }

/* ==========================================================================
   9. START
   ========================================================================== */
render();
flushQueue();
window.SC = { state:S, cfg:CFG, bereken:bereken, kiesFormule:kiesFormule, payload:payload, go:go, u1:u1 };
})();
</script>
