<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboards - OpenVME Operations Manager</title>
  <script>
    (function () {
      var t = localStorage.getItem('selectedTheme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/shared-navbar.js"></script>
</head>
<body class="bg-base-200">
  <div id="navbar"></div>

  <div style="padding-top: 48px;">
    <main class="max-w-7xl mx-auto p-4 md:p-6">

      <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold">Instroom</h1>
          <p class="text-sm text-base-content/60 mt-1">Aanvragen die als lead in Odoo binnenkomen, per merk-oorsprong.</p>
        </div>
        <div class="join">
          <button class="btn btn-sm join-item" data-action="setPeriod" data-period="30d">Laatste 30 dagen</button>
          <button class="btn btn-sm join-item" data-action="setPeriod" data-period="6m">Laatste 6 maanden</button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <div class="stats border border-base-300 bg-base-100 shadow-sm">
          <div class="stat py-4">
            <div class="stat-title text-xs" id="statCurrentLabel">Totaal aanvragen</div>
            <div class="stat-value text-2xl" id="statCurrentValue"><div class="skeleton h-8 w-16 rounded"></div></div>
            <div class="stat-desc" id="statCurrentDelta">&nbsp;</div>
            <div class="stat-desc flex flex-wrap gap-1 mt-2" id="statCurrentBrands"></div>
          </div>
        </div>

        <div class="stats border border-base-300 bg-base-100 shadow-sm">
          <div class="stat py-4">
            <div class="stat-title text-xs">Totaal vorige periode</div>
            <div class="stat-value text-2xl" id="statPreviousValue"><div class="skeleton h-8 w-16 rounded"></div></div>
            <div class="stat-desc" id="statPreviousDesc">&nbsp;</div>
          </div>
        </div>

        <div class="stats border border-base-300 bg-base-100 shadow-sm">
          <div class="stat py-4">
            <div class="stat-title text-xs">Totaal aanvragen sinds de start</div>
            <div class="stat-value text-2xl" id="statAllTimeValue"><div class="skeleton h-8 w-16 rounded"></div></div>
            <div class="stat-desc">Vast, ongeacht periode</div>
          </div>
        </div>

        <div class="stats border border-base-300 bg-base-100 shadow-sm">
          <div class="stat py-4">
            <div class="stat-title text-xs">Won-ratio (aangemaakt in periode)</div>
            <div class="stat-value text-2xl" id="statWonRatioValue"><div class="skeleton h-8 w-16 rounded"></div></div>
            <div class="stat-desc" id="statWonRatioDesc">&nbsp;</div>
          </div>
        </div>
      </div>

      <div class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body">
          <h2 class="text-base font-semibold mb-2">Aanvragen per dag</h2>
          <div style="height: 320px;">
            <canvas id="dailyChart"></canvas>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/dashboards.js"></script>
</body>
</html>
