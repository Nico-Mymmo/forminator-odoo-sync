<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecten - Operations Manager</title>
  <script>
    (function () {
      var t = localStorage.getItem('selectedTheme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <link href="/om-kalender.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="/shared-navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    /* Dezelfde opbouw als de homepage (kolom links) en Events (werkblad + detailkaart rechts). */
    .pm-nav { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem; border-radius: .5rem; font-size: .875rem; cursor: pointer; }
    .pm-nav:hover { background: oklch(var(--bc) / 0.06); }
    .pm-nav-actief { background: oklch(var(--p) / 0.12); color: oklch(var(--p)); font-weight: 600; }
    .pm-lijnen > * + * { border-top: 1px solid oklch(var(--bc) / 0.1); }

    /* De lijst: een gewone tabel (table table-sm), met per sectie een groepsrij. */
    .pm-tabel tr[data-drag-task] { cursor: pointer; }
    .pm-tabel tr[data-drag-task]:hover { background: oklch(var(--bc) / 0.03); }
    .pm-tabel tr.pm-gekozen { background: oklch(var(--p) / 0.08); }
    .pm-tabel tr.pm-sleept { opacity: .4; }
    .pm-tabel .pm-af .pm-titel { text-decoration: line-through; opacity: .5; }
    .pm-tabel th.pm-groep { background: oklch(var(--b2)); font-weight: 600; text-transform: none; font-size: .8rem; color: oklch(var(--bc)); }
    .pm-tabel td { vertical-align: middle; }
    /* table-fixed: anders bepaalt de langste titel de kolombreedte en loopt de
       tabel uit de kaart (zelfde les als de indieningentabel van Koppelingen). */
    .pm-tabel { table-layout: fixed; width: 100%; }
    .pm-tabel td, .pm-tabel th { overflow: hidden; }
    .pm-sectie-dicht tr:not(.pm-groeprij) { display: none; }
    .pm-sectie-dicht .pm-klap { transform: rotate(-90deg); }
    .pm-klap { transition: transform .15s; }
    .pm-vink { width: 1.15rem; height: 1.15rem; border-radius: 999px; border: 1.5px solid oklch(var(--bc) / 0.35); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
    .pm-vink:hover { border-color: oklch(var(--su)); color: oklch(var(--su)); }
    .pm-vink-af { background: oklch(var(--su)); border-color: oklch(var(--su)); color: oklch(var(--suc)); }
    .pm-plus input { background: transparent; border: 0; outline: 0; width: 100%; font-size: .85rem; }
    .pm-plus { color: oklch(var(--bc) / 0.5); }
    .pm-plus:focus-within { color: oklch(var(--bc)); }

    /* Kanban: kolommen naast elkaar, kaarten zoals de kaarten elders in de OM. */
    .pm-kanban { display: flex; gap: 1rem; align-items: flex-start; overflow-x: auto; padding-bottom: .5rem; }
    .pm-kolom { flex: 0 0 17rem; display: flex; flex-direction: column; background: oklch(var(--b2)); border-radius: var(--rounded-box, 1rem); }
    .pm-kolom-inhoud { display: flex; flex-direction: column; gap: .5rem; padding: .25rem .6rem; min-height: 3rem; }
    .pm-kaart { background: oklch(var(--b1)); border: 1px solid oklch(var(--bc) / 0.1); border-radius: var(--rounded-btn, .5rem); padding: .65rem .75rem; cursor: pointer; box-shadow: 0 1px 2px oklch(var(--bc) / 0.06); }
    .pm-kaart:hover { border-color: oklch(var(--bc) / 0.25); }
    .pm-kaart.pm-gekozen { border-color: oklch(var(--p)); box-shadow: 0 0 0 1px oklch(var(--p)); }
    .pm-kaart.pm-af { opacity: .55; }
    .pm-kaart.pm-af .pm-kaart-titel { text-decoration: line-through; }
    .pm-kaart.pm-sleept { opacity: .4; }
    /* De twee eindfases: helemaal rechts, onder elkaar, standaard ingeklapt. */
    .pm-eindstapel { flex: 0 0 17rem; display: flex; flex-direction: column; gap: .75rem; margin-left: auto; }
    .pm-eindkolom { background: oklch(var(--bc) / 0.04); border: 1px dashed oklch(var(--bc) / 0.2); }
    .pm-eindkolom.pm-sectie-dicht .pm-sectie-inhoud { display: none; }
    .fc-event.pm-kal-mijlpaal { background-color: transparent !important; border: 2px solid var(--event-bg) !important; color: oklch(var(--bc)) !important; box-shadow: none; }

    /* Kalender: de kaart per taak, zelfde opbouw als bij Nieuwsbrieven. */
    .pm-kal-kaart { display: flex; flex-direction: column; gap: .1rem; line-height: 1.25; min-width: 0; }
    .pm-kal-kop { display: flex; align-items: center; gap: .3rem; font-size: .625rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; min-width: 0; }
    .pm-kal-kop span, .pm-kal-titel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-kal-titel { font-size: .8125rem; }
    .fc-event.pm-kal-af { background-color: transparent !important; border: 2px dashed var(--event-bg) !important; color: oklch(var(--bc) / .7) !important; box-shadow: none; }
    .fc-event.pm-kal-af .pm-kal-titel { text-decoration: line-through; }
    .fc .fc-day-clickable { cursor: pointer; }
    .fc .fc-daygrid-day.fc-day-clickable:hover { background-color: oklch(var(--p) / 0.06); }

    /* Detail van een taak */
    .pm-veld { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .5rem; align-items: start; }
    .pm-titelveld { width: 100%; resize: none; overflow: hidden; background: transparent; font-size: 1.15rem; font-weight: 600; line-height: 1.3; border-radius: .4rem; padding: .15rem .3rem; margin-left: -.3rem; }
    .pm-titelveld:hover, .pm-titelveld:focus { background: oklch(var(--bc) / 0.05); outline: none; }
    /* De beschrijving: de tekstbewerker van Koppelingen (quill-editor-component.js), zonder eigen scrollbalk. */
    .pm-beschrijving .ql-editor { min-height: 6rem; font-size: .875rem; line-height: 1.55; padding: .75rem .9rem; }
    .pm-beschrijving .ql-editor img { max-width: 100%; border-radius: .4rem; margin: .25rem 0; }
    .pm-beschrijving .ql-editor a { color: oklch(var(--p)); text-decoration: underline; }
    .pm-beschrijving .ql-editor.ql-blank::before { font-style: normal; color: oklch(var(--bc) / 0.4); }
  </style>
</head>
<body class="bg-base-200 min-h-screen">

  <div id="navbar"></div>

  <main class="mx-auto px-4 sm:px-6 pb-10 max-w-[1800px]" style="padding-top: calc(48px + 1.5rem);">

    <!-- Kop, zoals bij Events -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div class="min-w-0">
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i data-lucide="folder-kanban" class="w-6 h-6 text-primary"></i>
          Projecten
        </h1>
        <p class="text-sm opacity-60 mt-0.5">Interne projecten en to-do's, voor het hele team.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" class="btn btn-sm btn-primary gap-1" data-action="nieuw-project">
          <i data-lucide="plus" class="w-4 h-4"></i> Nieuw project
        </button>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <!-- Links: Mijn taken + de projecten, zoals de departementen op de homepage -->
      <aside class="w-full lg:w-60 shrink-0 lg:sticky lg:top-[calc(48px+1.5rem)]">
        <div class="card bg-base-100 border border-base-content/10 shadow-sm">
          <nav id="pmZijbalk" class="card-body p-2 gap-0.5"></nav>
        </div>
      </aside>

      <!-- Rechts: het werkblad, en het detail van een taak als kaart ernaast (zoals bij Events) -->
      <section class="flex-1 min-w-0 w-full">
        <div id="pmKop" class="mb-4"></div>
        <div class="grid grid-cols-12 gap-6 items-start">
          <div id="pmHoofdKolom" class="col-span-12">
            <div id="pmHoofd"><div class="flex justify-center py-10"><span class="loading loading-spinner"></span></div></div>
          </div>
          <div id="pmTaakKolom" class="col-span-12 xl:col-span-5 hidden">
            <div id="pmTaakWrap" class="card bg-base-100 border border-base-content/10 shadow-sm">
              <div id="pmTaak"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <datalist id="pmLabelLijst"></datalist>

  <dialog id="pmVraag" class="modal">
    <form method="dialog" class="modal-box max-w-md">
      <h3 class="font-bold text-lg mb-3" id="pmVraagTitel"></h3>
      <input id="pmVraagVeld" type="text" class="input input-bordered w-full" maxlength="300" autocomplete="off">
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" value="annuleer">Annuleren</button>
        <button class="btn btn-primary btn-sm" value="ok">OK</button>
      </div>
    </form>
    <form method="dialog" class="modal-backdrop"><button value="annuleer">sluiten</button></form>
  </dialog>

  <dialog id="pmBevestig" class="modal">
    <form method="dialog" class="modal-box max-w-md">
      <p id="pmBevestigTekst" class="text-sm"></p>
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" value="annuleer">Annuleren</button>
        <button class="btn btn-error btn-sm" value="ok" id="pmBevestigKnop">OK</button>
      </div>
    </form>
    <form method="dialog" class="modal-backdrop"><button value="annuleer">sluiten</button></form>
  </dialog>

  <dialog id="pmProject" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-4" id="pmProjectTitel">Nieuw project</h3>
      <label class="form-control mb-3">
        <span class="label-text text-sm mb-1">Naam</span>
        <input id="pmProjectNaam" type="text" class="input input-bordered input-sm" maxlength="120" placeholder="bv. Nieuwe website OpenACP" autocomplete="off">
      </label>
      <div id="pmProjectOmschrijvingWrap">
        <label class="form-control mb-3">
          <span class="label-text text-sm mb-1">Waarover gaat het? <span class="opacity-50">(mag leeg)</span></span>
          <textarea id="pmProjectOmschrijving" class="textarea textarea-bordered textarea-sm" rows="3"></textarea>
        </label>
      </div>
      <div class="mb-3"><span class="label-text text-sm">Kleur</span><div id="pmProjectKleuren" class="flex flex-wrap gap-2 mt-1"></div></div>
      <div class="mb-2"><span class="label-text text-sm">Icoon</span><div id="pmProjectIconen" class="flex flex-wrap gap-1 mt-1"></div></div>
      <div id="pmProjectBeheer" class="hidden border-t border-base-content/10 pt-3 mt-3 flex flex-wrap gap-2">
        <button type="button" class="btn btn-ghost btn-sm" data-action="project-archief" id="pmProjectArchief">Archiveren</button>
        <button type="button" class="btn btn-ghost btn-sm text-error" data-action="project-weg" id="pmProjectWeg">Verwijderen</button>
      </div>
      <div class="modal-action">
        <form method="dialog"><button class="btn btn-ghost btn-sm">Annuleren</button></form>
        <button type="button" class="btn btn-primary btn-sm" data-action="project-bewaar">Bewaren</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <dialog id="pmOdoo" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-3">Koppelen aan Odoo</h3>
      <div class="flex gap-2 mb-3">
        <select id="pmOdooModel" class="select select-bordered select-sm" data-change="odoo-model"></select>
        <input id="pmOdooZoek" type="search" class="input input-bordered input-sm flex-1" placeholder="Naam, bedrijf of e-mail…" data-input="odoo-zoek" autocomplete="off">
      </div>
      <div id="pmOdooResultaten" class="max-h-80 overflow-y-auto"></div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost btn-sm">Sluiten</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <dialog id="pmAssets" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-3">Kies een bestand uit Assetbeheer</h3>
      <div id="pmAssetsInhoud" class="max-h-96 overflow-y-auto"></div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost btn-sm">Sluiten</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <div id="pmToast" class="toast toast-end z-[100]"></div>

  <script src="/quill-editor-component.js"></script>
  <script src="/projecten-core.js"></script>
  <script src="/projecten-views.js"></script>
  <script src="/projecten-feest.js"></script>
  <script src="/projecten-taak.js"></script>
  <script src="/projecten-bootstrap.js"></script>
</body>
</html>
