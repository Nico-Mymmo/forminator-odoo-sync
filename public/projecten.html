<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecten - Operations Manager</title>
  <script>
    (function () {
      var t = localStorage.getItem('selectedTheme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <link href="/om-kalender.css" rel="stylesheet" />
  <script src="/shared-navbar.js"></script>
  <style>
    /* Paginabreed, zoals Asana: zijbalk links, werkvlak in het midden, het
       detail van een taak rechts. Elk vak scrolt apart; de pagina zelf niet. */
    html, body { height: 100%; }
    body { overflow: hidden; }
    #pmApp { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; display: flex; }
    #pmZijbalkWrap { width: 15.5rem; flex: none; display: flex; flex-direction: column; background: oklch(var(--b1)); border-right: 1px solid oklch(var(--bc) / 0.1); overflow-y: auto; }
    #pmHoofdWrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    #pmHoofd { flex: 1 1 auto; min-height: 0; overflow: auto; }
    #pmTaakWrap { width: 34rem; flex: none; display: flex; flex-direction: column; background: oklch(var(--b1)); border-left: 1px solid oklch(var(--bc) / 0.1); }
    #pmTaakWrap.hidden { display: none; }
    #pmTaak { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #pmTaakAchter { display: none; }
    @media (max-width: 1279px) {
      #pmTaakWrap { position: fixed; top: 48px; right: 0; bottom: 0; width: min(34rem, 100vw); z-index: 50; box-shadow: -8px 0 24px oklch(var(--bc) / 0.15); }
      #pmTaakAchter { display: block; position: fixed; inset: 48px 0 0 0; z-index: 40; background: oklch(var(--bc) / 0.2); }
      #pmTaakWrap.hidden + #pmTaakAchter { display: none; }
    }
    @media (max-width: 1023px) {
      #pmZijbalkWrap { position: fixed; top: 48px; left: 0; bottom: 0; z-index: 45; transform: translateX(-100%); transition: transform .15s ease; box-shadow: 8px 0 24px oklch(var(--bc) / 0.15); }
      #pmZijbalkWrap.pm-open { transform: none; }
    }

    .pm-nav { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem; border-radius: .5rem; font-size: .875rem; cursor: pointer; }
    .pm-nav:hover { background: oklch(var(--bc) / 0.06); }
    .pm-nav-actief { background: oklch(var(--p) / 0.12); color: oklch(var(--p)); font-weight: 600; }

    /* De lijst: vaste kolommen zoals een tabel, maar elke rij blijft een flexrij
       zodat verslepen werkt. Kolombreedtes staan EEN keer, hier. */
    .pm-lijst { --pm-kol: 11rem 7rem 6.5rem; }
    .pm-lijst.pm-met-project { --pm-kol: 11rem 11rem 7rem 6.5rem; }
    .pm-rij, .pm-koprij { display: grid; grid-template-columns: minmax(0, 1fr) var(--pm-kol); align-items: center; column-gap: .75rem; padding: 0 1rem 0 .75rem; }
    .pm-koprij { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: oklch(var(--bc) / 0.55); height: 2.25rem; border-bottom: 1px solid oklch(var(--bc) / 0.1); position: sticky; top: 0; background: oklch(var(--b1)); z-index: 5; }
    .pm-rij { min-height: 2.5rem; border-bottom: 1px solid oklch(var(--bc) / 0.08); }
    .pm-rij:hover { background: oklch(var(--bc) / 0.03); }
    .pm-rij.pm-gekozen { background: oklch(var(--p) / 0.08); }
    .pm-cel { min-width: 0; font-size: .85rem; }
    .pm-cel-naam { display: flex; align-items: center; gap: .5rem; min-width: 0; }
    .pm-af .pm-titel { text-decoration: line-through; opacity: .5; }
    .pm-sleept { opacity: .4; }
    .pm-vink { width: 1.15rem; height: 1.15rem; border-radius: 999px; border: 1.5px solid oklch(var(--bc) / 0.35); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
    .pm-vink:hover { border-color: oklch(var(--su)); color: oklch(var(--su)); }
    .pm-vink-af { background: oklch(var(--su)); border-color: oklch(var(--su)); color: oklch(var(--suc)); }
    .pm-sectiekop { display: flex; align-items: center; gap: .4rem; padding: .6rem .75rem .3rem; }
    .pm-sectiekop .pm-klap { transition: transform .15s; }
    .pm-sectie-dicht .pm-klap { transform: rotate(-90deg); }
    .pm-sectie-dicht .pm-sectie-inhoud { display: none; }
    .pm-lijnen[data-drop-section]:empty { min-height: 2.5rem; }
    .pm-plusrij { display: flex; align-items: center; gap: .5rem; padding: 0 1rem 0 .75rem; min-height: 2.25rem; color: oklch(var(--bc) / 0.5); font-size: .85rem; }
    .pm-plusrij input { background: transparent; border: 0; outline: 0; flex: 1; min-width: 0; font-size: .85rem; color: oklch(var(--bc)); }
    .pm-plusrij:focus-within { color: oklch(var(--bc)); background: oklch(var(--bc) / 0.03); }
    @media (max-width: 767px) {
      .pm-rij, .pm-koprij { grid-template-columns: minmax(0, 1fr) auto auto; }
      .pm-cel-persoon-naam, .pm-cel-prio, .pm-cel-project, .pm-koprij .pm-cel-persoon, .pm-koprij .pm-cel-datum { display: none; }
    }

    /* Kanban */
    .pm-kanban { display: flex; gap: 1rem; align-items: flex-start; height: 100%; padding: 1rem 1.25rem 1.25rem; overflow-x: auto; }
    .pm-kolom { flex: 0 0 18rem; max-height: 100%; display: flex; flex-direction: column; background: oklch(var(--bc) / 0.04); border-radius: .75rem; }
    .pm-kolom-kop { display: flex; align-items: center; gap: .4rem; padding: .7rem .8rem .4rem; }
    .pm-kolom-inhoud { display: flex; flex-direction: column; gap: .5rem; padding: .25rem .6rem; min-height: 3rem; overflow-y: auto; }
    .pm-kaart { background: oklch(var(--b1)); border: 1px solid oklch(var(--bc) / 0.1); border-radius: .6rem; padding: .65rem .75rem; cursor: grab; box-shadow: 0 1px 2px oklch(var(--bc) / 0.06); }
    .pm-kaart:hover { border-color: oklch(var(--bc) / 0.25); box-shadow: 0 2px 6px oklch(var(--bc) / 0.1); }
    .pm-kaart.pm-gekozen { border-color: oklch(var(--p)); box-shadow: 0 0 0 1px oklch(var(--p)); }
    .pm-kaart.pm-af { opacity: .55; }
    .pm-kaart-titel { font-size: .875rem; line-height: 1.3; }
    .pm-af .pm-kaart-titel { text-decoration: line-through; }
    .pm-kolom-voet { padding: .3rem .6rem .6rem; }
    .pm-kolom-voet .pm-plusrij { border-radius: .5rem; padding: 0 .5rem; }

    /* Kalender: de kaart per taak, zelfde opbouw als bij Nieuwsbrieven. */
    .pm-kal-kaart { display: flex; flex-direction: column; gap: .1rem; line-height: 1.25; min-width: 0; }
    .pm-kal-kop { display: flex; align-items: center; gap: .3rem; font-size: .625rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; min-width: 0; }
    .pm-kal-kop span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-kal-titel { font-size: .8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fc-event.pm-kal-af { background-color: transparent !important; border: 2px dashed var(--event-bg) !important; color: oklch(var(--bc) / .7) !important; box-shadow: none; }
    .fc-event.pm-kal-af .pm-kal-titel { text-decoration: line-through; }
    .fc .fc-day-clickable { cursor: pointer; }
    .fc .fc-daygrid-day.fc-day-clickable:hover { background-color: oklch(var(--p) / 0.06); }

    /* Detail van een taak */
    .pm-veld { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .5rem; align-items: start; }
    .pm-titelveld { width: 100%; resize: none; overflow: hidden; background: transparent; font-size: 1.3rem; font-weight: 700; line-height: 1.3; border-radius: .4rem; padding: .15rem .3rem; margin-left: -.3rem; }
    .pm-titelveld:hover, .pm-titelveld:focus { background: oklch(var(--bc) / 0.05); outline: none; }
  </style>
</head>
<body class="bg-base-200">

  <div id="navbar"></div>

  <div id="pmApp">
    <aside id="pmZijbalkWrap">
      <nav id="pmZijbalk" class="p-2 flex flex-col gap-0.5"></nav>
    </aside>

    <div id="pmHoofdWrap">
      <header id="pmKop" class="flex-none bg-base-100 border-b border-base-content/10 px-4 lg:px-6"></header>
      <section id="pmHoofd">
        <div class="py-16 text-center opacity-60">Laden…</div>
      </section>
    </div>

    <aside id="pmTaakWrap" class="hidden"><div id="pmTaak"></div></aside>
    <div id="pmTaakAchter" data-action="sluit-taak"></div>
  </div>
  <div id="pmZijbalkAchter" class="hidden fixed inset-0 top-12 z-40 bg-black/20 lg:hidden" data-action="sluit-zijbalk"></div>
  <datalist id="pmLabelLijst"></datalist>

  <dialog id="pmVraag" class="modal">
    <form method="dialog" class="modal-box max-w-md">
      <h3 class="font-bold text-lg mb-3" id="pmVraagTitel"></h3>
      <input id="pmVraagVeld" type="text" class="input input-bordered w-full" maxlength="300" autocomplete="off">
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" value="annuleer">Annuleren</button>
        <button class="btn btn-primary btn-sm" value="ok">OK</button>
      </div>
    </form>
    <form method="dialog" class="modal-backdrop"><button value="annuleer">sluiten</button></form>
  </dialog>

  <dialog id="pmBevestig" class="modal">
    <form method="dialog" class="modal-box max-w-md">
      <p id="pmBevestigTekst" class="text-sm"></p>
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" value="annuleer">Annuleren</button>
        <button class="btn btn-error btn-sm" value="ok" id="pmBevestigKnop">OK</button>
      </div>
    </form>
    <form method="dialog" class="modal-backdrop"><button value="annuleer">sluiten</button></form>
  </dialog>

  <dialog id="pmProject" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-4" id="pmProjectTitel">Nieuw project</h3>
      <label class="form-control mb-3">
        <span class="label-text text-sm mb-1">Naam</span>
        <input id="pmProjectNaam" type="text" class="input input-bordered" maxlength="120" placeholder="bv. Nieuwe website OpenACP" autocomplete="off">
      </label>
      <div id="pmProjectOmschrijvingWrap">
        <label class="form-control mb-3">
          <span class="label-text text-sm mb-1">Waarover gaat het? <span class="opacity-50">(mag leeg)</span></span>
          <textarea id="pmProjectOmschrijving" class="textarea textarea-bordered" rows="3"></textarea>
        </label>
      </div>
      <div class="mb-3"><span class="label-text text-sm">Kleur</span><div id="pmProjectKleuren" class="flex flex-wrap gap-2 mt-1"></div></div>
      <div class="mb-2"><span class="label-text text-sm">Icoon</span><div id="pmProjectIconen" class="flex flex-wrap gap-1 mt-1"></div></div>
      <div id="pmProjectBeheer" class="hidden border-t border-base-content/10 pt-3 mt-3 flex flex-wrap gap-2">
        <button type="button" class="btn btn-ghost btn-sm" data-action="project-archief" id="pmProjectArchief">Archiveren</button>
        <button type="button" class="btn btn-ghost btn-sm text-error" data-action="project-weg" id="pmProjectWeg">Verwijderen</button>
      </div>
      <div class="modal-action">
        <form method="dialog"><button class="btn btn-ghost btn-sm">Annuleren</button></form>
        <button type="button" class="btn btn-primary btn-sm" data-action="project-bewaar">Bewaren</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <dialog id="pmOdoo" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-3">Koppelen aan Odoo</h3>
      <div class="flex gap-2 mb-3">
        <select id="pmOdooModel" class="select select-bordered select-sm" data-change="odoo-model"></select>
        <input id="pmOdooZoek" type="search" class="input input-bordered input-sm flex-1" placeholder="Naam, bedrijf of e-mail…" data-input="odoo-zoek" autocomplete="off">
      </div>
      <div id="pmOdooResultaten" class="max-h-80 overflow-y-auto"></div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost btn-sm">Sluiten</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <dialog id="pmAssets" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-bold text-lg mb-3">Kies een bestand uit Assetbeheer</h3>
      <div id="pmAssetsInhoud" class="max-h-96 overflow-y-auto"></div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost btn-sm">Sluiten</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>sluiten</button></form>
  </dialog>

  <div id="pmToast" class="toast toast-end z-[100]"></div>

  <script src="/projecten-core.js"></script>
  <script src="/projecten-views.js"></script>
  <script src="/projecten-taak.js"></script>
  <script src="/projecten-bootstrap.js"></script>
</body>
</html>
