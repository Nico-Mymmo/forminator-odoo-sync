<!--
  STAP - "Wat is de grootte van het gebouw?"

  De schuifbalk uit de Syndicoach-calculator, losgemaakt uit dat bestand en
  klaar om als eerste stap van een mymmo_form te plakken. Levert TWEE waarden:

      aantal_kavels        het getal onder de schuifbalk  (2 ... 60)
      commerciele_kavels   "ja" of "nee"                  (het vinkje erboven)

  Zet in de Operations Manager twee VERBORGEN VELDEN met precies die sleutels
  op het formulier. Bestaat een veld niet, dan blijft de bezoeker gewoon verder
  kunnen -- de waarde bereikt Odoo dan alleen niet, en dat staat in de console
  en boven het formulier. Andere sleutels nodig? Pas ze aan op de schuifbalk
  (data-mymmo-waarde) en op de wikkel (data-sleutel-commercieel); je hoeft
  nergens in het script te zijn.

  WAT HIER UIT DE CALCULATOR IS OVERGENOMEN
  -----------------------------------------
  De tekeningen (vijf niveaus x residentieel/commercieel, van link.openvme.be),
  de niveau-indeling, de squash-and-stretch bij een niveauwissel, de plop van
  het commercieel-vinkje, en de terugval op een lijnicoon als een bestand niet
  ophaalt. Wat NIET is meegekomen, is het "podium" -- de losse, absoluut
  gepositioneerde laag waarop de calculator het gebouw tussen zeven stappen
  door laat zweven, plus de zeven onzichtbare pin-ankers voor de ballonnetjes.
  Dat bestaat alleen omdat daar zeven stappen een tekening delen; hier staat de
  tekening gewoon in de stap, zoals de calculator dat op smalle schermen zelf
  ook doet.

  WAT DEZE STAP BEWUST NIET DOET
  ------------------------------
  Geen eigen kop, geen eigen wit kaartje, geen eigen Vorige/Volgende. Dat levert
  de plugin al: de titel die je bij de stap typt staat erboven, het paneel van
  de pop-up is het witte vlak, en de knoppenrij hoort bij de reeks. Bracht de
  stap dat zelf mee, dan stond alles twee keer -- en de tweede kop was niet uit
  te zetten zonder de HTML te bewerken.

  Een stap gaat dus over de VRAAG en het BEDIENINGSELEMENT. De omlijsting en het
  opvangen van de antwoorden zijn van de plugin.

  TWEE DINGEN OM TE ZIEN IN DIT BESTAND
  -------------------------------------
  1. `data-mymmo-waarde` op de schuifbalk. Dat is wat het getal doorgeeft --
     daar is geen regel JavaScript voor nodig. Het script hieronder tekent
     alleen het gebouw. Het vinkje is een <button> en geen invoerveld, dus die
     ene waarde wordt wel met api.zet() afgeleverd.
  2. Geen enkele `id=""`. Dezelfde stap kan twee keer op een pagina staan (in
     de tekst en in een pop-up); met vaste id's zou de tweede de eerste
     besturen. Alles loopt via querySelector binnen de eigen wikkel.

  Verander je de beginstand (`value` op de schuifbalk), pas dan ook de `src`
  van de <img> aan op het bijbehorende niveau (2-5 = level1, 6-15 = level2,
  16-25 = level3, 26-39 = level4, 40+ = level5). Het script corrigeert het
  meteen, maar zonder die aanpassing zie je bij het laden heel even de
  verkeerde tekening.
-->

<style>
/* Alles genest onder .sc-stap. Je thema kan hier niets breken, en omgekeerd.

.sc-stap {

     waarden uit de rekenmodule waar deze stap uit komt, en dan staat de

     De waarde na de komma is de terugval voor wie deze stap los gebruikt. */
  /* Het getal en de knop van de schuifbalk moeten GELEZEN worden: de inkt van

     `font-family: inherit` nu ook af op de wikkel van een stap, dus dit is

     gebruikt. */
  font-family: inherit;
  color: var(--sc-ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;

  /* Een kolom die de hoogte van de stap inneemt. De plugin laat de stap het

/* -- de tekening ---------------------------------------------------------- */
/*
 * DE TEKENING NEEMT DE VRIJE RUIMTE IN.
 *
 * Alle tien de tekeningen (vijf niveaus, met en zonder winkels) hebben hetzelfde
 * canvas van 2048 x 2048. Zolang ze in dezelfde vierkante doos staan, schalen ze
 * dus allemaal met dezelfde factor -- de kleine groeien mee met de grote.
 *
 * Gemeten: de grootste (level5comm) reikt van y=50 tot y=1807, dus 86% van de
 * hoogte, en heeft 241 (11,8%) lege ruimte onder zich. Met object-fit:contain
 * past hij per definitie in de doos, hoe groot die ook wordt.
 *
 * Vroeger zat de doos vast op max 210px breed en clamp(110px, 22vh, 210px) hoog,
 * terwijl er in de pop-up vaak twee keer zoveel ruimte vrij bleef. Nu krijgt het
 * vlak (.sc-bldg) wat er tussen het vinkje en het getal overblijft, met een
 * ondergrens voor een laag venster en een bovengrens voor een heel hoog.
 */
.sc-stap .sc-bldg {
  position: relative;
  flex: 1 1 0;
  /* Gemeten in de pop-up bij 1280x720: met 24vh als ondergrens scrolde het
     paneel 27px (de vorige versie deed daar 22px). Met 18vh past de stap ook
     daar zonder schuifbalk -- de tekening neemt dan precies de ruimte die er is. */
  min-height: clamp(110px, 18vh, 180px);
  max-height: 400px;
  margin: 0 0 6px;
  pointer-events: none;
}
.sc-stap .sc-bldg-img {
  /* Vierkant en onderaan gecentreerd, zo hoog als het vlak. Het draaipunt van
     de veer-animaties (--sc-bldg-ox) is een fractie van de breedte van DEZE
     doos; die klopt alleen omdat de doos het canvas exact volgt. */
  position: absolute;
  bottom: 0;
  left: 50%;
  height: calc(100% - 10px);
  aspect-ratio: 1 / 1;
  max-width: 100%;
  /* -50% centreert; +11.5% van de eigen hoogte schuift de lege strook onder de
     grondlijn weg (de grootste tekening heeft daar 11,8%, dus er wordt niets
     afgesneden). Zonder dat zweefde het gebouw boven het getal. `translate` is
     een aparte eigenschap, dus de `transform` van de animaties blijft werken. */
  translate: -50% 11.5%;
  transform-origin: bottom center;
}
.sc-stap .sc-bldg-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  object-position: bottom center;
}
/* Haalt een tekening niet op (offline, 404), dan valt ze terug op een klein

.sc-stap .sc-bldg-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8%;

}
.sc-stap .sc-bldg-fallback svg { width: 60%; height: 60%; }

.sc-stap .sc-slider { padding: 0 2px 2px; text-align: center; }
/*
 * HET GETAL STAAT OP DE AS VAN HET GEBOUW, NIET DE GROEP "8 kavels".
 *
 * Gemeten in de pop-up: vlak, tekening, schuifbalk en de groep getal+eenheid

 *
 * Drie kolommen: links een lege kolom even breed als rechts, in het midden het

/* -- het gebouw dat een niveau wint of verliest -------------------------------
   Anticipatie, sprong, uitdempen. De schaal is bewust niet-uniform
   (squash-and-stretch) en het draaipunt ligt op de grond, zodat het gebouw op
   zijn fundering blijft staan in plaats van te "zwellen". */
.sc-stap .sc-bldg-img.sc-pop { animation: sc-bldg-pop .5s cubic-bezier(.31, 1.7, .6, 1); }
.sc-stap .sc-bldg-img.sc-grow { animation: sc-bldg-grow .66s cubic-bezier(.3, .86, .32, 1); }
.sc-stap .sc-bldg-img.sc-shrink { animation: sc-bldg-shrink .6s cubic-bezier(.3, .86, .32, 1); }
/* De sprong naar niveau 5 gaat niet de hoogte in maar de breedte: er komt een
   vleugel naast. Daarom draait die beweging rond de linkeronderhoek van de
   tekening -- anders zet het gebouw ook naar links uit en dat leest als
   opblazen, niet als aanbouwen. */
.sc-stap .sc-bldg-img.sc-grow-x {
  transform-origin: var(--sc-bldg-ox, 23%) 100%;
  animation: sc-bldg-grow-x .66s cubic-bezier(.3, .86, .32, 1);
}
.sc-stap .sc-bldg-img.sc-shrink-x {
  transform-origin: var(--sc-bldg-ox, 23%) 100%;
  animation: sc-bldg-shrink-x .6s cubic-bezier(.3, .86, .32, 1);
}
.sc-stap .sc-bldg-img.sc-comm {
  transform-origin: var(--sc-bldg-ox, 23%) 100%;
  animation: sc-bldg-comm .58s cubic-bezier(.3, .86, .32, 1);
}
@keyframes sc-bldg-pop {
  0% { transform: scale(.88); }
  40% { transform: scale(1.1); }
  70% { transform: scale(.97); }
  100% { transform: scale(1); }
}
/* groeien: door de knieen, dan omhoog schieten, dan uitdempen. De uitslagen
   zijn bewust klein -- het moet aanvoelen alsof het gebouw er even doorheen
   veert, niet alsof het van rubber is. */
@keyframes sc-bldg-grow {
  0% { transform: scale(1, 1); }
  13% { transform: scale(1.03, .955); }
  40% { transform: scale(.967, 1.053); }
  62% { transform: scale(1.017, .98); }
  80% { transform: scale(.994, 1.008); }
  92% { transform: scale(1.002, .997); }
  100% { transform: scale(1, 1); }
}
/* krimpen: eerst even rekken, dan inzakken, dan uitdempen */
@keyframes sc-bldg-shrink {
  0% { transform: scale(1, 1); }
  13% { transform: scale(.977, 1.037); }
  42% { transform: scale(1.036, .95); }
  64% { transform: scale(.987, 1.018); }
  82% { transform: scale(1.005, .994); }
  100% { transform: scale(1, 1); }
}
/* breder worden: eerst samentrekken naar links, dan naar rechts uitschieten */
@keyframes sc-bldg-grow-x {
  0% { transform: scale(1, 1); }
  13% { transform: scale(.963, 1.019); }
  40% { transform: scale(1.046, .975); }
  62% { transform: scale(.986, 1.011); }
  80% { transform: scale(1.006, .995); }
  92% { transform: scale(.998, 1.002); }
  100% { transform: scale(1, 1); }
}
/* smaller worden: eerst even naar rechts uitrekken, dan terugtrekken */
@keyframes sc-bldg-shrink-x {
  0% { transform: scale(1, 1); }
  13% { transform: scale(1.031, .983); }
  42% { transform: scale(.959, 1.029); }
  64% { transform: scale(1.012, .992); }
  82% { transform: scale(.996, 1.003); }
  100% { transform: scale(1, 1); }
}
/* commerciele kavels aan/uit: linksonderaan ploppen een winkeldeur en een
   luifel in de tekening. Het gebouw zet zich eerst schrap, vangt dan de
   landing op met een korte indeuking, en dempt uit. Kleinere uitslag dan bij
   een niveauwissel: er verandert een detail, niet het hele gebouw. */
@keyframes sc-bldg-comm {
  0% { transform: scale(1, 1); }
  12% { transform: scale(.986, 1.016); }
  36% { transform: scale(1.03, .964); }
  58% { transform: scale(.99, 1.013); }
  78% { transform: scale(1.005, .995); }
  100% { transform: scale(1, 1); }
}

/* Wie beweging heeft uitgezet, krijgt de wissel zonder veren. */
@media (prefers-reduced-motion: reduce) {
  .sc-stap .sc-bldg-img.sc-pop,
  .sc-stap .sc-bldg-img.sc-grow,
  .sc-stap .sc-bldg-img.sc-shrink,
  .sc-stap .sc-bldg-img.sc-grow-x,
  .sc-stap .sc-bldg-img.sc-shrink-x,
  .sc-stap .sc-bldg-img.sc-comm { animation: none; }
}
</style>

<script>
MymmoStappen.stap(document.currentScript, function (api) {
  var wortel = api.el.querySelector('.sc-stap');
  if (!wortel) return;

  var BASIS = wortel.getAttribute('data-basis') || '';
  var SLEUTEL_COMM = wortel.getAttribute('data-sleutel-commercieel') || 'commerciele_kavels';

  /* Welk niveau hoort bij welk aantal kavels. Vijf tekeningen, twee reeksen
     (met en zonder commerciele kavels). */
  var NIVEAUS = [
    { max: 5, level: 1 }, { max: 15, level: 2 }, { max: 25, level: 3 },
    { max: 39, level: 4 }, { max: Infinity, level: 5 }
  ];
  var BESTAND = {
    1: 'app_level1.svg', 2: 'app_level2.svg', 3: 'app_level3.svg',
    4: 'app_level4.svg', 5: 'app_level5.svg'
  };
  var BESTAND_COMM = {
    1: 'app_level1comm.svg', 2: 'app_level2comm.svg', 3: 'app_level3comm.svg',
    4: 'app_level4comm.svg', 5: 'app_level5comm.svg'
  };

  /* Waar staat de tekening werkelijk in haar kader? Een gebouw-svg heeft lucht
     boven en naast zich. Deze fracties zijn eenmalig uit de originele
     bestanden gemeten en bepalen het draaipunt van de breedtegroei. */
  var LINKS = { 1: .311, 2: .282, 3: .230, 4: .230, 5: .230 };

  /* Tot en met niveau 4 wordt het gebouw hoger; op niveau 5 komt er een
     vleugel naast en groeit het in de breedte. De beweging volgt die as,
     anders klopt de anticipatie niet met wat je ziet gebeuren. Verandert er
     later iets aan de tekeningen, dan is dit het enige dat je bijstelt. */
  var BREEDTEGROEI = 5;
  var ANIM = ['sc-pop', 'sc-grow', 'sc-shrink', 'sc-grow-x', 'sc-shrink-x', 'sc-comm'];

  var range = wortel.querySelector('[data-rol="range"]');
  var kv = wortel.querySelector('[data-rol="kv"]');
  var kvu = wortel.querySelector('[data-rol="kv-u"]');
  var bldg = wortel.querySelector('[data-rol="bldg"]');
  var knop = wortel.querySelector('[data-rol="commercieel"]');
  if (!range || !bldg) return;

  var maximum = parseInt(range.getAttribute('max'), 10) || 60;

  /* Komt de bezoeker terug van een MISLUKTE inzending, dan staat zijn antwoord
     nog in het verborgen veld (de plugin schrijft de POST terug) maar niet op
     de schuifbalk -- die is statische HTML uit wp-admin en staat dus weer op
     haar beginstand. Zonder deze regel ziet hij 8 staan terwijl hij 30 koos,
     en drukt hij op Verzenden met de verkeerde waarde. */
  var bewaard = parseInt(api.lees(range.getAttribute('data-mymmo-waarde')), 10);
  if (bewaard >= parseInt(range.getAttribute('min'), 10) && bewaard <= maximum) {
    range.value = String(bewaard);
  }

  var commercieel = api.lees(SLEUTEL_COMM) === 'ja';
  var niveau = niveauVan(getal());
  var swapT = null;

  function getal() { return parseInt(range.value, 10) || 0; }

  function niveauVan(k) {
    for (var i = 0; i < NIVEAUS.length; i += 1) {
      if (k <= NIVEAUS[i].max) return NIVEAUS[i].level;
    }
    return 5;
  }

  function bron(level, comm) {
    var map = comm ? BESTAND_COMM : BESTAND;
    return BASIS + (map[level] || BESTAND[level]);
  }

  /* Vervangt de bron van de bestaande <img> in plaats van het element opnieuw
     op te bouwen. Dat laatste kost de browser altijd een frame -- ook als de
     afbeelding al in de cache zit -- en dat zie je als een flits bij elke
     wissel. Staat de tekening op haar fallback-icoon, dan bouwen we wel
     opnieuw op. */
  function teken() {
    var img = bldg.querySelector('.sc-bldg-photo');
    if (img) {
      var s = bron(niveau, commercieel);
      if (img.getAttribute('src') !== s) img.setAttribute('src', s);
      return;
    }
    img = document.createElement('img');
    img.className = 'sc-bldg-photo';
    img.alt = '';
    img.setAttribute('loading', 'eager');
    img.setAttribute('decoding', 'sync');
    bewaakLaden(img);
    bldg.innerHTML = '';
    bldg.appendChild(img);
    img.src = bron(niveau, commercieel);
  }

  /* Haalt de tekening niet op, dan komt er een lijnicoon in de plaats. Geen
     globale window-functie en geen inline onerror: dezelfde stap kan twee keer
     op een pagina staan. */
  function bewaakLaden(img) {
    img.addEventListener('error', function () {
      if (!img.parentNode) return;
      var span = document.createElement('span');
      span.className = 'sc-bldg-fallback';
      span.setAttribute('aria-hidden', 'true');
      span.innerHTML = '<svg class="sc-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">' +
        '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/>' +
        '<path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg>';
      img.parentNode.replaceChild(span, img);
    });
  }

  function draaipunt() {
    var f = LINKS[niveau];
    if (f) bldg.style.setProperty('--sc-bldg-ox', (f * 100).toFixed(1) + '%');
  }

  function beweeg(cls) {
    draaipunt();
    for (var i = 0; i < ANIM.length; i += 1) bldg.classList.remove(ANIM[i]);
    void bldg.offsetWidth;                 /* forceer reflow zodat de animatie herstart */
    bldg.classList.add(cls);
    if (bldg._eind) bldg.removeEventListener('animationend', bldg._eind);
    bldg._eind = function (ev) {
      if (ev.target !== bldg) return;
      bldg.classList.remove(cls);
      bldg.removeEventListener('animationend', bldg._eind);
      bldg._eind = null;
    };
    bldg.addEventListener('animationend', bldg._eind);
  }

  /* De tekening wisselt niet op tel nul maar op het dieptepunt van de
     anticipatie: op dat moment zit het gebouw samengedrukt en valt de wissel
     nauwelijks op -- wat erna komt leest als een beweging in plaats van als een
     plaatje dat verspringt. Sleept iemand snel door meerdere niveaus, dan
     schuift de wissel gewoon mee op. */
  function wisselNa(ms) {
    clearTimeout(swapT);
    swapT = setTimeout(function () { swapT = null; teken(); }, ms);
  }

  function toonGetal() {
    var k = getal();
    if (kv) kv.textContent = String(k);
    if (kvu) kvu.textContent = k >= maximum ? 'kavels of meer' : 'kavels';
  }

  range.addEventListener('input', function () {
    toonGetal();
    var nieuw = niveauVan(getal());
    if (nieuw === niveau) return;
    var as = Math.max(niveau, nieuw) >= BREEDTEGROEI ? '-x' : '';
    var cls = (nieuw < niveau ? 'sc-shrink' : 'sc-grow') + as;
    niveau = nieuw;
    beweeg(cls);
    wisselNa(88);
  });

  if (knop) {
    knop.addEventListener('click', function () {
      commercieel = !commercieel;
      knop.classList.toggle('is-on', commercieel);
      knop.setAttribute('aria-pressed', commercieel ? 'true' : 'false');
      api.zet(SLEUTEL_COMM, commercieel ? 'ja' : 'nee');
      beweeg('sc-comm');
      wisselNa(72);   /* net na het schrap zetten, zodat de landing de plop opvangt */
    });
  }

  /* Beginstand. Het getal komt al mee via data-mymmo-waarde; het vinkje niet,
     dus dat zetten we hier expliciet -- anders staat er in Odoo niets in plaats
     van "nee". */
  var eerste = bldg.querySelector('.sc-bldg-photo');
  if (eerste) bewaakLaden(eerste);
  if (knop) {
    knop.classList.toggle('is-on', commercieel);
    knop.setAttribute('aria-pressed', commercieel ? 'true' : 'false');
  }
  api.zet(SLEUTEL_COMM, commercieel ? 'ja' : 'nee');
  toonGetal();
  draaipunt();
  teken();

  /* Komt de stap opnieuw in beeld (terug vanuit het formulier), dan staan de
     waarden er nog: de schuifbalk houdt zijn stand en de tekening klopt al.
     Een plop maakt zichtbaar dat je terug bent. */
  api.bij('tonen', function () { beweeg('sc-pop'); });
});
</script>
