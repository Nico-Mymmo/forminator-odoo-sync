<!--
  STAP - "Wanneer is jullie volgende algemene vergadering?"

  Een KADER met een breed foutenvenster: de bezoeker schuift een maandlijn onder
  een vast kader door (de merktekening `thingies/frame.svg`). Bovenaan staan twee
  kalenderblaadjes (van - tot), de merktekeningen thingies_calendar1.svg en
  thingies-calendar2.svg: het getal bovenaan, de maand in het mintvlak. Altijd
  even groot; alleen het getal doet een kleine plop als het verspringt.

  De lijn is JAARLOOS en loopt rond: een algemene vergadering valt elk jaar rond
  dezelfde tijd, dus je kan net zo goed terug naar augustus als vooruit naar
  januari. Er staat nergens een jaartal.

  Er zijn maar zes ankerdagen per maand: 5, 10, 15, 20, 25 en 30 (in februari de
  laatste dag in plaats van 30). Een venster loopt van een anker tot drie ankers
  verder, dus altijd ongeveer twee weken, en de lijn springt per anker:

      tussen 5 en 20 oktober        tussen 20 oktober en 5 november
      tussen 10 en 25 oktober       tussen 25 oktober en 10 november
      tussen 15 en 30 oktober       tussen 30 oktober en 15 november

  Op de blaadjes staat altijd maand + dag. In `volgende_av_periode` staat de
  maand een keer als het venster in een maand blijft, anders beide.

  Levert VIER waarden af:

      volgende_av_periode   "tussen 5 en 20 oktober" | "tussen 20 oktober en 5 november" | "onbekend"
                          (zonder jaartal: het is een moment dat elk jaar terugkeert)
      volgende_av_van       begin van het venster, eerstvolgende keer, JJJJ-MM-DD
      volgende_av_tot       einde van het venster, JJJJ-MM-DD
      volgende_av_datum     het midden van het venster, JJJJ-MM-DD

  Zet ze als VERBORGEN VELDEN op het formulier. Zet `volgende_av_periode` bij de
  stap in "Levert deze sleutels": dan blijft "Volgende" uit tot er een periode of
  "Nog geen idee" gekozen is. Bij "Nog geen idee" zijn de drie datums leeg.

  Bediening: swipen op een telefoon (gewoon horizontaal scrollen), slepen of het
  muiswieltje op een computer, pijltjes (een anker) en Page Up/Down (een maand),
  of tikken op de lijn. Na het loslaten klikt de lijn vast op het dichtste
  venster; zolang er een vinger op ligt niet.

  De lijn opent ongeveer zes weken vooruit, maar dat telt NIET als antwoord: pas
  als de bezoeker de lijn beroert, staat er een waarde.

  Regels, zie claude.md: het script bevat uitsluitend ASCII en geen en-teken,
  kleiner- of groter-dan of sluit-tag (vergelijken met Math.min/Math.max, lussen
  met !==); geen inline SVG; geen leeg element in de markup. De maandnamen maakt
  het script zelf in de browser.
-->

<style>
.mf-av {
  --av-accent: var(--mf-accent, #99f6e4);
  --av-muted: var(--mf-muted, #6b7280);
  /* De leesbare merkkleur (bij Syndicoach #0369a1), dezelfde als in het kader. */
  --av-inkt: var(--mf-accent-ink, #0369a1);
  --av-dag: 10px;

  /* GEEN font-family en GEEN padding op de stap: allebei van de plugin. */
  color: var(--av-inkt);
  display: flex;
  flex-direction: column;
  flex: 1 0 auto;
}
.mf-av *, .mf-av *::before, .mf-av *::after { box-sizing: border-box; }

.mf-av .mf-av-midden {
  margin-block: auto;
  padding: 12px 0 4px;
}

/* De kop: "MEESTAL TUSSEN" klein erboven, daaronder twee SCHEURKALENDERBLAADJES
   (van - tot). Ze hebben een vaste maat, wat er ook op staat: de kop en de lijn
   eronder verspringen dus nooit, en alles staat rond een vast middelpunt. Bewust
   GEEN animatie bij het wisselen. */
.mf-av .mf-av-kop {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  line-height: 1;
  color: var(--av-inkt);
  transition: opacity .2s ease;
}
.mf-av .mf-av-aanloop {
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: .7;
  margin-bottom: 16px;
}
.mf-av .mf-av-blaadjes {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.mf-av .mf-av-blad {
  /* De merktekeningen thingies_calendar1.svg en thingies-calendar2.svg (let op:
     de eerste met underscore, de tweede met streepje). Beide 262,76 x 310,34.
     Het getal staat in het witte vak bovenaan, de maand in het mintvlak.
     De vakken zijn opgemeten in procent van de tekening. */
  position: relative;
  width: clamp(112px, 30vw, 136px);
  aspect-ratio: 262.76 / 310.34;
  /* Tekst schaalt mee met het blaadje (cqw), zodat "september" altijd in het
     mintvlak past, hoe breed het blaadje ook is. */
  container-type: inline-size;
}
.mf-av .mf-av-blad-beeld {
  position: absolute;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  margin: 0;
  -webkit-user-select: none;
  user-select: none;
}
.mf-av .mf-av-blad-dag,
.mf-av .mf-av-blad-maand {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  color: var(--av-inkt);
}
/* Wit vak: binnen het kader, boven het mintvlak. */
.mf-av .mf-av-blad-dag {
  top: 12%;
  height: 39%;
  left: 15%;
  right: 11%;
  font-size: 2.6rem;
  font-size: 36cqw;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.mf-av .mf-av-blad-dag.is-plop { animation: av-plop .34s cubic-bezier(.3,.9,.4,1.4); }
/* Eerst een tikje in (anticipatie), dan voorbij de maat, dan terug. */
@keyframes av-plop {
  0%   { scale: 1; }
  28%  { scale: .86; }
  64%  { scale: 1.12; }
  100% { scale: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .mf-av .mf-av-blad-dag.is-plop { animation: none; }
}
/* Mintvlak, opgemeten uit de SVG's (viewBox 262,76 x 310,34). Het mint loopt
   rechts onder de kaderlijn door, dus het ZICHTBARE deel telt:
     blad 1: x 20,7% tot 87%   (mint 54,5-241,4, kaderlijn rechts rond 229)
     blad 2: x 18% tot 85%     (mint 47,2-234,3, kaderlijn rechts rond 224)
     beide:  y 53,5% tot 87%   (mint vanaf 162-170, onderkant 270-274)
   De maand staat in het midden van dat zichtbare deel. */
.mf-av .mf-av-blad-maand {
  top: 53.5%;
  height: 33.5%;
  font-size: .8rem;
  /* "september" is gemeten 4,9 keer zo breed als de lettergrootte in dit gewicht;
     11,5cqw maakt het 56% van het blaadje, in een zichtbaar mintvlak van 66%. */
  font-size: 11.5cqw;
  font-weight: 700;
  letter-spacing: -.01em;
}
.mf-av .mf-av-blad--van .mf-av-blad-maand { left: 20.7%; width: 66.3%; }
.mf-av .mf-av-blad--tot .mf-av-blad-maand { left: 18%; width: 67%; }
.mf-av .mf-av-tot {
  font-size: 1.1rem;
  opacity: .6;
}

/* Nog niets gekozen: de lijn toont een voorstel, geen antwoord. */
.mf-av.is-open .mf-av-kop { opacity: .38; }
.mf-av.is-onbekend .mf-av-blaadjes { visibility: hidden; }
.mf-av .mf-av-hint {
  display: block;
  min-height: 1.4em;
  margin-top: 10px;
  text-align: center;
  font-size: .88rem;
  color: var(--av-muted);
}

/* De lijn met het kader erover. */
.mf-av .mf-av-wielvak {
  position: relative;
  margin-top: 18px;
  height: 96px;
}
/* Het kader staat vast in het midden en ligt ACHTER de lijn: de maandnaam die
   erin valt, staat zo op het mintvlak, zoals in de tekening. De mintvlek in
   frame.svg loopt van x=52.9 tot x=351.8 van 367.7 breed (81,29%, links 14,39%):
   het kader wordt zo geschaald dat dat stuk een HALVE MAAND breed is: een maand
   staat op de lijn als 4,3 weken (30,1 dagen), het kader dus op 15,05 dagen --
   exact drie ankers, zoals een venster. */
.mf-av .mf-av-kader {
  position: absolute;
  top: 8px;
  left: calc(50% - 7.525 * var(--av-dag) - 15.05 * var(--av-dag) / 0.8129 * 0.1439);
  width: calc(15.05 * var(--av-dag) / 0.8129);
  max-width: none;
  height: auto;
  margin: 0;
  pointer-events: none;
  -webkit-user-select: none;
  user-select: none;
}
.mf-av.is-onbekend .mf-av-wielvak { opacity: .3; }

.mf-av .mf-av-wiel {
  position: absolute;
  inset: 0;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  cursor: grab;
  outline: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.mf-av .mf-av-wiel::-webkit-scrollbar { display: none; }
.mf-av .mf-av-wiel.is-slepen { cursor: grabbing; }
.mf-av .mf-av-wiel:focus-visible { outline: 2px dashed var(--av-inkt); outline-offset: -2px; }

.mf-av .mf-av-spoor { position: relative; height: 100%; }
.mf-av .mf-av-baan {
  position: absolute;
  top: 0;
  bottom: 0;
  color: transparent;
}

<script>
MymmoStappen.stap(document.currentScript, function (api) {
  /* LEES DIT VOOR JE DIT SCRIPT AANPAST.
     Uitsluitend ASCII, en geen en-teken, kleiner- of groter-dan of sluit-tag: op
     syndicoach.be wordt de HTML van een stap onderweg herschreven en parst een
     script met die tekens niet meer. Vergelijk dus met Math.min en Math.max, en
     schrijf lussen met !== in plaats van een kleiner-dan. */

  var wortel = api.el.querySelector('.mf-av');
  if (!wortel) return;

  function rol(naam) { return wortel.querySelector('[data-rol="' + naam + '"]'); }
  var wiel = rol('wiel');
  var spoor = rol('spoor');
  var baan = rol('baan');
  var elAanloop = rol('aanloop');
  var bladVan = rol('blad-van');
  var bladTot = rol('blad-tot');
  var elHint = rol('hint');
  var knopOnbekend = rol('onbekend');
  if (!wiel || !spoor || !baan) return;

  var PX = 10;            /* pixels per dag; gelijk aan --av-dag */
  /* Een maand is op de lijn altijd 4,3 weken breed, wat de maand ook echt telt.
     De zes ankers (5, 10, 15, 20, 25, 30) liggen er op gelijke afstand in:
     anker k van het jaar (0 = 5 januari, 71 = 30 december) ligt op (k + 1) / 6
     maand. Een venster van drie ankers is dus exact een halve maand. */
  var MAAND = 4.3 * 7 * PX;
  var JAAR = 12 * MAAND;
  var ANKERS = 72;
  /* De lijn is JAARLOOS en loopt rond: na december komt januari, voor januari
     december. Ze bestaat uit vijf kopieen van een jaar; na elk schuiven springt
     ze onzichtbaar terug naar de middelste, zodat je nooit een einde bereikt. */
  var KOPIEEN = 5;
  var MIDDEN_KOPIE = 2;
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli',
                 'augustus', 'september', 'oktober', 'november', 'december'];

  var vandaag = new Date();
  var basis = new Date(vandaag.getFullYear(), vandaag.getMonth(), vandaag.getDate());

  function minstens(a, b) { return Math.max(a, b) === a; }
  function klem(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
  function rond(k) { return ((k % ANKERS) + ANKERS) % ANKERS; }
  function twee(n) { return ('0' + n).slice(-2); }
  function iso(d) { return d.getFullYear() + '-' + twee(d.getMonth() + 1) + '-' + twee(d.getDate()); }
  function dagenIn(j, m) { return new Date(j, m + 1, 0).getDate(); }
  function indexVan(d) { return Math.round((d - basis) / 86400000); }

  wortel.style.setProperty('--av-dag', PX + 'px');

  /* ---- Vensters: van anker k tot anker k + 3, rond het jaar ---- */

  function ankerMaand(k) { return Math.floor(rond(k) / 6); }
  function ankerDag(k) { return (rond(k) % 6 + 1) * 5; }
  /* 30 februari bestaat niet: dan de laatste dag (in een gewoon jaar). */
  function toonDag(k) { return Math.min(ankerDag(k), dagenIn(2025, ankerMaand(k))); }

  var vensters = [];
  (function () {
    var k = 0;
    while (k !== ANKERS) {
      vensters.push({
        k: k,
        vanM: ankerMaand(k), vanD: toonDag(k),
        totM: ankerMaand(k + 3), totD: toonDag(k + 3)
      });
      k = k + 1;
    }
  })();

  /* Positie op de lijn van venster k in een bepaalde kopie van het jaar. */
  function positie(kRuw) { return (kRuw + 2.5) / 6 * MAAND; }
  function kRuwBij(px) { return Math.round(px / MAAND * 6 - 2.5); }

  /* De eerstvolgende keer dat dit venster voorkomt, voor de datumvelden. */
  function eerstvolgende(v) {
    var j = vandaag.getFullYear();
    var van = new Date(j, v.vanM, Math.min(ankerDag(v.k), dagenIn(j, v.vanM)));
    if (!minstens(indexVan(van), 1)) {
      j = j + 1;
      van = new Date(j, v.vanM, Math.min(ankerDag(v.k), dagenIn(j, v.vanM)));
    }
    var jt = minstens(v.totM, v.vanM) ? j : j + 1;
    var tot = new Date(jt, v.totM, Math.min(ankerDag(v.k + 3), dagenIn(jt, v.totM)));
    return { van: van, tot: tot };
  }

  function vensterVoorDatum(d) {
    return rond(d.getMonth() * 6 + klem(Math.round(d.getDate() / 5), 1, 6) - 1);
  }

  var pad = 0;
  /* Het wiel opent op het venster dat ongeveer vijf weken vooruit begint. */
  var huidig = vensterVoorDatum(new Date(basis.getFullYear(), basis.getMonth(), basis.getDate() + 35));
  var bewaard = -1;
  var gekozen = false;
  var stil = true;
  var rustTimer = null;
  var sleep = null;
  var negeerKlik = false;
  var vinger = false;

  /* ---- De lijn: maandnaam in het midden, streepje op het begin van elke maand ---- */

  (function () {
    var i = 0;
    while (i !== KOPIEEN * 12) {
      var naam = document.createElement('span');
      naam.className = 'mf-av-maandnaam';
      naam.textContent = MAANDEN[i % 12];
      naam.style.left = ((i + 0.5) * MAAND) + 'px';
      baan.appendChild(naam);

      var grens = document.createElement('span');
      grens.className = 'mf-av-grens';
      grens.textContent = '|';
      grens.style.left = (i * MAAND) + 'px';
      baan.appendChild(grens);
      i = i + 1;
    }
  })();
  baan.removeChild(baan.firstChild);

  function maat() {
    pad = Math.round(wiel.clientWidth / 2);
    spoor.style.width = (pad * 2 + KOPIEEN * JAAR) + 'px';
    baan.style.left = pad + 'px';
    baan.style.width = (KOPIEEN * JAAR) + 'px';
  }

  /* ---- Tekst ---- */

  /* Twee kalenderblaadjes: altijd even groot, wat er ook op staat. Het blaadje
     zelf beweegt niet; het GETAL doet een kleine anticipatie en een plop als het
     verspringt. */
  function zetBlad(blad, maand, dag) {
    var elMaand = blad.querySelector('.mf-av-blad-maand');
    var elDag = blad.querySelector('.mf-av-blad-dag');
    var nieuw = MAANDEN[maand] + ' ' + dag;
    if (blad.getAttribute('data-waarde') === nieuw) return;
    blad.setAttribute('data-waarde', nieuw);
    elMaand.textContent = MAANDEN[maand];
    if (elDag.textContent !== String(dag)) {
      elDag.textContent = String(dag);
      elDag.classList.remove('is-plop');
      void elDag.offsetWidth;
      elDag.classList.add('is-plop');
    }
  }

  /* Zonder jaartal: een algemene vergadering valt elk jaar rond dezelfde tijd, dus
     we vragen een terugkerend moment, geen datum. */
  function zin(v) {
    if (v.vanM === v.totM) {
      return 'tussen ' + v.vanD + ' en ' + v.totD + ' ' + MAANDEN[v.totM];
    }
    return 'tussen ' + v.vanD + ' ' + MAANDEN[v.vanM] + ' en ' + v.totD + ' ' + MAANDEN[v.totM];
  }

  function toon() {
    if (knopOnbekend.getAttribute('aria-pressed') === 'true') {
      elAanloop.textContent = 'nog geen idee';
      elHint.textContent = 'Geen probleem, dat bespreken we samen.';
      wiel.setAttribute('aria-valuetext', 'Nog geen idee');
      return;
    }
    var v = vensters[huidig];
    elAanloop.textContent = 'meestal tussen';
    zetBlad(bladVan, v.vanM, v.vanD);
    zetBlad(bladTot, v.totM, v.totD);
    elHint.textContent = gekozen ? '' : 'Schuif of tik op de lijn om te kiezen';
    wiel.setAttribute('aria-valuetext', zin(v));
  }

  function bewaar() {
    if (knopOnbekend.getAttribute('aria-pressed') === 'true') {
      api.zet('volgende_av_periode', 'onbekend');
      api.zet('volgende_av_datum', '');
      api.zet('volgende_av_van', '');
      api.zet('volgende_av_tot', '');
      return;
    }
    if (!gekozen) return;
    var v = vensters[huidig];
    var e = eerstvolgende(v);
    api.zet('volgende_av_periode', zin(v));
    api.zet('volgende_av_van', iso(e.van));
    api.zet('volgende_av_tot', iso(e.tot));
    var helft = Math.round((indexVan(e.tot) - indexVan(e.van)) / 2);
    api.zet('volgende_av_datum', iso(new Date(e.van.getFullYear(), e.van.getMonth(), e.van.getDate() + helft)));
  }

  /* ---- Schuiven ---- */

  function kies() {
    if (knopOnbekend.getAttribute('aria-pressed') === 'true') {
      knopOnbekend.setAttribute('aria-pressed', 'false');
      wortel.classList.remove('is-onbekend');
    }
    gekozen = true;
    bewaard = huidig;
    wortel.classList.remove('is-open');
    bewaar();
    toon();
  }

  function naarRuw(kRuw) {
    huidig = rond(kRuw);
    wiel.scrollTo({ left: positie(kRuw), behavior: 'smooth' });
  }

  function inRust() {
    if (sleep) return;
    if (vinger) return;
    var kRuw = kRuwBij(wiel.scrollLeft);
    /* Terug naar de middelste kopie, onzichtbaar: de lijn ziet er in elke kopie
       hetzelfde uit. */
    var kopie = Math.floor(kRuw / ANKERS);
    if (kopie !== MIDDEN_KOPIE) {
      var verschuiving = (kopie - MIDDEN_KOPIE) * JAAR;
      wiel.scrollLeft = wiel.scrollLeft - verschuiving;
      kRuw = kRuw - (kopie - MIDDEN_KOPIE) * ANKERS;
    }
    var doelPx = positie(kRuw);
    if (!minstens(0.5, Math.abs(wiel.scrollLeft - doelPx))) {
      wiel.scrollTo({ left: doelPx, behavior: 'smooth' });
    }
    var doel = rond(kRuw);
    if (stil) return;
    if (doel !== bewaard || !gekozen) {
      huidig = doel;
      kies();
    }
  }

  wiel.addEventListener('scroll', function () {
    var i = rond(kRuwBij(wiel.scrollLeft));
    if (i !== huidig) {
      huidig = i;
      /* De bezoeker schuift zelf: vanaf de eerste wissel is het geen voorstel
         meer, dus niet meer grijs. Bewaard wordt pas bij het loslaten. */
      if (!stil) wortel.classList.remove('is-open');
      toon();
    }
    clearTimeout(rustTimer);
    rustTimer = setTimeout(inRust, 130);
  }, { passive: true });

  function wakker() { stil = false; }

  wiel.addEventListener('touchstart', function () { wakker(); vinger = true; }, { passive: true });
  function vingerLos() {
    vinger = false;
    clearTimeout(rustTimer);
    rustTimer = setTimeout(inRust, 130);
  }
  wiel.addEventListener('touchend', vingerLos, { passive: true });
  wiel.addEventListener('touchcancel', vingerLos, { passive: true });

  wiel.addEventListener('wheel', function (e) {
    var dx = e.deltaX;
    var dy = e.deltaY;
    var stap = Math.max(Math.abs(dx), Math.abs(dy)) === Math.abs(dy) ? dy : dx;
    if (stap === 0) return;
    e.preventDefault();
    wakker();
    wiel.scrollLeft = wiel.scrollLeft + stap;
  }, { passive: false });

  wiel.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') return;
    wakker();
    sleep = { x: e.clientX, begin: wiel.scrollLeft, bewogen: false };
    wiel.classList.add('is-slepen');
    wiel.setPointerCapture(e.pointerId);
  });
  wiel.addEventListener('pointermove', function (e) {
    if (!sleep) return;
    var dx = e.clientX - sleep.x;
    if (minstens(Math.abs(dx), 4)) sleep.bewogen = true;
    wiel.scrollLeft = sleep.begin - dx;
  });
  function loslaten() {
    if (!sleep) return;
    negeerKlik = sleep.bewogen;
    sleep = null;
    wiel.classList.remove('is-slepen');
    inRust();
  }
  wiel.addEventListener('pointerup', loslaten);
  wiel.addEventListener('pointercancel', loslaten);

  /* Tikken op de lijn schuift het venster rond die plek in het kader. */
  wiel.addEventListener('click', function (e) {
    if (negeerKlik) {
      negeerKlik = false;
      return;
    }
    wakker();
    var x = e.clientX - wiel.getBoundingClientRect().left + wiel.scrollLeft - pad;
    var kRuw = kRuwBij(x);
    if (rond(kRuw) === huidig) {
      kies();
      return;
    }
    naarRuw(kRuw);
  });

  wiel.addEventListener('keydown', function (e) {
    var sprong = { ArrowLeft: -1, ArrowRight: 1, ArrowDown: 1, ArrowUp: -1, PageUp: -6, PageDown: 6 }[e.key];
    if (!sprong) return;
    e.preventDefault();
    wakker();
    naarRuw(kRuwBij(wiel.scrollLeft) + sprong);
  });

  knopOnbekend.addEventListener('click', function () {
    var aan = knopOnbekend.getAttribute('aria-pressed') !== 'true';
    knopOnbekend.setAttribute('aria-pressed', aan ? 'true' : 'false');
    wortel.classList.toggle('is-onbekend', aan);
    if (aan) {
      wortel.classList.remove('is-open');
      bewaar();
    } else {
      gekozen = false;
      wortel.classList.add('is-open');
      api.zet('volgende_av_periode', '');
    }
    toon();
  });

  /* ---- Beginstand ---- */

  (function () {
    var periode = String(api.lees('volgende_av_periode') || '').trim();
    var van = String(api.lees('volgende_av_van') || '').trim().split('-');
    if (periode === 'onbekend') {
      knopOnbekend.setAttribute('aria-pressed', 'true');
      wortel.classList.add('is-onbekend');
      wortel.classList.remove('is-open');
      return;
    }
    if (van.length === 3) {
      var d = new Date(Number(van[0]), Number(van[1]) - 1, Number(van[2]));
      if (!isNaN(d.getTime())) {
        huidig = vensterVoorDatum(d);
        bewaard = huidig;
        gekozen = true;
        wortel.classList.remove('is-open');
      }
    }
  })();

  /* Opnieuw meten en terugzetten, zonder dat het als antwoord telt. De stap staat
     verborgen (en de pop-up dicht) tot ze aan de beurt is: dan is de breedte 0.
     Meten gebeurt dus pas als de lijn echt breedte krijgt. */
  var laatsteBreedte = -1;
  function herschik() {
    var breedte = wiel.clientWidth;
    if (breedte === laatsteBreedte) return;
    laatsteBreedte = breedte;
    if (breedte === 0) return;
    var wasStil = stil;
    var i = huidig;
    stil = true;
    maat();
    wiel.scrollLeft = positie(MIDDEN_KOPIE * ANKERS + i);
    huidig = i;
    toon();
    setTimeout(function () { stil = wasStil; }, 200);
  }

  toon();
  herschik();
  if (window.ResizeObserver) {
    new ResizeObserver(herschik).observe(wiel);
  } else {
    window.addEventListener('resize', herschik);
  }
  api.bij('tonen', herschik);
});
</script>
